<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Планы сотрудников — Skillaz Start</title>
<link rel="stylesheet" href="../assets/styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script src="../assets/ds_bundle.js"></script>
<script src="../assets/data.js"></script>
<script type="text/babel" src="../assets/shell.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Card, Tag, Table, Tabs, Input, Select, ProgressBar, Button, Tooltip, Modal, Textarea, Snackbar, Alert, Checkbox, Radio } = window.SkillazCoreDesignSystem_bf9566;
const { AppShell, Icons } = window.Site;
const {
  IconSearch, IconPlusSm, IconAlertCircle, IconTarget, IconClock, IconCheck, IconFlag, IconUsers,
  IconChevronDown, IconChevronRight, IconCalendar, IconColumns, IconUnlink, IconUserSwitch, IconRepeat, IconX,
} = Icons;

const D = window.SITE_DATA;
const templatesById = Object.fromEntries(D.templates.map((t) => [t.id, t]));

const STATUS_META = {
  not_started: { label: "Не начат", hue: "neutral" },
  in_progress: { label: "В процессе", hue: "blue" },
  on_review: { label: "Ожидает проверки", hue: "warning" },
  completed: { label: "Завершён", hue: "positive" },
  failed: { label: "Неуспешно завершён", hue: "negative" },
  cancelled: { label: "Отменён", hue: "gray" },
};
const HIDDEN_BY_DEFAULT = ["completed", "failed", "cancelled"];

const QUICK_INDICATORS = [
  { id: "active", label: "Активные", icon: IconTarget, bg: "var(--sk-accent-secondary)", fg: "var(--sk-icon-accent)", test: (p) => p.status === "in_progress" || p.status === "not_started" },
  { id: "risk", label: "С риском", icon: IconAlertCircle, bg: "var(--sk-negative-secondary)", fg: "var(--sk-icon-negative)", test: (p) => p.risks.length > 0 },
  { id: "no_goals", label: "Без целей", icon: IconFlag, bg: "var(--sk-warning-secondary)", fg: "var(--sk-text-warning-dark)", test: (p) => !p.goalsPublished },
  { id: "overdue_cp", label: "Просрочка КТ", icon: IconClock, bg: "var(--sk-special-secondary)", fg: "var(--sk-special)", test: (p) => p.overdueCheckpoint },
  { id: "review", label: "Ждут ревью", icon: IconCheck, bg: "var(--sk-positive-secondary)", fg: "var(--sk-icon-positive)", test: (p) => p.finalReview === "pending" },
  { id: "ending_soon", label: "Скоро завершатся", icon: IconCalendar, bg: "var(--sk-warning-secondary)", fg: "var(--sk-text-warning-dark)", test: (p) => !!p.endingSoon },
];

const GROUP_OPTIONS = [
  { value: "", label: "Без группировки" },
  { value: "templateId", label: "По шаблону" },
  { value: "department", label: "По подразделению" },
  { value: "position", label: "По должности" },
  { value: "manager", label: "По руководителю" },
  { value: "responsible", label: "По ответственному" },
  { value: "planType", label: "По типу плана" },
  { value: "name", label: "По сотруднику" },
  { value: "status", label: "По статусу" },
];

// Кнопка-переключатель группировки с плавающей панелью радио-кнопок — см. референс
// (список планов/целей с группировкой "По статусу" и т.п.).
function GroupByMenu({ value, onChange }) {
  const { Radio } = window.SkillazCoreDesignSystem_bf9566;
  const [open, setOpen] = React.useState(false);
  const ref = React.useRef(null);
  React.useEffect(() => {
    function onDocClick(e) { if (ref.current && !ref.current.contains(e.target)) setOpen(false); }
    document.addEventListener("mousedown", onDocClick);
    return () => document.removeEventListener("mousedown", onDocClick);
  }, []);
  const current = GROUP_OPTIONS.find((o) => o.value === value) || GROUP_OPTIONS[0];
  return (
    <div ref={ref} style={{ position: "relative" }}>
      <Button mode="secondary" icon={<Icons.IconLayers size={16} />} onClick={() => setOpen((o) => !o)}
        style={{ background: "var(--sk-surface-page)", border: "1px solid var(--sk-stroke)" }}>{current.label}</Button>
      {open && (
        <div className="sk-scroll" style={{
          position: "absolute", top: "calc(100% + 6px)", right: 0, zIndex: 50, background: "var(--sk-surface-page)",
          borderRadius: "var(--sk-radius-3)", boxShadow: "var(--sk-shadow-m)", padding: 8, minWidth: 220, maxHeight: 320, overflowY: "auto",
        }}>
          <div className="sk-col sk-gap-1">
            {GROUP_OPTIONS.map((o) => (
              <div key={o.value || "none"} style={{ padding: "8px 10px", borderRadius: "var(--sk-radius-2)" }}>
                <Radio checked={value === o.value} onChange={() => { onChange(o.value); setOpen(false); }} label={o.label} />
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

function groupLabel(key, value) {
  if (key === "templateId") return value ? (templatesById[value] ? templatesById[value].name : value) : "Без шаблона";
  if (key === "status") return STATUS_META[value] ? STATUS_META[value].label : value;
  return value || "—";
}

// Все колонки таблицы назначений с их порядком/названиями — вынесены отдельно от
// рендер-функций (ниже, в AssignedTable), чтобы ColumnsMenu мог строить список без
// дублирования разметки. "name" всегда включена (locked) — иначе таблица бессмысленна.
const ASSIGNED_COLUMNS_META = [
  { key: "name", title: "Сотрудник", locked: true },
  { key: "plan", title: "Название плана" },
  { key: "status", title: "Статус" },
  { key: "progress", title: "Прогресс" },
  { key: "manager", title: "Руководитель" },
  { key: "dates", title: "Сроки" },
  { key: "assignMethod", title: "Способ назначения" },
  { key: "lastActivity", title: "Активность" },
];

// Плавающая панель с чекбоксами видимости столбцов — тот же паттерн плавающей панели,
// что и GroupByMenu выше (радио → чекбоксы для множественного выбора).
function ColumnsMenu({ all, visible, onChange }) {
  const [open, setOpen] = React.useState(false);
  const ref = React.useRef(null);
  React.useEffect(() => {
    function onDocClick(e) { if (ref.current && !ref.current.contains(e.target)) setOpen(false); }
    document.addEventListener("mousedown", onDocClick);
    return () => document.removeEventListener("mousedown", onDocClick);
  }, []);
  return (
    <div ref={ref} style={{ position: "relative" }}>
      <Button mode="secondary" icon={<IconColumns size={16} />} onClick={() => setOpen((o) => !o)}
        style={{ background: "var(--sk-surface-page)", border: "1px solid var(--sk-stroke)" }}>Столбцы</Button>
      {open && (
        <div className="sk-scroll" style={{
          position: "absolute", top: "calc(100% + 6px)", right: 0, zIndex: 50, background: "var(--sk-surface-page)",
          borderRadius: "var(--sk-radius-3)", boxShadow: "var(--sk-shadow-m)", padding: 8, minWidth: 220, maxHeight: 360, overflowY: "auto",
        }}>
          <div className="sk-col sk-gap-1">
            {all.map((col) => (
              <div key={col.key} style={{ padding: "8px 10px", borderRadius: "var(--sk-radius-2)" }}>
                <Checkbox checked={visible.includes(col.key)} disabled={col.locked} label={col.title} onChange={() => onChange(col.key)} />
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

const emptyFilters = { status: "", planType: "", department: "", template: "", manager: "", assignMethod: "", risk: "" };

function DraftCard({ d }) {
  return (
    <a href={"plan.html?kind=draft&id=" + d.id} style={{ textDecoration: "none" }}>
      <Card bordered style={{ cursor: "pointer" }}>
        <div className="sk-col sk-gap-2">
          <div className="sk-row sk-gap-2">
            <Tag size="s" hue="neutral">{d.type}</Tag>
            <Tag size="s" hue="gray">Черновик</Tag>
          </div>
          <div className="sk-title-5">{d.title}</div>
          <div className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>По шаблону «{d.templateName}» · создан {d.createdAt}</div>
        </div>
      </Card>
    </a>
  );
}

function CancelModal({ plan, onClose, onConfirm }) {
  const [reason, setReason] = React.useState("");
  return (
    <Modal open title={"Отменить план «" + plan.planTitle + "»?"} onClose={onClose} size="s"
      secondary={<Button mode="secondary" onClick={onClose}>Отмена</Button>}
      primary={<Button variant="negative" disabled={!reason.trim()} onClick={() => onConfirm(reason)}>Отменить план</Button>}>
      <div className="sk-col sk-gap-3">
        <div className="sk-muted">Сотрудник и руководитель получат уведомление об отмене. Действие необратимо.</div>
        <Textarea label="Причина отмены" required rows={3} value={reason} onChange={(e) => setReason(e.target.value || "")} placeholder="Например: кандидат отказался от оффера" />
      </div>
    </Modal>
  );
}

// ---------------- Массовые действия (DEV-62512) ----------------
// Мини-список выбранных строк внутри модалок массовых действий — общий блок, чтобы
// HR видел, к кому именно применится действие, перед подтверждением.
function SelectedList({ people, note }) {
  return (
    <div className="sk-scroll" style={{ maxHeight: 160, overflowY: "auto" }}>
      <div className="sk-col sk-gap-1">
        {people.map((p) => (
          <div key={p.id} className="sk-row sk-gap-2" style={{ justifyContent: "space-between", padding: "6px 0" }}>
            <span className="sk-label-4-regular">{p.name}</span>
            <span className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>{note ? note(p) : p.planTitle}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

// "Снять назначение" массово — тот же смысл, что единичное "Отменить" в строке, но
// с причиной один раз на всю выборку и явным списком, к кому применится.
function BulkUnassignModal({ people, onClose, onConfirm }) {
  const [reason, setReason] = React.useState("");
  return (
    <Modal open title={"Снять назначение: " + people.length} onClose={onClose} size="s"
      secondary={<Button mode="secondary" onClick={onClose}>Отмена</Button>}
      primary={<Button variant="negative" disabled={!reason.trim()} onClick={() => onConfirm(reason)}>Снять назначение</Button>}>
      <div className="sk-col sk-gap-3">
        <div className="sk-muted">Сотрудники и их руководители получат уведомление. Действие необратимо для каждого выбранного плана.</div>
        <SelectedList people={people} />
        <Textarea label="Причина" required rows={3} value={reason} onChange={(e) => setReason(e.target.value || "")} placeholder="Например: сотрудник уволен" />
      </div>
    </Modal>
  );
}

// "Назначить / переназначить план" массово — один шаблон для всей выборки (см. также
// hr/queue.html BulkAssignModal, тот же принцип: один шаблон на всех выбранных).
function BulkReassignModal({ people, onClose, onConfirm }) {
  const activeTemplates = D.templates.filter((t) => t.status === "active");
  const [templateId, setTemplateId] = React.useState(null);
  const planTypes = [...new Set(people.map((p) => p.planType))];
  const mixedTypes = planTypes.length > 1;
  return (
    <Modal open title={"Назначить / переназначить план: " + people.length} onClose={onClose} size="m"
      secondary={<Button mode="secondary" onClick={onClose}>Отмена</Button>}
      primary={<Button variant="accent" disabled={!templateId} onClick={() => onConfirm(templateId)}>Переназначить</Button>}>
      <div className="sk-col sk-gap-4">
        {mixedTypes ? (
          <Alert hue="warning" title="Разные типы плана в выборке">
            У выбранных сотрудников сейчас разные типы плана ({planTypes.join(", ")}). Один шаблон подойдёт не всем — проверьте список перед переназначением.
          </Alert>
        ) : (
          <div className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>Текущий план каждого выбранного сотрудника будет заменён новой копией выбранного шаблона.</div>
        )}
        <Select label="Шаблон плана" placeholder="Выберите шаблон" value={templateId}
          options={activeTemplates.map((t) => ({ value: t.id, label: t.name + " · " + t.planType }))}
          onChange={setTemplateId} />
        <SelectedList people={people} />
      </div>
    </Modal>
  );
}

// "Заменить руководителя" массово — один новый руководитель для всей выборки.
function BulkManagerModal({ people, managers, onClose, onConfirm }) {
  const [manager, setManager] = React.useState(null);
  return (
    <Modal open title={"Заменить руководителя: " + people.length} onClose={onClose} size="s"
      secondary={<Button mode="secondary" onClick={onClose}>Отмена</Button>}
      primary={<Button variant="accent" disabled={!manager} onClick={() => onConfirm(manager)}>Заменить</Button>}>
      <div className="sk-col sk-gap-3">
        <div className="sk-muted">Новый руководитель станет ответственным за подтверждение целей и контрольные точки во всех выбранных планах.</div>
        <Select label="Новый руководитель" placeholder="Выберите руководителя" value={manager}
          options={managers.map((m) => ({ value: m, label: m }))} onChange={setManager} />
        <SelectedList people={people} note={(p) => "сейчас: " + p.manager} />
      </div>
    </Modal>
  );
}

// "Заменить / удалить элемент в назначенных планах" — доступно только при активной
// группировке по шаблону (ТЗ п. "Массовые действия"): сценарий тип элемента → элемент
// для замены → новый элемент → подтверждение, с итогом успешно/частично выполнено.
const ELEMENT_TYPES = [
  { value: "task", label: "Задача" },
  { value: "file", label: "Файл" },
  { value: "link", label: "Ссылка" },
  { value: "course", label: "Курс" },
  { value: "survey", label: "Опрос" },
];
// Демо-каталог элементов планов — в прототипе не связан с реальным контентом шаблона,
// достаточно правдоподобных названий, чтобы показать сам сценарий выбора.
const ELEMENT_CATALOG = {
  task: ["Выдать доступы: почта, календарь, CRM", "Пройти вводный инструктаж по ТБ", "Настроить рабочее место"],
  file: ["Регламент адаптации.pdf", "Продуктовая презентация.pptx"],
  link: ["Wiki: онбординг-гайд", "Портал самообслуживания HR"],
  course: ["Основы продукта Skillaz", "Работа в CRM: базовый курс"],
  survey: ["Опрос по итогам первых 30 дней", "Опросник для линейных сотрудников"],
};

function BulkReplaceElementModal({ people, mode, onClose, onConfirm }) {
  // mode: "replace" | "delete"
  const [type, setType] = React.useState(null);
  const [fromEl, setFromEl] = React.useState(null);
  const [toEl, setToEl] = React.useState(null);
  const [step, setStep] = React.useState(1);
  const catalog = type ? ELEMENT_CATALOG[type] || [] : [];
  const canNext = step === 1 ? !!type : step === 2 ? !!fromEl : mode === "delete" ? true : !!toEl;
  const lastStep = mode === "delete" ? 2 : 3;
  const title = mode === "delete" ? "Удалить элемент из назначенных планов" : "Заменить элемент в назначенных планах";

  function next() {
    if (step < lastStep) { setStep(step + 1); return; }
    onConfirm({ type, fromEl, toEl: mode === "delete" ? null : toEl });
  }

  return (
    <Modal open title={title + ": " + people.length} onClose={onClose} size="m"
      secondary={<Button mode="secondary" onClick={onClose}>Отмена</Button>}
      primary={<Button variant={mode === "delete" ? "negative" : "accent"} disabled={!canNext} onClick={next}>
        {step < lastStep ? "Далее" : mode === "delete" ? "Удалить" : "Заменить"}
      </Button>}>
      <div className="sk-col sk-gap-4">
        <div className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>
          Действие применится только к планам из выбранной группы (общий шаблон), где найден указанный элемент. Планы без этого элемента не изменятся.
        </div>
        {step >= 1 && (
          <Select label="Тип элемента" placeholder="Выберите тип" value={type}
            options={ELEMENT_TYPES} onChange={(v) => { setType(v); setFromEl(null); setToEl(null); }} />
        )}
        {step >= 2 && (
          <Select label={mode === "delete" ? "Элемент для удаления" : "Элемент, который нужно заменить"} placeholder="Выберите элемент" value={fromEl}
            options={catalog.map((c) => ({ value: c, label: c }))} onChange={setFromEl} />
        )}
        {step >= 3 && mode === "replace" && (
          <Select label="Новый элемент" placeholder="Выберите новый элемент" value={toEl}
            options={catalog.filter((c) => c !== fromEl).map((c) => ({ value: c, label: c }))} onChange={setToEl} />
        )}
        <SelectedList people={people} />
      </div>
    </Modal>
  );
}

// Итог массового действия — по ТЗ два состояния: выполнено полностью / частично.
// В демо считаем "частично", если среди выбранных есть план в статусе cancelled/completed
// (такие планы правдоподобно не примут изменение).
function BulkResultModal({ result, onClose }) {
  const partial = result.failed > 0;
  return (
    <Modal open title={partial ? "Действие выполнено частично" : "Действие выполнено"} onClose={onClose} size="s"
      primary={<Button variant="accent" onClick={onClose}>Понятно</Button>}>
      <div className="sk-col sk-gap-3">
        {partial ? (
          <>
            <div className="sk-label-3">Успешно: {result.done} из {result.done + result.failed}</div>
            <div className="sk-muted">
              {result.failed} план{result.failed === 1 ? "" : result.failed < 5 ? "а" : "ов"} не изменил{result.failed === 1 ? "ся" : "ись"} — план завершён, неуспешен или отменён.
            </div>
          </>
        ) : (
          <div className="sk-muted">Изменение применено ко всем выбранным планам ({result.done}).</div>
        )}
      </div>
    </Modal>
  );
}

function AssignedTable() {
  const [q, setQ] = React.useState("");
  const [activeIndicator, setActiveIndicator] = React.useState(null);
  const [filters, setFilters] = React.useState(emptyFilters);
  const [filtersOpen, setFiltersOpen] = React.useState(false);
  const [showHiddenStatuses, setShowHiddenStatuses] = React.useState(false);
  const [groupBy, setGroupBy] = React.useState("");
  const [collapsedGroups, setCollapsedGroups] = React.useState(() => new Set());
  const [cancelPlan, setCancelPlan] = React.useState(null);
  const [toast, setToast] = React.useState(null);
  const [plans, setPlans] = React.useState(D.hrAssignedPlans);
  const [selected, setSelected] = React.useState(() => new Set());
  const [visibleCols, setVisibleCols] = React.useState(ASSIGNED_COLUMNS_META.map((c) => c.key));
  const [bulkAction, setBulkAction] = React.useState(null); // "unassign" | "reassign" | "manager" | "replace" | "delete"
  const [bulkResult, setBulkResult] = React.useState(null);

  function showToast(msg) { setToast(msg); window.setTimeout(() => setToast(null), 2600); }

  const departments = [...new Set(D.hrAssignedPlans.map((p) => p.department))];
  const managers = [...new Set(D.hrAssignedPlans.map((p) => p.manager))];
  const planTypes = [...new Set(D.hrAssignedPlans.map((p) => p.planType))];
  const hasActiveFilters = !!(filters.status || filters.planType || filters.department || filters.template || filters.manager || filters.assignMethod || filters.risk);
  const activeFilterCount = Object.values(filters).filter(Boolean).length;

  const needle = q.trim().toLowerCase();
  let list = plans.filter((p) => {
    if (!showHiddenStatuses && HIDDEN_BY_DEFAULT.includes(p.status) && !filters.status) return false;
    if (needle && !(p.name.toLowerCase().includes(needle) || p.planTitle.toLowerCase().includes(needle)
      || p.position.toLowerCase().includes(needle) || p.manager.toLowerCase().includes(needle)
      || (templatesById[p.templateId] && templatesById[p.templateId].name.toLowerCase().includes(needle)))) return false;
    if (activeIndicator && !QUICK_INDICATORS.find((i) => i.id === activeIndicator).test(p)) return false;
    if (filters.status && p.status !== filters.status) return false;
    if (filters.planType && p.planType !== filters.planType) return false;
    if (filters.department && p.department !== filters.department) return false;
    if (filters.template && p.templateId !== filters.template) return false;
    if (filters.manager && p.manager !== filters.manager) return false;
    if (filters.assignMethod && p.assignMethod !== filters.assignMethod) return false;
    if (filters.risk === "risk" && p.risks.length === 0) return false;
    if (filters.risk === "no_risk" && p.risks.length > 0) return false;
    return true;
  });

  function cancelPlanConfirm(reason) {
    setPlans((list) => list.map((x) => x.id === cancelPlan.id ? { ...x, status: "cancelled", risks: [...x.risks, "Отменено HR: " + reason] } : x));
    showToast("План отменён");
    setCancelPlan(null);
  }

  // ---------------- Выбор строк ----------------
  const selectableIds = list.map((p) => p.id);
  const allSelected = selectableIds.length > 0 && selectableIds.every((id) => selected.has(id));
  function toggleAll() {
    setSelected((s) => {
      const n = new Set(s);
      if (allSelected) selectableIds.forEach((id) => n.delete(id));
      else selectableIds.forEach((id) => n.add(id));
      return n;
    });
  }
  function toggleOne(id) {
    setSelected((s) => { const n = new Set(s); n.has(id) ? n.delete(id) : n.add(id); return n; });
  }
  function clearSelection() { setSelected(new Set()); }
  const selectedPeople = list.filter((p) => selected.has(p.id));

  // Массовые действия применимы только к планам, ещё способным меняться — план
  // "завершён"/"неуспешен"/"отменён" не изменится (используется для "частично выполнено").
  function isEditable(p) { return p.status !== "cancelled" && p.status !== "completed" && p.status !== "failed"; }

  function runBulkResult(targets, mutate) {
    const editable = targets.filter(isEditable);
    const failed = targets.length - editable.length;
    if (editable.length) {
      const editableIds = new Set(editable.map((p) => p.id));
      setPlans((list) => list.map((x) => editableIds.has(x.id) ? mutate(x) : x));
    }
    setBulkResult({ done: editable.length, failed });
    clearSelection();
  }

  function bulkUnassign(reason) {
    runBulkResult(selectedPeople, (x) => ({ ...x, status: "cancelled", risks: [...x.risks, "Назначение снято HR (массово): " + reason] }));
    setBulkAction(null);
  }
  function bulkReassign(templateId) {
    const tpl = templatesById[templateId];
    runBulkResult(selectedPeople, (x) => ({
      ...x, templateId, planTitle: tpl ? tpl.name : x.planTitle, planType: tpl ? tpl.planType : x.planType,
      status: "not_started", checklistProgress: 0, goalsProgress: tpl && tpl.goalsEnabled ? 0 : null,
      goalsPublished: false, assignMethod: "Вручную", risks: [],
    }));
    setBulkAction(null);
  }
  function bulkManager(manager) {
    runBulkResult(selectedPeople, (x) => ({ ...x, manager }));
    setBulkAction(null);
  }
  function bulkReplaceElement(payload) {
    // В прототипе нет модели элементов внутри плана — засчитываем как применённое ко
    // всем редактируемым планам текущей группы (по шаблону), демонстрируя сам сценарий.
    runBulkResult(selectedPeople, (x) => x);
    setBulkAction(null);
  }

  const columnRenderers = {
    name: (p) => (
      <a href={"plan-detail.html?id=" + p.id} style={{ textDecoration: "none" }}>
        <div className="sk-col" style={{ gap: 2 }}>
          <span className="sk-label-3" style={{ color: "var(--sk-text-accent)" }}>{p.name}</span>
          <span className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>{p.position} · {p.department}</span>
        </div>
      </a>
    ),
    plan: (p) => (
      <div className="sk-col" style={{ gap: 2 }}>
        <span className="sk-label-4">{p.planTitle}</span>
        <span className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>{p.planType} · {templatesById[p.templateId] ? templatesById[p.templateId].name : "без шаблона"}</span>
      </div>
    ),
    status: (p) => (
      <div className="sk-col sk-gap-1" style={{ alignItems: "flex-start" }}>
        <Tag size="s" hue={STATUS_META[p.status].hue}>{STATUS_META[p.status].label}</Tag>
        {p.risks.length > 0 && <Tag size="s" hue="negative" icon={<IconAlertCircle size={11} />}>Риск</Tag>}
      </div>
    ),
    progress: (p) => (
      <div className="sk-col sk-gap-1" style={{ minWidth: 170 }}>
        <div className="sk-row sk-gap-2"><span className="sk-muted" style={{ font: "var(--sk-label-4-regular)", width: 46 }}>Чек-лист</span><ProgressBar value={p.checklistProgress} style={{ flex: 1 }} hue="accent" /><span className="sk-label-4" style={{ width: 32, textAlign: "right" }}>{p.checklistProgress}%</span></div>
        {p.goalsProgress !== null && (
          <div className="sk-row sk-gap-2"><span className="sk-muted" style={{ font: "var(--sk-label-4-regular)", width: 46 }}>Цели</span><ProgressBar value={p.goalsProgress} style={{ flex: 1 }} hue="positive" /><span className="sk-label-4" style={{ width: 32, textAlign: "right" }}>{p.goalsProgress}%</span></div>
        )}
      </div>
    ),
    manager: (p) => p.manager,
    dates: (p) => (
      <div className="sk-col" style={{ gap: 2 }}>
        <span className="sk-label-4-regular">{p.assignedDate} → {p.plannedEndDate}</span>
        {p.actualEndDate && <span className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>Факт: {p.actualEndDate}</span>}
      </div>
    ),
    assignMethod: (p) => p.assignMethod,
    lastActivity: (p) => p.lastActivity,
  };

  const columns = [
    { key: "__check", title: "", width: 40, render: (p) => (
      <div onClick={(e) => e.stopPropagation()}>
        <Checkbox checked={selected.has(p.id)} onChange={() => toggleOne(p.id)} />
      </div>
    ) },
    ...ASSIGNED_COLUMNS_META.filter((c) => visibleCols.includes(c.key)).map((c) => ({
      key: c.key, title: c.title, width: c.key === "plan" ? 280 : c.key === "status" ? 150 : c.key === "progress" ? 220
        : c.key === "manager" ? 180 : c.key === "dates" ? 180 : c.key === "assignMethod" ? 190 : c.key === "lastActivity" ? 140 : 260,
      render: columnRenderers[c.key],
    })),
    { key: "actions", title: "", width: 110, render: (p) => (
      <div onClick={(e) => e.stopPropagation()}>
        {p.status !== "cancelled" && p.status !== "completed" && (
          <Button size="s" mode="tertiary" onClick={() => setCancelPlan(p)}>Отменить</Button>
        )}
      </div>
    ) },
  ];

  function renderTable(rows) {
    return (
      <div className="sk-scroll" style={{ overflowX: "auto" }}>
        <Table columns={columns} rows={rows} style={{ minWidth: 1720 }} />
      </div>
    );
  }

  return (
    <div className="sk-col sk-gap-4">
      <div style={{ display: "flex", gap: 12 }}>
        {QUICK_INDICATORS.map((ind) => {
          const count = plans.filter((p) => (!HIDDEN_BY_DEFAULT.includes(p.status) || showHiddenStatuses) && ind.test(p)).length;
          const active = activeIndicator === ind.id;
          return (
            <Card key={ind.id} bordered padding={16}
              style={{ cursor: "pointer", flex: "1 1 0", minWidth: 0, outline: active ? "2px solid var(--sk-stroke-accent)" : "none" }}>
              <div className="sk-col sk-gap-3 sk-clickable" onClick={() => setActiveIndicator(active ? null : ind.id)}>
                <span style={{ width: 36, height: 36, borderRadius: "50%", flexShrink: 0, display: "flex", alignItems: "center", justifyContent: "center", background: ind.bg, color: ind.fg }}>
                  <ind.icon size={18} />
                </span>
                <div className="sk-col" style={{ gap: 2, minWidth: 0 }}>
                  <div className="sk-title-5">{count}</div>
                  <div className="sk-muted" style={{ font: "var(--sk-label-4-regular)", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{ind.label}</div>
                </div>
              </div>
            </Card>
          );
        })}
      </div>

      <div className="sk-col sk-gap-3">
        <div className="sk-row sk-gap-2">
          <Input icon={<IconSearch size={20} />} placeholder="Сотрудник, план, должность, руководитель, шаблон" value={q}
            onChange={(e) => setQ(e.target.value || "")} style={{ maxWidth: 420, flex: 1 }} />
          <Button mode="secondary" icon={<Icons.IconFilter size={16} />} onClick={() => setFiltersOpen((o) => !o)}>
            Фильтры{hasActiveFilters ? " · " + activeFilterCount : ""}
          </Button>
        </div>
        {filtersOpen && (
          <div className="sk-row sk-gap-2" style={{ flexWrap: "wrap", alignItems: "flex-end" }}>
            <Select label="Статус" placeholder="Все" value={filters.status || null}
              options={Object.entries(STATUS_META).map(([v, m]) => ({ value: v, label: m.label }))}
              onChange={(v) => setFilters((f) => ({ ...f, status: v || "" }))} style={{ width: 180 }} />
            <Select label="Тип плана" placeholder="Все" value={filters.planType || null} options={planTypes.map((v) => ({ value: v, label: v }))}
              onChange={(v) => setFilters((f) => ({ ...f, planType: v || "" }))} style={{ width: 170 }} />
            <Select label="Подразделение" placeholder="Все" value={filters.department || null} options={departments.map((v) => ({ value: v, label: v }))}
              onChange={(v) => setFilters((f) => ({ ...f, department: v || "" }))} style={{ width: 220 }} />
            <Select label="Шаблон" placeholder="Все" value={filters.template || null} options={D.templates.map((t) => ({ value: t.id, label: t.name }))}
              onChange={(v) => setFilters((f) => ({ ...f, template: v || "" }))} style={{ width: 200 }} />
            <Select label="Руководитель" placeholder="Все" value={filters.manager || null} options={managers.map((v) => ({ value: v, label: v }))}
              onChange={(v) => setFilters((f) => ({ ...f, manager: v || "" }))} style={{ width: 180 }} />
            <Select label="Способ назначения" placeholder="Все" value={filters.assignMethod || null}
              options={["Вручную", "Очередь назначения", "Автособытие", "Создан с нуля"].map((v) => ({ value: v, label: v }))}
              onChange={(v) => setFilters((f) => ({ ...f, assignMethod: v || "" }))} style={{ width: 190 }} />
            <Select label="Риск" placeholder="Все" value={filters.risk || null}
              options={[{ value: "risk", label: "С риском" }, { value: "no_risk", label: "Без риска" }]}
              onChange={(v) => setFilters((f) => ({ ...f, risk: v || "" }))} style={{ width: 150 }} />
            {(hasActiveFilters || q || activeIndicator) && (
              <button className="sk-link-btn sk-label-4-regular" style={{ height: 48 }} onClick={() => { setFilters(emptyFilters); setQ(""); setActiveIndicator(null); }}>Сбросить</button>
            )}
          </div>
        )}
      </div>

      <div className="sk-row" style={{ justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 12 }}>
        <div className="sk-row sk-gap-4" style={{ alignItems: "center" }}>
          <span className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>Найдено планов: {list.length}</span>

          <label className="sk-row sk-gap-2 sk-clickable" style={{ font: "var(--sk-label-4-regular)", color: "var(--sk-text-secondary)" }}>
            <input type="checkbox" checked={showHiddenStatuses} onChange={(e) => setShowHiddenStatuses(e.target.checked)} />
            Показывать завершённые / неуспешные / отменённые
          </label>
        </div>
        <div className="sk-row sk-gap-2" style={{ alignItems: "center" }}>
          <GroupByMenu value={groupBy} onChange={setGroupBy} />
          <ColumnsMenu all={ASSIGNED_COLUMNS_META} visible={visibleCols}
            onChange={(key) => setVisibleCols((v) => v.includes(key) ? v.filter((k) => k !== key) : [...v, key])} />
          <Tooltip content="Переход в раздел отчётов по планам адаптации.">
            <Button mode="tertiary" icon={<Icons.IconFileText size={16} />} disabled>Отчёты</Button>
          </Tooltip>
        </div>
      </div>

      {list.length > 0 && (
        <div className="sk-row sk-gap-2" style={{ alignItems: "center", padding: "0 4px" }}>
          <Checkbox checked={allSelected} onChange={toggleAll} label={<span className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>Выбрать все</span>} />
        </div>
      )}

      {list.length === 0 ? (
        <Card><div className="sk-muted" style={{ textAlign: "center", padding: "16px 0" }}>Ничего не нашлось — попробуйте изменить запрос или фильтры.</div></Card>
      ) : !groupBy ? (
        renderTable(list)
      ) : (
        <div className="sk-col sk-gap-3">
          {Object.entries(list.reduce((acc, p) => {
            const key = groupLabel(groupBy, p[groupBy]);
            (acc[key] = acc[key] || []).push(p);
            return acc;
          }, {})).map(([key, rows], i) => {
            const collapsed = collapsedGroups.has(key);
            return (
              <div key={key} className="sk-col sk-gap-2">
                <div className="sk-row sk-gap-2 sk-clickable" style={{ alignItems: "center", padding: "6px 4px" }}
                  onClick={() => setCollapsedGroups((s) => { const n = new Set(s); n.has(key) ? n.delete(key) : n.add(key); return n; })}>
                  {collapsed ? <IconChevronRight size={16} color="var(--sk-icon-secondary)" /> : <IconChevronDown size={16} color="var(--sk-icon-secondary)" />}
                  <span className="sk-label-2">{key}</span>
                  <span className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>{rows.length}</span>
                </div>
                {!collapsed && renderTable(rows)}
              </div>
            );
          })}
        </div>
      )}

      {cancelPlan && <CancelModal plan={cancelPlan} onClose={() => setCancelPlan(null)} onConfirm={cancelPlanConfirm} />}

      {selected.size > 0 && (
        <div style={{
          position: "fixed", left: "50%", bottom: 24, transform: "translateX(-50%)", zIndex: 90,
          display: "flex", alignItems: "center", gap: 10, padding: "12px 16px", borderRadius: "var(--sk-radius-4)",
          background: "var(--sk-text-primary)", boxShadow: "var(--sk-shadow-l)", color: "#fff", flexWrap: "wrap",
        }}>
          <span className="sk-label-3" style={{ color: "#fff", whiteSpace: "nowrap" }}>Выбрано: {selected.size}</span>
          <Button mode="secondary" icon={<IconUnlink size={15} />} onClick={() => setBulkAction("unassign")}>Снять назначение</Button>
          <Button mode="secondary" icon={<IconRepeat size={15} />} onClick={() => setBulkAction("reassign")}>Назначить / переназначить</Button>
          <Button mode="secondary" icon={<IconUserSwitch size={15} />} onClick={() => setBulkAction("manager")}>Заменить руководителя</Button>
          {groupBy === "templateId" && (
            <>
              <Button mode="secondary" onClick={() => setBulkAction("replace")}>Заменить элемент</Button>
              <Button mode="secondary" onClick={() => setBulkAction("delete")}>Удалить элемент</Button>
            </>
          )}
          <button onClick={clearSelection} style={{
            width: 32, height: 32, borderRadius: "50%", border: "none", background: "rgba(255,255,255,0.12)",
            color: "#fff", display: "inline-flex", alignItems: "center", justifyContent: "center", cursor: "pointer", flexShrink: 0,
          }}>
            <IconX size={16} />
          </button>
        </div>
      )}

      {bulkAction === "unassign" && <BulkUnassignModal people={selectedPeople} onClose={() => setBulkAction(null)} onConfirm={bulkUnassign} />}
      {bulkAction === "reassign" && <BulkReassignModal people={selectedPeople} onClose={() => setBulkAction(null)} onConfirm={bulkReassign} />}
      {bulkAction === "manager" && <BulkManagerModal people={selectedPeople} managers={managers} onClose={() => setBulkAction(null)} onConfirm={bulkManager} />}
      {(bulkAction === "replace" || bulkAction === "delete") && (
        <BulkReplaceElementModal people={selectedPeople} mode={bulkAction} onClose={() => setBulkAction(null)} onConfirm={bulkReplaceElement} />
      )}
      {bulkResult && <BulkResultModal result={bulkResult} onClose={() => setBulkResult(null)} />}

      {toast && (
        <div style={{ position: "fixed", bottom: 24, left: "50%", transform: "translateX(-50%)", zIndex: 100 }}>
          <Snackbar>{toast}</Snackbar>
        </div>
      )}
    </div>
  );
}

function Page() {
  const [tab, setTab] = React.useState("assigned");
  return (
    <AppShell role="hr" active="hr-plans" base="..">
      <div className="sk-row" style={{ justifyContent: "space-between", alignItems: "center" }}>
        <div className="sk-title-4">Планы сотрудников</div>
        <Button variant="accent" icon={<IconPlusSm size={16} />} disabled>Создать план</Button>
      </div>

      <Tabs items={[{ id: "assigned", label: "Назначенные планы", count: D.hrAssignedPlans.length }, { id: "drafts", label: "Черновики", count: D.planDrafts.length }]}
        active={tab} onChange={setTab} />

      {tab === "assigned" ? <AssignedTable /> : (
        <div className="sk-col sk-gap-4">
          {D.planDrafts.map((d) => <DraftCard key={d.id} d={d} />)}
        </div>
      )}
    </AppShell>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Page />);
</script>
</body>
</html>
