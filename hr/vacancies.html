}

function fmtMoney(n) { return n.toLocaleString("ru-RU"); }
// "5 дней назад" / "1 неделю назад" / "Сегодня" -> число дней назад, чтобы сортировка по
// дате публикации была настоящей хронологией, а не лексикографическим сравнением строк.
function daysAgo(v) {
  if (v.createdAt === "сегодня") return 0;
  const s = (v.postedDate || "").toLowerCase();
  if (!s || s === "сегодня") return 0;
  const num = parseInt(s, 10) || 1;
  if (s.includes("недел")) return num * 7;
  if (s.includes("месяц")) return num * 30;
  return num;
}
function splitLines(text) { return text.split("\n").map((s) => s.trim()).filter(Boolean); }
function splitCsv(text) { return text.split(",").map((s) => s.trim()).filter(Boolean); }

const MAX_OPTIONAL_COLUMNS = 3;
const OPTIONAL_COLUMNS = [
  { key: "source", label: "Источник" },
  { key: "department", label: "Подразделение" },
  { key: "city", label: "Регион" },
  { key: "format", label: "Формат работы" },
  { key: "grade", label: "Грейд" },
  { key: "recruiter", label: "Рекрутер" },
];

// Пикер доп. столбцов — тот же паттерн, что у "Столбцы" в разделе "Структура компании":
// список чекбоксов с лимитом и применением по кнопке (не сразу при клике), чтобы не
// перестраивать таблицу на каждый чек, если админ отмечает сразу несколько.
function ColumnsPicker({ visible, onApply }) {
  const [open, setOpen] = React.useState(false);
  const [draft, setDraft] = React.useState(visible);
  const ref = React.useRef(null);
  React.useEffect(() => {
    if (!open) return;
    setDraft(visible);
    const close = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown", close);
    return () => document.removeEventListener("mousedown", close);
  }, [open]);
  function toggle(key) {
    setDraft((d) => d.includes(key) ? d.filter((k) => k !== key) : (d.length < MAX_OPTIONAL_COLUMNS ? [...d, key] : d));
  }
  return (
    <div ref={ref} style={{ position: "relative" }}>
      <Button mode="secondary" icon={<Icons.IconColumns size={16} />} onClick={() => setOpen((o) => !o)}
        style={{ background: "var(--sk-surface-page)", border: visible.length ? "1px solid var(--sk-stroke-accent)" : "1px solid var(--sk-stroke)" }}>
        Столбцы{visible.length ? " · " + visible.length : ""}
      </Button>
      {open && (
        <div style={{
          position: "absolute", top: "calc(100% + 4px)", right: 0, zIndex: 20, width: 260,
          background: "var(--sk-surface-page)", borderRadius: "var(--sk-radius-2)", boxShadow: "var(--sk-shadow-m)", padding: 16,
        }}>
          <div className="sk-col sk-gap-3">
            <span className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>
              Выберите до {MAX_OPTIONAL_COLUMNS} доп. столбцов. Название, Направление, Статус, Дата, Отклики и Публикация показаны всегда.
            </span>
            <div className="sk-col sk-gap-2">
              {OPTIONAL_COLUMNS.map((c) => (
                <label key={c.key} className="sk-row sk-gap-2 sk-clickable" style={{
                  font: "var(--sk-label-3-regular)", opacity: !draft.includes(c.key) && draft.length >= MAX_OPTIONAL_COLUMNS ? 0.4 : 1,
                }}>
                  <input type="checkbox" checked={draft.includes(c.key)}
                    disabled={!draft.includes(c.key) && draft.length >= MAX_OPTIONAL_COLUMNS}
                    onChange={() => toggle(c.key)} />
                  {c.label}
                </label>
              ))}
            </div>
            <Button variant="accent" onClick={() => { onApply(draft); setOpen(false); }}>Применить</Button>
          </div>
        </div>
      )}
    </div>
  );
}

const emptyForm = {
  title: "", direction: D.directions[0], department: "", city: D.cities[0], format: D.workFormats[0],
  grade: "", employment: D.employmentTypes[0], salaryFrom: "", salaryTo: "", experience: D.experienceOptions[0],
  responsibilities: "", requirements: "", conditions: "", requiredSkills: "",
};

function VacancyFormModal({ initial, onClose, onSave }) {
  const [form, setForm] = React.useState(initial || emptyForm);
  const set = (k) => (v) => setForm((f) => ({ ...f, [k]: v }));
  const valid = form.title.trim() && form.department.trim() && form.salaryFrom && form.salaryTo;
  return (
    <Modal open title={initial ? "Редактировать вакансию" : "Новая вакансия"} onClose={onClose} size="m"
      secondary={<Button mode="secondary" onClick={onClose}>Отмена</Button>}
      primary={<Button variant="accent" disabled={!valid} onClick={() => onSave(form)}>{initial ? "Сохранить" : "Создать"}</Button>}>
      <div className="sk-col sk-gap-3 sk-modal-scroll">
        <Input label="Название вакансии" required value={form.title} onChange={(e) => set("title")(e.target.value || "")} />
        <div className="sk-row sk-gap-3">
          <Select label="Направление" value={form.direction} options={D.directions.map((d) => ({ value: d, label: d }))} onChange={set("direction")} style={{ flex: 1 }} />
          <Input label="Подразделение" required value={form.department} onChange={(e) => set("department")(e.target.value || "")} style={{ flex: 1 }} />
        </div>
        <div className="sk-row sk-gap-3">
          <Select label="Город" value={form.city} options={D.cities.map((c) => ({ value: c, label: c }))} onChange={set("city")} style={{ flex: 1 }} />
          <Select label="Формат работы" value={form.format} options={D.workFormats.map((f) => ({ value: f, label: f }))} onChange={set("format")} style={{ flex: 1 }} />
        </div>
        <div className="sk-row sk-gap-3">
          <Input label="Грейд" placeholder="Junior / Middle / Senior" value={form.grade} onChange={(e) => set("grade")(e.target.value || "")} style={{ flex: 1 }} />
          <Select label="Тип занятости" value={form.employment} options={D.employmentTypes.map((e) => ({ value: e, label: e }))} onChange={set("employment")} style={{ flex: 1 }} />
        </div>
        <div className="sk-row sk-gap-3">
          <Input label="Оклад от" required type="number" value={form.salaryFrom} onChange={(e) => set("salaryFrom")(e.target.value)} style={{ flex: 1 }} />
          <Input label="Оклад до" required type="number" value={form.salaryTo} onChange={(e) => set("salaryTo")(e.target.value)} style={{ flex: 1 }} />
          <Select label="Опыт" value={form.experience} options={D.experienceOptions.map((e) => ({ value: e, label: e }))} onChange={set("experience")} style={{ flex: 1 }} />
        </div>
        <Textarea label="Обязанности" helper="Каждый пункт — с новой строки" rows={3} value={form.responsibilities} onChange={(e) => set("responsibilities")(e.target.value || "")} />
        <Textarea label="Требования" helper="Каждый пункт — с новой строки" rows={3} value={form.requirements} onChange={(e) => set("requirements")(e.target.value || "")} />
        <Textarea label="Условия" helper="Каждый пункт — с новой строки" rows={2} value={form.conditions} onChange={(e) => set("conditions")(e.target.value || "")} />
        <Input label="Ключевые навыки" helper="Через запятую" value={form.requiredSkills} onChange={(e) => set("requiredSkills")(e.target.value || "")} />
      </div>
    </Modal>
  );
}

function Page() {
  const [vacancies, setVacancies] = React.useState(D.vacancies);
  const [q, setQ] = React.useState("");
  const [formModal, setFormModal] = React.useState(null); // null | { mode: "create" } | { mode: "edit", vacancy }
  const [toast, setToast] = React.useState(null);
  const [showClosed, setShowClosed] = React.useState(false);
  const [sortBy, setSortBy] = React.useState(null); // null | { key, dir: "asc" | "desc" }
  const [filtersOpen, setFiltersOpen] = React.useState(false);
  const [filters, setFilters] = React.useState({ direction: "", department: "", city: "", format: "", employment: "", source: "", visibility: "" });
  const [visibleOptionalCols, setVisibleOptionalCols] = React.useState([]);

  function showToast(msg) { setToast(msg); window.setTimeout(() => setToast(null), 2600); }

  function togglePublish(v) {
    setVacancies((list) => list.map((x) => x.id === v.id ? { ...x, visibleToEmployees: !x.visibleToEmployees } : x));
    showToast(v.visibleToEmployees ? "Вакансия скрыта от сотрудников" : "Вакансия опубликована для сотрудников");
  }

  function saveForm(form) {
    if (formModal.mode === "edit") {
      setVacancies((list) => list.map((x) => x.id === formModal.vacancy.id ? {
        ...x, title: form.title, direction: form.direction, department: form.department, city: form.city,
        format: form.format, grade: form.grade, employment: form.employment,
        salaryFrom: Number(form.salaryFrom) || 0, salaryTo: Number(form.salaryTo) || 0, experience: form.experience,
        responsibilities: splitLines(form.responsibilities), requirements: splitLines(form.requirements),
        conditions: splitLines(form.conditions), requiredSkills: splitCsv(form.requiredSkills),
      } : x));
      showToast("Вакансия обновлена");
    } else {
      const id = "v_hr" + (vacancies.length + 1);
      setVacancies((list) => [{
        id, title: form.title, direction: form.direction, department: form.department, city: form.city,
        format: form.format, grade: form.grade || "—", employment: form.employment, schedule: "5/2",
        salaryFrom: Number(form.salaryFrom) || 0, salaryTo: Number(form.salaryTo) || 0, experience: form.experience,
        status: "open", postedDate: "сегодня",
        requiredSkills: splitCsv(form.requiredSkills), responsibilities: splitLines(form.responsibilities),
        requirements: splitLines(form.requirements), conditions: splitLines(form.conditions),
        recruiter: { name: "Ольга Соколова", role: "HR-Админ", email: "o.sokolova@skillaz.com", phone: "+7 916 000 0000" },
        visibleToEmployees: false, source: "manual", createdAt: "сегодня",
      }, ...list]);
      showToast("Вакансия создана. Не забудьте опубликовать её для сотрудников.");
    }
    setFormModal(null);
  }

  const needle = q.trim().toLowerCase();
  const filteredList = React.useMemo(() => {
    let list = vacancies;
    if (!showClosed) list = list.filter((v) => v.status !== "closed");
    if (needle) list = list.filter((v) => v.title.toLowerCase().includes(needle) || v.department.toLowerCase().includes(needle));
    if (filters.direction) list = list.filter((v) => v.direction === filters.direction);
    if (filters.department) list = list.filter((v) => v.department === filters.department);
    if (filters.city) list = list.filter((v) => v.city === filters.city);
    if (filters.format) list = list.filter((v) => v.format === filters.format);
    if (filters.employment) list = list.filter((v) => v.employment === filters.employment);
    if (filters.source) list = list.filter((v) => (v.source || "ats") === filters.source);
    if (filters.visibility) list = list.filter((v) => (filters.visibility === "visible") === !!v.visibleToEmployees);
    if (sortBy) {
      const dir = sortBy.dir === "asc" ? 1 : -1;
      list = [...list].sort((a, b) => {
        let av, bv;
        if (sortBy.key === "title") { av = a.title; bv = b.title; }
        else if (sortBy.key === "department") { av = a.department; bv = b.department; }
        else if (sortBy.key === "city") { av = a.city; bv = b.city; }
        else if (sortBy.key === "responses") { av = a.responsesCount || 0; bv = b.responsesCount || 0; }
        else if (sortBy.key === "date") { av = daysAgo(a); bv = daysAgo(b); }
        if (typeof av === "number" && typeof bv === "number") return (av - bv) * dir;
        return String(av).localeCompare(String(bv), "ru") * dir;
      });
    }
    return list;
  }, [vacancies, needle, showClosed, filters, sortBy]);
  const filtered = filteredList;

  const departmentOptions = [...new Set(D.vacancies.map((v) => v.department))].sort();
  const cityOptions = [...new Set(D.vacancies.map((v) => v.city))].sort();
  const hasActiveFilters = Object.values(filters).some(Boolean);
  const activeFilterCount = Object.values(filters).filter(Boolean).length;

  function toggleSort(key) {
    setSortBy((s) => {
      if (!s || s.key !== key) return { key, dir: "asc" };
      if (s.dir === "asc") return { key, dir: "desc" };
      return null;
    });
  }
  function SortableHeader({ label, sortKey }) {
    const active = sortBy && sortBy.key === sortKey;
    return (
      <button type="button" onClick={() => toggleSort(sortKey)} className="sk-row sk-gap-1 sk-clickable"
        style={{ background: "none", border: "none", padding: 0, font: "inherit", color: active ? "var(--sk-text-primary)" : "inherit", cursor: "pointer", alignItems: "center" }}>
        {label}
        <span style={{ display: "inline-flex", flexDirection: "column", lineHeight: 0, opacity: active ? 1 : 0.35 }}>
          <Icons.IconChevronUp size={11} style={{ marginBottom: -2, color: active && sortBy.dir === "asc" ? "var(--sk-text-accent)" : "currentColor" }} />
          <Icons.IconChevronDown size={11} style={{ color: active && sortBy.dir === "desc" ? "var(--sk-text-accent)" : "currentColor" }} />
        </span>
      </button>
    );
  }

  // Название/Направление/Статус/Дата/Отклики/Публикация — всегда в таблице, это
  // минимум, нужный для беглого просмотра. Источник/Подразделение/Регион/Формат/Грейд/
  // Рекрутер — опциональные, включаются через пикер "Столбцы" (см. ColumnsPicker ниже),
  // чтобы таблица не разрасталась вширь у всех сразу, а админ сам решал, что ему нужно.
  const optionalColumnDefs = {
    source: { key: "source", title: "Источник", render: (v) => (
      <Tag size="s" hue={v.source === "manual" ? "accent" : "neutral"}>{v.source === "manual" ? "Создана вручную" : "АТС"}</Tag>
    ) },
    department: { key: "department", title: <SortableHeader label="Подразделение" sortKey="department" />, render: (v) => <span className="sk-label-3-regular">{v.department}</span> },
    city: { key: "city", title: <SortableHeader label="Регион" sortKey="city" />, render: (v) => <span className="sk-label-3-regular">{v.city}</span> },
    format: { key: "format", title: "Формат работы", render: (v) => <span className="sk-label-3-regular">{v.format}</span> },
    grade: { key: "grade", title: "Грейд", render: (v) => <span className="sk-label-3-regular">{v.grade || "—"}</span> },
    recruiter: { key: "recruiter", title: "Рекрутер", render: (v) => <span className="sk-label-3-regular">{v.recruiter ? v.recruiter.name : "—"}</span> },
  };

  const columns = [
    { key: "title", title: <SortableHeader label="Вакансия" sortKey="title" />, width: "24%", render: (v) => (
      <span className="sk-label-3">{v.title}</span>
    ) },
    ...OPTIONAL_COLUMNS.filter((c) => visibleOptionalCols.includes(c.key)).map((c) => optionalColumnDefs[c.key]),
    { key: "direction", title: "Направление", render: (v) => <Tag size="s" hue="neutral">{v.direction}</Tag> },
    { key: "status", title: "Статус", render: (v) => <Tag size="s" hue={v.status === "open" ? "positive" : "neutral"}>{v.status === "open" ? "Идёт поиск" : "Закрыта"}</Tag> },
    { key: "date", title: <SortableHeader label="Дата публикации" sortKey="date" />, render: (v) => (
      <span className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>{v.createdAt === "сегодня" ? "Сегодня" : (v.postedDate || "—")}</span>
    ) },
    { key: "responses", title: <SortableHeader label="Отклики" sortKey="responses" />, render: (v) => (
      v.responsesCount > 0 ? (
        <a href="#" onClick={(e) => e.preventDefault()} style={{ color: "var(--sk-text-accent)", font: "var(--sk-label-3)" }}>{v.responsesCount}</a>
      ) : (
        <span className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>0</span>
      )
    ) },
    { key: "visible", title: "Публикация сотрудникам", render: (v) => (
      <div className="sk-row sk-gap-2" onClick={(e) => e.stopPropagation()}>
        <Switch checked={!!v.visibleToEmployees} onChange={() => togglePublish(v)} />
        <span className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>{v.visibleToEmployees ? "Видна" : "Скрыта"}</span>
      </div>
    ) },
    { key: "actions", title: "", width: 56, render: (v) => (
      v.source === "manual" && (
        <Tooltip content="Редактировать">
          <Button size="s" mode="tertiary" onClick={(e) => { e.stopPropagation(); setFormModal({ mode: "edit", vacancy: v }); }}><IconEdit size={15} /></Button>
        </Tooltip>
      )
    ) },
  ];

  function exportResponsesCsv() {
    const header = ["Вакансия", "Направление", "Подразделение", "Статус", "Отклики"];
    const rows = vacancies.map((v) => [v.title, v.direction, v.department, v.status === "open" ? "Идёт поиск" : "Закрыта", v.responsesCount]);
    const csv = "\uFEFF" + [header, ...rows].map((r) => r.map((c) => '"' + String(c).replace(/"/g, '""') + '"').join(";")).join("\r\n");
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "otkliki-vakansii.csv";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast("Файл со сводкой откликов скачан");
  }

  return (
    <AppShell role="hr" active="vacancies" base="..">
      <div className="sk-row" style={{ justifyContent: "space-between", alignItems: "center" }}>
        <div className="sk-title-4">Вакансии</div>
        <div className="sk-row sk-gap-2">
          <Button mode="secondary" icon={<IconFolderHeart size={16} />} onClick={exportResponsesCsv}>Выгрузить отклики</Button>
          <Tooltip content={<div style={{ maxWidth: 200, whiteSpace: "normal" }}>Импорт из Excel — вне текущей итерации прототипа.</div>}>
            <Button style={{ background: "var(--sk-accent-secondary)", color: "var(--sk-text-accent)" }} icon={<IconUpload size={16} />} disabled>Загрузить вакансии</Button>
          </Tooltip>
          <Button variant="accent" icon={<IconPlusSm size={16} />} onClick={() => setFormModal({ mode: "create" })}>Создать вакансию</Button>
        </div>
      </div>
      <VacanciesModeTabs active="manage" />

      <div className="sk-row sk-gap-2" style={{ alignItems: "center" }}>
        <Input size="s" icon={<IconSearch size={20} />} placeholder="Поиск по названию или подразделению" value={q} onChange={(e) => setQ(e.target.value || "")} style={{ maxWidth: 420, flex: 1 }} />
        <Button mode="secondary" icon={<Icons.IconFilter size={16} />} onClick={() => setFiltersOpen((o) => !o)}
          style={{ background: "var(--sk-surface-page)", border: "1px solid var(--sk-stroke)" }}>
          Фильтры{hasActiveFilters ? " · " + activeFilterCount : ""}
        </Button>
        <div style={{ marginLeft: "auto" }}>
          <ColumnsPicker visible={visibleOptionalCols} onApply={setVisibleOptionalCols} />
        </div>
      </div>

      {filtersOpen && (
        <Card bordered>
          <div className="sk-row sk-gap-3" style={{ flexWrap: "wrap", alignItems: "flex-end" }}>
            <Select label="Направление" value={filters.direction} placeholder="Любое направление"
              options={D.directions.map((d) => ({ value: d, label: d }))}
              onChange={(v) => setFilters((f) => ({ ...f, direction: v }))} style={{ minWidth: 200 }} />
            <Select label="Подразделение" value={filters.department} placeholder="Любое подразделение"
              options={departmentOptions.map((d) => ({ value: d, label: d }))}
              onChange={(v) => setFilters((f) => ({ ...f, department: v }))} style={{ minWidth: 200 }} />
            <Select label="Регион" value={filters.city} placeholder="Любой регион"
              options={cityOptions.map((c) => ({ value: c, label: c }))}
              onChange={(v) => setFilters((f) => ({ ...f, city: v }))} style={{ minWidth: 180 }} />
            <Select label="Формат работы" value={filters.format} placeholder="Любой формат"
              options={D.workFormats.map((f) => ({ value: f, label: f }))}
              onChange={(v) => setFilters((f) => ({ ...f, format: v }))} style={{ minWidth: 180 }} />
            <Select label="Тип занятости" value={filters.employment} placeholder="Любой тип"
              options={D.employmentTypes.map((e) => ({ value: e, label: e }))}
              onChange={(v) => setFilters((f) => ({ ...f, employment: v }))} style={{ minWidth: 180 }} />
            <Select label="Источник" value={filters.source} placeholder="Любой источник"
              options={[{ value: "ats", label: "АТС" }, { value: "manual", label: "Создана вручную" }]}
              onChange={(v) => setFilters((f) => ({ ...f, source: v }))} style={{ minWidth: 180 }} />
            <Select label="Публикация сотрудникам" value={filters.visibility} placeholder="Любой статус"
              options={[{ value: "visible", label: "Опубликована" }, { value: "hidden", label: "Скрыта" }]}
              onChange={(v) => setFilters((f) => ({ ...f, visibility: v }))} style={{ minWidth: 200 }} />
            {hasActiveFilters && (
              <Button mode="tertiary" onClick={() => setFilters({ direction: "", department: "", city: "", format: "", employment: "", source: "", visibility: "" })}>Сбросить</Button>
            )}
          </div>
        </Card>
      )}

      <label className="sk-row sk-gap-2 sk-clickable" style={{ font: "var(--sk-label-4-regular)", color: "var(--sk-text-secondary)" }}>
        <input type="checkbox" checked={showClosed} onChange={(e) => setShowClosed(e.target.checked)} />
        Показать закрытые
      </label>

      <div className="sk-scroll" style={{ overflowX: "auto" }}>
        <Table columns={columns} rows={filtered} onRowClick={(v) => { window.location.href = "vacancy.html?id=" + v.id; }} />
      </div>
      {filtered.length === 0 && (
        <Card><div className="sk-muted" style={{ textAlign: "center", padding: "16px 0" }}>Ничего не нашлось по заданным условиям.</div></Card>
      )}

      {formModal && (
        <VacancyFormModal
          initial={formModal.mode === "edit" ? {
            title: formModal.vacancy.title, direction: formModal.vacancy.direction, department: formModal.vacancy.department,
            city: formModal.vacancy.city, format: formModal.vacancy.format, grade: formModal.vacancy.grade,
            employment: formModal.vacancy.employment, salaryFrom: formModal.vacancy.salaryFrom ? String(formModal.vacancy.salaryFrom) : "", salaryTo: formModal.vacancy.salaryTo ? String(formModal.vacancy.salaryTo) : "",
            experience: formModal.vacancy.experience, responsibilities: (formModal.vacancy.responsibilities || []).join("\n"),
            requirements: (formModal.vacancy.requirements || []).join("\n"), conditions: (formModal.vacancy.conditions || []).join("\n"),
            requiredSkills: (formModal.vacancy.requiredSkills || []).join(", "),
          } : null}
          onClose={() => setFormModal(null)} onSave={saveForm} />
      )}

      {toast && (
        <div style={{ position: "fixed", bottom: 24, left: "50%", transform: "translateX(-50%)", zIndex: 100 }}>
          <Snackbar>{toast}</Snackbar>
        </div>
      )}
    </AppShell>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Page />);
</script>
</body>
</html>
