<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Моя адаптация — Skillaz Start</title>
<link rel="stylesheet" href="../assets/styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script src="../assets/ds_bundle.js"></script>
<script src="../assets/data.js"></script>
<script type="text/babel" src="../assets/shell.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Card, ProgressCircle, Tag } = window.SkillazCoreDesignSystem_bf9566;
const { AppShell, StatusTag, Icons } = window.Site;
const { IconTarget, IconCheck } = Icons;
const D = window.SITE_DATA;

function progressOf(plan) {
  if (!plan.hasGoals) {
    const all = plan.stages.flatMap(s => s.items.filter(i => i.kind !== "checkpoint"));
    const done = all.filter(i => i.done).length;
    return all.length ? Math.round((done / all.length) * 100) : 0;
  }
  const goalsDone = plan.goals.filter(g => g.subgoals.length && g.subgoals.every(s => s.status === "done")).length;
  return plan.goals.length ? Math.round((goalsDone / plan.goals.length) * 100) : 0;
}

function PlanCard({ plan }) {
  const pct = plan.status === "completed" ? 100 : progressOf(plan);
  const checkpoints = Object.values(plan.checkpoints || {});
  return (
    <a href={"plan.html?plan=" + plan.id} style={{ textDecoration: "none" }}>
      <Card bordered style={{ cursor: "pointer" }}>
        <div className="sk-row sk-gap-4" style={{ justifyContent: "space-between" }}>
          <div className="sk-col sk-gap-2" style={{ flex: 1 }}>
            <div className="sk-row sk-gap-2">
              <Tag size="s" hue="neutral">{plan.type}</Tag>
              <StatusTag status={plan.status === "completed" ? "completed" : "in_progress_plan"} />
            </div>
            <div className="sk-title-5">{plan.title}</div>
            <div className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>
              {plan.dateStart} – {plan.dateEnd}
            </div>
            {checkpoints.length > 0 && (
              <div className="sk-row sk-gap-2" style={{ marginTop: 2 }}>
                <span className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>Контрольные точки:</span>
                <div className="sk-row sk-gap-1">
                  {checkpoints.map(cp => (
                    <span key={cp.id} title={cp.short} style={{
                      width: 18, height: 18, borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center",
                      background: cp.status === "done" ? "var(--sk-positive)" : "var(--sk-surface-secondary)",
                      color: cp.status === "done" ? "var(--sk-text-contrast)" : "var(--sk-icon-secondary)",
                    }}>
                      {cp.status === "done" ? <IconCheck size={10} /> : <IconTarget size={10} />}
                    </span>
                  ))}
                </div>
              </div>
            )}
          </div>
          <ProgressCircle value={pct} size={72} thickness={5} hue={plan.status === "completed" ? "positive" : "accent"} />
        </div>
      </Card>
    </a>
  );
}

function Page() {
  const plans = [D.plans.onboarding, D.plans.preboarding]
    .sort((a, b) => (a.status === "completed") - (b.status === "completed"));
  return (
    <AppShell role="employee" active="my-adaptation" base="..">
      <div className="sk-col sk-gap-2">
        <div className="sk-title-4">Моя адаптация</div>
        <div className="sk-muted">Здесь собраны все ваши планы — от пребординга до адаптации в роли.</div>
      </div>
      <div className="sk-col sk-gap-4">
        {plans.map(p => <PlanCard key={p.id} plan={p} />)}
      </div>
    </AppShell>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Page />);
</script>
</body>
</html>
