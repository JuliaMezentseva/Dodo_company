<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Вакансии — Skillaz Start</title>
<link rel="stylesheet" href="../assets/styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script src="../assets/ds_bundle.js"></script>
<script src="../assets/data.js"></script>
<script type="text/babel" src="../assets/shell.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Card, Tag, Input, Button, Select, Checkbox } = window.SkillazCoreDesignSystem_bf9566;
const { AppShell, Icons, directionHue } = window.Site;
const { IconSearch, IconMapPin, IconBriefcase, IconCheck, IconFilter } = Icons;
const D = window.SITE_DATA;


function fmtMoney(n) { return n.toLocaleString("ru-RU"); }
function toOptions(list) { return list.map((v) => ({ value: v, label: v })); }

const emptyFilters = { positions: [], departments: [], experience: [], cities: [], formats: [], employments: [], showClosed: false };

// Пилюля направления — некликабельный тег сверху карточки использует те же hue, что и
// на детальном экране вакансии (directionHue), чтобы направления визуально совпадали
// между витриной и карточкой.
function DirectionPill({ direction, active, count, onClick, isAll }) {
  return (
    <button type="button" onClick={onClick} className="sk-clickable" style={{
      display: "inline-flex", alignItems: "center", gap: 6, height: 32, padding: "0 14px",
      borderRadius: "var(--sk-radius-full)", border: "none",
      background: active ? "var(--sk-surface-dark)" : "var(--sk-surface-secondary)",
      color: active ? "var(--sk-text-contrast)" : "var(--sk-text-primary)",
      font: "var(--sk-label-3-regular)", cursor: "pointer", whiteSpace: "nowrap",
    }}>
      {direction}
      <span style={{ opacity: active ? 0.85 : 0.6 }}>{count}</span>
    </button>
  );
}

function VacancyCard({ vacancy, hasResponse }) {
  const closed = vacancy.status === "closed";
  const [hovered, setHovered] = React.useState(false);
  return (
    <a href={"vacancy.html?id=" + vacancy.id} style={{ textDecoration: "none" }}
      onMouseEnter={() => setHovered(true)} onMouseLeave={() => setHovered(false)}>
      <Card bordered
        style={{
          cursor: "pointer", height: "100%",
          boxShadow: hovered ? "inset 0 0 0 1.5px var(--sk-stroke-accent)" : "inset 0 0 0 1px var(--sk-stroke)",
        }}>
        <div className="sk-col sk-gap-3" style={{ height: "100%" }}>
          <div className="sk-row" style={{ justifyContent: "space-between", alignItems: "flex-start", gap: 8 }}>
            <span style={{ opacity: hasResponse ? 0.55 : 1 }}>
              <Tag size="s" hue={directionHue(vacancy.direction)}>{vacancy.direction}</Tag>
            </span>
            {hasResponse
              ? <Tag size="s" hue="positive" icon={<IconCheck size={12} />}>Есть отклик</Tag>
              : (closed && <Tag size="s" hue="neutral">Закрыта</Tag>)}
          </div>

          <div className="sk-col sk-gap-1" style={{ flex: 1, opacity: hasResponse ? 0.55 : 1 }}>
            <div className="sk-label-2">{vacancy.title}</div>
            <div className="sk-row sk-gap-2 sk-muted" style={{ font: "var(--sk-label-4-regular)", flexWrap: "wrap" }}>
              <span className="sk-row sk-gap-1"><IconMapPin size={13} />{vacancy.city}</span>
              <span className="sk-row sk-gap-1"><IconBriefcase size={13} />{vacancy.department}</span>
            </div>
          </div>

          <div className="sk-row" style={{ justifyContent: "space-between", alignItems: "center", opacity: hasResponse ? 0.55 : 1 }}>
            {vacancy.salaryFrom && vacancy.salaryTo ? (
              <div className="sk-label-3-regular">{fmtMoney(vacancy.salaryFrom)} – {fmtMoney(vacancy.salaryTo)} ₽</div>
            ) : (
              <div className="sk-muted" style={{ font: "var(--sk-label-3-regular)" }}>По договорённости</div>
            )}
            <span className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>{vacancy.postedDate}</span>
          </div>
        </div>
      </Card>
    </a>
  );
}

// Боковая панель фильтров — серый фон, справа от списка вакансий (как в исходном
// референсе витрины). Подразделения собираем из фактических вакансий, а не из
// отдельного справочника — такого справочника в данных нет.
function FiltersPanel({ filters, onChange, positionOptions, departmentOptions, hasActive, onReset }) {
  const set = (key) => (v) => onChange((f) => ({ ...f, [key]: v }));
  return (
    <Card style={{ background: "var(--sk-surface-secondary)" }}>
      <div className="sk-col sk-gap-4">
        <div className="sk-row" style={{ justifyContent: "space-between" }}>
          <div className="sk-row sk-gap-2 sk-label-3"><IconFilter size={16} />Фильтры</div>
          {hasActive && <button className="sk-link-btn sk-label-4-regular" onClick={onReset}>Сбросить</button>}
        </div>
        <Select label="Должность" multiple placeholder="Любая должность"
          options={positionOptions} value={filters.positions} onChange={set("positions")} />
        <Select label="Подразделение" multiple placeholder="Все подразделения"
          options={departmentOptions} value={filters.departments} onChange={set("departments")} />
        <Select label="Опыт" multiple placeholder="Любой опыт"
          options={toOptions(D.experienceOptions)} value={filters.experience} onChange={set("experience")} />
        <Select label="Регион" multiple placeholder="Любой регион"
          options={toOptions(D.cities)} value={filters.cities} onChange={set("cities")} />
        <Select label="Формат работы" multiple placeholder="Любой формат"
          options={toOptions(D.workFormats)} value={filters.formats} onChange={set("formats")} />
        <Select label="Тип занятости" multiple placeholder="Любой тип"
          options={toOptions(D.employmentTypes)} value={filters.employments} onChange={set("employments")} />
        <Checkbox label="Показать закрытые вакансии" checked={filters.showClosed}
          onChange={() => onChange((f) => ({ ...f, showClosed: !f.showClosed }))} style={{ alignSelf: "flex-start" }} />
      </div>
    </Card>
  );
}

function Page() {
  // Сотрудник видит только опубликованные HR-ом вакансии (visibleToEmployees) — вручную
  // созданные и ещё не опубликованные HR-ом вакансии на витрине не показываются, ровно
  // как задумано в разделе HR "Вакансии" (переключатель "Опубликована / Скрыта").
  const visibleVacancies = React.useMemo(() => D.vacancies.filter((v) => v.visibleToEmployees !== false), []);
  const responses = D.myResponses;
  const respondedIds = React.useMemo(() => new Set(responses.map((r) => r.vacancyId)), [responses]);

  const [q, setQ] = React.useState("");
  const [direction, setDirection] = React.useState(null); // null = все направления
  const [filters, setFilters] = React.useState(emptyFilters);

  const departmentOptions = React.useMemo(
    () => toOptions([...new Set(visibleVacancies.map((v) => v.department))].sort()),
    [visibleVacancies]
  );
  const positionOptions = React.useMemo(
    () => toOptions([...new Set(visibleVacancies.map((v) => v.title))].sort()),
    [visibleVacancies]
  );

  const directionCounts = React.useMemo(() => {
    const map = {};
    visibleVacancies.forEach((v) => { map[v.direction] = (map[v.direction] || 0) + 1; });
    return map;
  }, [visibleVacancies]);

  const needle = q.trim().toLowerCase();
  const filtered = visibleVacancies.filter((v) => {
    if (!filters.showClosed && v.status === "closed") return false;
    if (direction && v.direction !== direction) return false;
    if (filters.positions.length && !filters.positions.includes(v.title)) return false;
    if (filters.departments.length && !filters.departments.includes(v.department)) return false;
    if (filters.experience.length && !filters.experience.includes(v.experience)) return false;
    if (filters.cities.length && !filters.cities.includes(v.city)) return false;
    if (filters.formats.length && !filters.formats.includes(v.format)) return false;
    if (filters.employments.length && !filters.employments.includes(v.employment)) return false;
    if (needle && !v.title.toLowerCase().includes(needle) && !v.department.toLowerCase().includes(needle)) return false;
    return true;
  });

  const hasActiveFilters = filters.positions.length || filters.departments.length || filters.experience.length || filters.cities.length
    || filters.formats.length || filters.employments.length || filters.showClosed;

  return (
    <AppShell role="employee" active="vacancies" base="..">
      <div className="sk-title-4" style={{ marginBottom: 4 }}>Откройте новые карьерные возможности</div>
      <div className="sk-muted" style={{ font: "var(--sk-label-3-regular)", marginBottom: 20 }}>
        {visibleVacancies.length} открытых вакансий внутри компании
      </div>

      <div className="sk-row sk-gap-2" style={{ alignItems: "center" }}>
        <Input icon={<IconSearch size={20} />} placeholder="По названию, должности или подразделению"
          value={q} onChange={(e) => setQ(e.target.value || "")} style={{ width: 460, flexShrink: 0 }} />
        <a href="my-responses.html" style={{ textDecoration: "none", flexShrink: 0 }}>
          <Button style={{ background: "var(--sk-special-secondary)", color: "var(--sk-special)" }} icon={<Icons.IconClipboard size={16} />}>Мои отклики{responses.length ? " · " + responses.length : ""}</Button>
        </a>
      </div>

      <div className="sk-row sk-gap-2" style={{ flexWrap: "wrap" }}>
        <DirectionPill direction="Все направления" active={!direction} isAll count={visibleVacancies.length} onClick={() => setDirection(null)} />
        {D.directions.filter((d) => directionCounts[d]).map((d) => (
          <DirectionPill key={d} direction={d} active={direction === d}
            count={directionCounts[d]}
            onClick={() => setDirection(direction === d ? null : d)} />
        ))}
      </div>

      <div className="sk-row" style={{ alignItems: "flex-start", gap: 24 }}>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div className="sk-muted" style={{ font: "var(--sk-label-4-regular)", marginBottom: 12 }}>Найдено вакансий: {filtered.length}</div>
          {filtered.length === 0 ? (
            <Card><div className="sk-muted" style={{ textAlign: "center", padding: "24px 0" }}>Ничего не нашлось по заданным условиям.</div></Card>
          ) : (
            <div style={{ display: "grid", gridTemplateColumns: "repeat(2, 1fr)", gap: 16 }}>
              {filtered.map((v) => <VacancyCard key={v.id} vacancy={v} hasResponse={respondedIds.has(v.id)} />)}
            </div>
          )}
        </div>

        <div style={{ width: 260, flexShrink: 0 }}>
          <FiltersPanel filters={filters} onChange={setFilters} positionOptions={positionOptions} departmentOptions={departmentOptions}
            hasActive={hasActiveFilters} onReset={() => setFilters(emptyFilters)} />
        </div>
      </div>
    </AppShell>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Page />);
</script>
</body>
</html>
