<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>План сотрудника — Skillaz Start</title>
<link rel="stylesheet" href="../assets/styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script src="../assets/ds_bundle.js"></script>
<script src="../assets/data.js"></script>
<script type="text/babel" src="../assets/shell.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {
  Card, ProgressCircle, ProgressBar, Tag, Avatar, Divider, Tabs, SegmentedControl, Modal, Drawer, Checkbox,
  Textarea, Input, Select, DatePicker, Button, Snackbar, Alert,
} = window.SkillazCoreDesignSystem_bf9566;
const { AppShell, StatusTag, Icons, personPhoto } = window.Site;
const {
  IconArrowLeft, IconCheck, IconLock, IconClock, IconFileText, IconLink2, IconMessageCircle,
  IconHelpCircle, IconInfo, IconTarget, IconMapPin, IconPhone, IconMail, IconSend,
  IconChevronUp, IconChevronDown, IconX, IconAlertCircle, IconTrash, IconSearch, IconClipboard, IconPlusSm,
  IconEdit, IconLayers, IconSparkles, IconBookOpen,
} = Icons;
const D = window.SITE_DATA;

function useDeepState(initial) {
  const [state, setState] = React.useState(() => JSON.parse(JSON.stringify(initial)));
  return [state, setState];
}
function employeeIdFromUrl() {
  const id = new URLSearchParams(window.location.search).get("employee");
  const m = D.team.find(t => t.id === id && t.planId);
  return m ? m.id : "yulia";
}
function initialTabFromUrl() {
  const t = new URLSearchParams(window.location.search).get("tab");
  return t === "max" ? "max" : "min";
}

const MONTHS = ["янв", "фев", "мар", "апр", "май", "июн", "июл", "авг", "сен", "окт", "ноя", "дек"];
function fmtDate(date) { return date.getDate() + " " + MONTHS[date.getMonth()] + " " + date.getFullYear(); }

const ELEMENT_ICON = { article: IconFileText, task: IconCheck, course: IconFileText, survey: IconHelpCircle, file: IconFileText, link: IconLink2, checkpoint: IconTarget };
const ELEMENT_LABEL = { article: "Статья", task: "Задача", course: "Курс", survey: "Опрос", file: "Файл", link: "Ссылка", checkpoint: "Контрольная точка" };
const SUBGOAL_ICON = {
  done: { icon: IconCheck, bg: "var(--sk-positive)", fg: "var(--sk-text-contrast)" },
  not_done: { icon: IconX, bg: "var(--sk-negative)", fg: "var(--sk-text-contrast)" },
  pending_review: { icon: IconInfo, bg: "var(--sk-warning)", fg: "var(--sk-text-contrast)" },
  in_progress: { icon: IconClock, bg: "var(--sk-accent)", fg: "var(--sk-text-contrast)" },
};

const MIN_TAB_NOTE = "Этот чек-лист помогает сотруднику закрыть формальный порог входа в роль: доступы, культуру и регламенты компании. Он одинаков для всех на этой позиции и не требует вашего подтверждения — сотрудник отмечает пункты сам.";
const MAX_TAB_NOTE = "Персональный план сотрудника на результат в роли. Здесь вы ставите цели, проверяете и подтверждаете подцели, а прогресс сверяете на контрольных точках.";
const CP_YELLOW = "var(--yellow-yellow-85)";
const CP_YELLOW_BG = "var(--yellow-yellow-96)";
const CP_YELLOW_BORDER = "var(--yellow-yellow-80)";
// Та же шкала-смайлы, что видит сотрудник в employee/plan.html (CheckpointModal) — переносим
// 1-в-1, чтобы проверяющий читал ответы сотрудника в той же визуальной кодировке, а не как
// мелкие голые цифры без цвета и формы.
const SCALE_TINTS = { 1: "#FBE4E4", 2: "#FCEBD6", 3: "#FBF3CB", 4: "#DEF3E1", 5: "#CFEDD5" };
const SCALE_BORDERS = { 1: "#E0716F", 2: "#E0A23D", 3: "#D2B93B", 4: "#5DAE6F", 5: "#3E9E56" };
const SCALE_MOUTHS = {
  1: "M8.2 16c1.4-2 6.2-2 7.6 0",
  2: "M8.2 15.4c1.4-1 6.2-1 7.6 0",
  3: "M8.2 15h7.6",
  4: "M8.2 14.4c1.4 1 6.2 1 7.6 0",
  5: "M7.6 13.8c1.9 2.6 6.9 2.6 8.8 0",
};
function ScaleFace({ n, size = 22, color }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none">
      <circle cx="9" cy="10" r="1.25" fill={color} />
      <circle cx="15" cy="10" r="1.25" fill={color} />
      <path d={SCALE_MOUTHS[n]} stroke={color} strokeWidth="1.6" strokeLinecap="round" fill="none" />
    </svg>
  );
}

function goalProgress(goal) {
  const total = goal.subgoals.length;
  const done = goal.subgoals.filter(s => s.status === "done").length;
  return { done, total, pct: total ? Math.round((done / total) * 100) : 0 };
}
function findChecklistItem(plan, id) {
  for (const s of plan.stages) {
    const it = s.items.find(i => i.id === id);
    if (it) return { item: it, stage: s };
  }
  return null;
}
function planValidForPublish(goals) {
  if (!goals.length) return false;
  return goals.every(g => g.title && g.description && g.dueLabel && g.subgoals.length > 0 &&
    g.subgoals.every(sg => sg.title && sg.description && sg.dueLabel && sg.reviewer));
}
const REVIEWER_OPTIONS = [D.manager, ...D.assistants].map(p => ({ value: p.name, label: p.name === D.manager.name ? "Я (" + p.name + ")" : p.name }));

function Page() {
  const employeeId = employeeIdFromUrl();
  const member = D.team.find(t => t.id === employeeId);
  const basePlan = D.plans[member.planId];
  const [plan, setPlan] = useDeepState(basePlan);
  const [tab, setTab] = React.useState(initialTabFromUrl);
  const [toast, setToast] = React.useState(null);

  const [goalDrawer, setGoalDrawer] = React.useState(null); // { mode: "new" } | { mode: "edit", goalId }
  const [newGoalDraft, setNewGoalDraft] = React.useState({ title: "", description: "", dueDate: new Date(2026, 0, 20), subgoals: [] });
  const [goalMethodModal, setGoalMethodModal] = React.useState(false); // выбор способа создания цели
  const [subgoalMethodModal, setSubgoalMethodModal] = React.useState(null); // { context: "draft" } | { context: "goal", goalId } — выбор способа добавления шага
  const [subgoalModal, setSubgoalModal] = React.useState(null); // { context: "draft" } | { context: "goal", goalId }
  const [subgoalDrawer, setSubgoalDrawer] = React.useState(null); // { goalId, subgoalId }
  const [checklistPicker, setChecklistPicker] = React.useState(null); // { goalId, subgoalId }
  const [publishConfirm, setPublishConfirm] = React.useState(false);
  const [returnModal, setReturnModal] = React.useState(null); // { goalId, subgoalId }
  const [notDoneConfirm, setNotDoneConfirm] = React.useState(null);
  const [deleteGoal, setDeleteGoal] = React.useState(null);
  const [deleteSubgoal, setDeleteSubgoal] = React.useState(null);
  const [taskModal, setTaskModal] = React.useState(null);
  const [cpModal, setCpModal] = React.useState(null);

  function showToast(msg) {
    setToast(msg);
    window.clearTimeout(showToast._t);
    showToast._t = window.setTimeout(() => setToast(null), 3200);
  }

  // ---------------- Цели: CRUD ----------------
  function addGoal(draft) {
    const id = "g" + Date.now();
    const subgoals = (draft.subgoals || []).map((sg, i) => ({
      id: "sg" + Date.now() + "_" + i, title: sg.title, description: sg.description,
      dueLabel: fmtDate(sg.dueDate), reviewer: sg.reviewer, status: "not_started", checklistRefs: [], comments: [],
    }));
    setPlan(prev => ({ ...prev, goals: [...prev.goals, {
      id, title: draft.title, description: draft.description, dueLabel: fmtDate(draft.dueDate),
      status: "not_started", subgoals,
    }] }));
    return id;
  }
  function updateGoal(goalId, patch) {
    setPlan(prev => ({ ...prev, goals: prev.goals.map(g => g.id !== goalId ? g : { ...g, ...patch }) }));
  }
  function removeGoal(goalId) {
    setPlan(prev => ({ ...prev, goals: prev.goals.filter(g => g.id !== goalId) }));
    setDeleteGoal(null);
    showToast("Цель удалена");
  }
  function addSubgoal(goalId, draft) {
    const id = "sg" + Date.now();
    setPlan(prev => ({ ...prev, goals: prev.goals.map(g => g.id !== goalId ? g : {
      ...g, subgoals: [...g.subgoals, {
        id, title: draft.title, description: draft.description, dueLabel: fmtDate(draft.dueDate),
        reviewer: draft.reviewer, status: "not_started", checklistRefs: [], comments: [],
      }],
    }) }));
    return id;
  }
  function updateSubgoal(goalId, subgoalId, patch) {
    setPlan(prev => ({ ...prev, goals: prev.goals.map(g => g.id !== goalId ? g : {
      ...g, subgoals: g.subgoals.map(sg => sg.id !== subgoalId ? sg : { ...sg, ...patch }),
    }) }));
  }
  function removeSubgoal(goalId, subgoalId) {
    setPlan(prev => ({ ...prev, goals: prev.goals.map(g => g.id !== goalId ? g : {
      ...g, subgoals: g.subgoals.filter(sg => sg.id !== subgoalId),
    }) }));
    setDeleteSubgoal(null);
    showToast("Подцель удалена");
  }
  function toggleChecklistRef(goalId, subgoalId, itemId) {
    setPlan(prev => ({ ...prev, goals: prev.goals.map(g => g.id !== goalId ? g : {
      ...g, subgoals: g.subgoals.map(sg => sg.id !== subgoalId ? sg : {
        ...sg, checklistRefs: (sg.checklistRefs || []).includes(itemId)
          ? sg.checklistRefs.filter(x => x !== itemId) : [...(sg.checklistRefs || []), itemId],
      }),
    }) }));
  }
  function addComment(goalId, subgoalId, text) {
    setPlan(prev => ({ ...prev, goals: prev.goals.map(g => g.id !== goalId ? g : {
      ...g, subgoals: g.subgoals.map(sg => sg.id !== subgoalId ? sg : {
        ...sg, comments: [...(sg.comments || []), { author: D.manager.name, date: "Сегодня", text }],
      }),
    }) }));
  }

  // ---------------- Подтверждение / возврат / not_done ----------------
  function confirmSubgoal(goalId, subgoalId) {
    updateSubgoal(goalId, subgoalId, { status: "done" });
    showToast("Подцель подтверждена");
    setSubgoalDrawer(null);
  }
  function returnSubgoal(goalId, subgoalId, comment) {
    addComment(goalId, subgoalId, comment);
    updateSubgoal(goalId, subgoalId, { status: "in_progress" });
    showToast("Подцель возвращена в работу");
    setReturnModal(null);
    setSubgoalDrawer(null);
  }
  function markNotDone(goalId, subgoalId) {
    updateSubgoal(goalId, subgoalId, { status: "not_done" });
    showToast("Подцель отмечена невыполненной");
    setNotDoneConfirm(null);
    setSubgoalDrawer(null);
  }
  function publishGoals() {
    setPlan(prev => ({ ...prev, goalsPublished: true }));
    setPublishConfirm(false);
    showToast("Цели опубликованы");
  }
  function finishCheckpoint(cpId, patch) {
    setPlan(prev => ({ ...prev, checkpoints: { ...prev.checkpoints, [cpId]: { ...prev.checkpoints[cpId], ...patch, status: "done" } } }));
    showToast("Контрольная точка завершена");
    setCpModal(null);
  }
  function addCheckpointComment(cpId, text) {
    setPlan(prev => ({ ...prev, checkpoints: { ...prev.checkpoints, [cpId]: { ...prev.checkpoints[cpId], comments: [...(prev.checkpoints[cpId].comments || []), { author: D.manager.name, date: "Сегодня", text }] } } }));
  }

  const totalChecklist = plan.stages.flatMap(s => s.items.filter(i => i.kind !== "checkpoint"));
  const doneChecklist = totalChecklist.filter(i => i.done).length;
  const checklistPct = totalChecklist.length ? Math.round((doneChecklist / totalChecklist.length) * 100) : 0;
  const goalsDoneCount = plan.goals.filter(g => g.subgoals.length && g.subgoals.every(s => s.status === "done")).length;
  const goalsPct = plan.goals.length ? Math.round((goalsDoneCount / plan.goals.length) * 100) : 0;
  const overallPct = goalsPct;
  const canPublish = planValidForPublish(plan.goals) && !plan.goalsPublished;

  const activeGoal = goalDrawer && goalDrawer.goalId ? plan.goals.find(g => g.id === goalDrawer.goalId) : null;
  const activeSubgoalGoal = subgoalDrawer && plan.goals.find(g => g.id === subgoalDrawer.goalId);
  const activeSubgoal = activeSubgoalGoal && activeSubgoalGoal.subgoals.find(s => s.id === subgoalDrawer.subgoalId);

  const tabItems = [
    { id: "min", label: <span className="sk-row sk-gap-1"><IconClipboard size={16} />Базовые действия {checklistPct}%</span> },
    ...(plan.hasGoals ? [{ id: "max", label: <span className="sk-row sk-gap-1"><IconTarget size={16} />План адаптации {goalsPct}%</span> }] : []),
    { id: "chat", label: <span className="sk-row sk-gap-1"><IconMessageCircle size={16} />Чат</span> },
    { id: "faq", label: <span className="sk-row sk-gap-1"><IconHelpCircle size={16} />FAQ</span> },
  ];

  return (
    <AppShell role="manager" active="team" base=".."
      breadcrumb={<a href="team.html" className="sk-row sk-gap-1" style={{ color: "var(--sk-text-secondary)" }}><IconArrowLeft size={14} /> Моя команда</a>}>
      <Tabs items={tabItems} active={tab} onChange={setTab} />

      <div className="sk-row" style={{ alignItems: "flex-start", gap: 24 }}>
        <div className="sk-col sk-gap-6" style={{ flex: 1, minWidth: 0 }}>
          {tab === "min" && (
            <React.Fragment>
              <Alert hue="neutral" style={{ background: "var(--sk-surface-page)", boxShadow: "inset 0 0 0 1px var(--sk-stroke)" }}>{MIN_TAB_NOTE}</Alert>
              <Card bordered>
                <div className="sk-col sk-gap-4">
                  <div className="sk-title-5">Чек-лист {doneChecklist} из {totalChecklist.length}</div>
                  {plan.stages.map((s, i) => (
                    <ManagerStageBlock key={s.id} stage={s} index={i + 1}
                      defaultOpen={s.status !== "locked" && s.status !== "completed"}
                      onOpenItem={(item) => setTaskModal(item)}
                      onAdd={() => showToast("Добавление элементов чек-листа доступно в редакторе адаптации")} />
                  ))}
                </div>
              </Card>
            </React.Fragment>
          )}

          {tab === "max" && plan.hasGoals && (
            <React.Fragment>
              <Alert hue="neutral" style={{ background: "var(--sk-surface-page)", boxShadow: "inset 0 0 0 1px var(--sk-stroke)" }}>{MAX_TAB_NOTE}</Alert>

              {plan.goals.length === 0 && (
                <Card>
                  <div className="sk-col sk-gap-3" style={{ alignItems: "center", textAlign: "center", padding: "24px 16px" }}>
                    <div className="sk-title-5">Сформируйте цель и шаги для её достижения{plan.goalsDeadlineLabel ? " до " + plan.goalsDeadlineLabel : ""}</div>
                    <div className="sk-muted" style={{ maxWidth: 440 }}>Цель — это ожидаемый вами измеримый результат, с которым сотрудник должен окончить план адаптации</div>
                    <Button onClick={() => setGoalMethodModal(true)}>+ Создать</Button>
                  </div>
                </Card>
              )}

              {plan.goals.length > 0 && (
                <Card bordered padding={0}>
                  <div className="sk-row" style={{ justifyContent: "space-between", padding: "16px 24px", background: "var(--sk-surface-secondary)", borderRadius: "var(--sk-radius-4) var(--sk-radius-4) 0 0", flexWrap: "wrap", gap: 12 }}>
                    <div className="sk-row sk-gap-2">
                      <div className="sk-title-5">Цели</div>
                      <ProgressCircle value={goalsPct} size={24} thickness={3} showValue={false} hue="accent" />
                      <span className="sk-label-3-regular">{goalsDoneCount} из {plan.goals.length}</span>
                    </div>
                    {!plan.goalsPublished && (
                      <div className="sk-col sk-gap-1" style={{ alignItems: "flex-end" }}>
                        <div className="sk-row sk-gap-2">
                          <Button size="s" mode="secondary" disabled={plan.employeeStarted}
                            onClick={() => setGoalMethodModal(true)}>Создать</Button>
                          <Button size="s" variant="positive" disabled={!canPublish} onClick={() => setPublishConfirm(true)}>
                            Опубликовать
                          </Button>
                        </div>
                      </div>
                    )}
                  </div>
                  <div className="sk-col sk-gap-5" style={{ padding: "20px 24px" }}>
                    {plan.goals.map(g => (
                      <ManagerGoalRow key={g.id} goal={g} plan={plan}
                        onOpenGoal={() => setGoalDrawer({ mode: "edit", goalId: g.id })}
                        onOpenSubgoal={(sgId) => setSubgoalDrawer({ goalId: g.id, subgoalId: sgId })}
                        onOpenMaterials={(sgId) => setChecklistPicker({ goalId: g.id, subgoalId: sgId })}
                        onDeleteGoal={() => setDeleteGoal(g.id)} />
                    ))}
                  </div>
                </Card>
              )}
            </React.Fragment>
          )}
          {tab === "chat" && <ChatPanel member={member} />}
          {tab === "faq" && <FaqPanel plan={plan} />}
        </div>

        <div style={{ width: 320, flexShrink: 0 }}>
          <RightPanel member={member} plan={plan} overallPct={overallPct} onOpenCheckpoint={setCpModal} showCheckpoints={tab === "max"} />
        </div>
      </div>

      {/* ---- Модалка выбора способа создания цели ---- */}
      {goalMethodModal && (
        <GoalMethodModal onClose={() => setGoalMethodModal(false)}
          onManual={() => {
            setGoalMethodModal(false);
            setNewGoalDraft({ title: "", description: "", dueDate: new Date(2026, 0, 20), subgoals: [] });
            setGoalDrawer({ mode: "new" });
          }} />
      )}

      {/* ---- Дровер цели (создание/просмотр) ---- */}
      {goalDrawer && goalDrawer.mode === "new" && (
        <GoalCreateDrawer draft={newGoalDraft} setDraft={setNewGoalDraft}
          onClose={() => setGoalDrawer(null)}
          onAddSubgoal={() => setSubgoalMethodModal({ context: "draft" })}
          onCreate={() => { addGoal(newGoalDraft); setGoalDrawer(null); showToast("Цель создана"); }} />
      )}
      {goalDrawer && goalDrawer.mode === "edit" && activeGoal && (
        <GoalDrawer goal={activeGoal} plan={plan} editable={!plan.goalsPublished}
          onClose={() => setGoalDrawer(null)}
          onChange={(patch) => updateGoal(activeGoal.id, patch)}
          onAddSubgoal={() => setSubgoalMethodModal({ context: "goal", goalId: activeGoal.id })}
          onOpenSubgoal={(sgId) => { setGoalDrawer(null); setSubgoalDrawer({ goalId: activeGoal.id, subgoalId: sgId }); }}
          onOpenMaterials={(sgId) => setChecklistPicker({ goalId: activeGoal.id, subgoalId: sgId })}
          onDeleteSubgoal={(sgId) => setDeleteSubgoal({ goalId: activeGoal.id, subgoalId: sgId })} />
      )}

      {/* ---- Модалка выбора способа добавления шага ---- */}
      {subgoalMethodModal && (
        <SubgoalMethodModal onClose={() => setSubgoalMethodModal(null)}
          onManual={() => {
            const ctx = subgoalMethodModal;
            setSubgoalMethodModal(null);
            setSubgoalModal(ctx);
          }} />
      )}

      {/* ---- Модалка создания подцели ---- */}
      {subgoalModal && (
        <SubgoalCreateModal onClose={() => setSubgoalModal(null)}
          onCreate={(draft) => {
            if (subgoalModal.context === "draft") {
              setNewGoalDraft(d => ({ ...d, subgoals: [...d.subgoals, draft] }));
            } else {
              addSubgoal(subgoalModal.goalId, draft);
            }
            setSubgoalModal(null);
          }} />
      )}

      {/* ---- Дровер подцели (редактирование / подтверждение-возврат / просмотр) ---- */}
      {subgoalDrawer && activeSubgoal && (
        <SubgoalDrawer plan={plan} goal={activeSubgoalGoal} subgoal={activeSubgoal}
          onClose={() => setSubgoalDrawer(null)}
          onChange={(patch) => updateSubgoal(subgoalDrawer.goalId, subgoalDrawer.subgoalId, patch)}
          onOpenChecklistPicker={() => setChecklistPicker({ goalId: subgoalDrawer.goalId, subgoalId: subgoalDrawer.subgoalId })}
          onUnlinkChecklist={(itemId) => toggleChecklistRef(subgoalDrawer.goalId, subgoalDrawer.subgoalId, itemId)}
          onAddComment={(text) => addComment(subgoalDrawer.goalId, subgoalDrawer.subgoalId, text)}
          onConfirm={() => confirmSubgoal(subgoalDrawer.goalId, subgoalDrawer.subgoalId)}
          onReturn={() => setReturnModal(subgoalDrawer)}
          onNotDone={() => setNotDoneConfirm(subgoalDrawer)} />
      )}

      {checklistPicker && (
        <ChecklistPickerModal plan={plan}
          selected={(plan.goals.find(g => g.id === checklistPicker.goalId).subgoals.find(s => s.id === checklistPicker.subgoalId).checklistRefs) || []}
          onToggle={(itemId) => toggleChecklistRef(checklistPicker.goalId, checklistPicker.subgoalId, itemId)}
          onClose={() => setChecklistPicker(null)} />
      )}

      {publishConfirm && (
        <Modal open title={null} onClose={() => setPublishConfirm(false)} size="s"
          secondary={<Button mode="secondary" onClick={() => setPublishConfirm(false)}>Нет, отменить</Button>}
          primary={<Button variant="positive" onClick={publishGoals}>Да, опубликовать</Button>}>
          <div className="sk-col sk-gap-2" style={{ alignItems: "center", textAlign: "center", padding: "8px 0" }}>
            <div style={{ width: 40, height: 40, borderRadius: "50%", background: "var(--sk-warning-secondary)", display: "flex", alignItems: "center", justifyContent: "center" }}>
              <IconAlertCircle size={20} color="var(--sk-text-warning-dark)" />
            </div>
            <div className="sk-label-2">Опубликовать цели?</div>
            <div className="sk-muted">Они станут доступны сотруднику. Возможность добавлять другие цели станет недоступна. Изменение текущих целей будет доступно только до момента старта работы с ними сотрудником.</div>
          </div>
        </Modal>
      )}

      {returnModal && (
        <ReturnCommentModal onClose={() => setReturnModal(null)}
          onSubmit={(comment) => returnSubgoal(returnModal.goalId, returnModal.subgoalId, comment)} />
      )}

      {notDoneConfirm && (
        <Modal open title={null} onClose={() => setNotDoneConfirm(null)} size="s"
          secondary={<Button mode="secondary" onClick={() => setNotDoneConfirm(null)}>Отменить</Button>}
          primary={<Button variant="negative" onClick={() => markNotDone(notDoneConfirm.goalId, notDoneConfirm.subgoalId)}>Отметить не выполненной</Button>}>
          <div className="sk-col sk-gap-2" style={{ alignItems: "center", textAlign: "center", padding: "8px 0" }}>

// ---------------- Индикатор "Полезные материалы" у шага цели (3 состояния) ----------------
// published: цель опубликована — пилюля не показывается вовсе (материалы больше нельзя менять).
// count > 0: материалы уже привязаны — некликабельный индикатор с count, без иконки добавления.
// иначе: материалов ещё нет — кликабельная пилюля-приглашение добавить (иконка книги вместо "+").
function MaterialsBadge({ count, published, onClick }) {
  if (published) return null;
  const hasItems = count > 0;
  return (
    <span className={"sk-row sk-gap-1" + (hasItems ? "" : " sk-clickable")}
      onClick={hasItems ? undefined : (e) => { e.stopPropagation(); onClick(); }} style={{
      height: 26, padding: "0 10px 0 6px", borderRadius: "var(--sk-radius-full)",
      background: hasItems ? "var(--sk-surface-secondary)" : "var(--sk-accent-secondary)",
      color: hasItems ? "var(--sk-text-secondary)" : "var(--sk-text-accent)",
      font: "var(--sk-label-4)", whiteSpace: "nowrap",
    }}>
      <IconBookOpen size={15} />{hasItems ? "Полезные материалы: " + count : "Добавить материалы"}
    </span>
  );
}

// ---------------- Плитка выбора способа (переиспользуется в модалках цели/шага) ----------------
// variant="special" — акцентный вариант для варианта "С AI-помощником": светло-фиолетовая
// подложка плитки, тёмно-фиолетовая иконка — визуально выделяет AI-сценарий среди прочих
// способов. disabled НЕ приглушает плитку через opacity — варианты "Из каталога целей" и
// "С AI-помощником" полностью видимы и читаемы, просто не кликабельны (это не "скоро будет",
// а осознанно нереализованные в этой итерации способы).
function MethodTile({ icon: Icon, title, variant, disabled, onClick }) {
  const special = variant === "special";
  return (
    <div
      className={disabled ? "" : "sk-clickable"}
      onClick={disabled ? undefined : onClick}
      style={{
        position: "relative",
        flex: 1,
        display: "flex",
        flexDirection: "column",
        alignItems: "flex-start",
        justifyContent: "center",
        gap: 12,
        padding: "28px 16px",
        borderRadius: "var(--sk-radius-3)",
        border: "1px solid " + (special ? "transparent" : "var(--sk-stroke)"),
        background: special ? "var(--sk-special-secondary)" : "var(--sk-surface-page)",
        cursor: disabled ? "default" : "pointer",
        transition: "border-color .12s ease, box-shadow .12s ease",
      }}
      onMouseEnter={disabled ? undefined : (e) => { e.currentTarget.style.borderColor = "var(--sk-stroke-accent)"; e.currentTarget.style.boxShadow = "var(--sk-shadow-s)"; }}
      onMouseLeave={disabled ? undefined : (e) => { e.currentTarget.style.borderColor = special ? "transparent" : "var(--sk-stroke)"; e.currentTarget.style.boxShadow = "none"; }}
    >
      <span style={{
        width: 52, height: 52, borderRadius: "var(--sk-radius-2)", flexShrink: 0,
        display: "flex", alignItems: "center", justifyContent: "center",
        background: special ? "var(--sk-surface-page)" : "var(--sk-surface-secondary)",
        color: special ? "var(--violet-violet-35)" : "var(--sk-icon-secondary)",
      }}>
        <Icon size={26} />
      </span>
      <div className="sk-label-2" style={{ textAlign: "left", color: "var(--sk-text-primary)" }}>{title}</div>
    </div>
  );
}

              <button className="sk-link-btn sk-label-3-regular" onClick={onOpenChecklistPicker}

                <span className="sk-row sk-gap-1"><IconPlusSm size={16} />Добавить</span>
              </button>
            )}
          </div>
        </CollapsibleSection>

        <div className="sk-col sk-gap-3">
          <div className="sk-label-3">Комментарии</div>
          <Textarea placeholder="Написать комментарий" rows={2} value={comment} onChange={(e) => setComment(e.target.value || "")} />
          {comment.trim() && (
            <Button size="s" mode="secondary" style={{ alignSelf: "flex-start" }}
              onClick={() => { onAddComment(comment.trim()); setComment(""); }}>Отправить комментарий</Button>
          )}
          {(subgoal.comments || []).slice().reverse().map((c, i) => (
            <div key={i} className="sk-row sk-gap-3" style={{ alignItems: "flex-start" }}>
              <Avatar src={personPhoto(c.author)} name={c.author} size={28} />
              <div className="sk-col sk-gap-1" style={{ flex: 1 }}>
                <div className="sk-row sk-gap-2"><span className="sk-label-4">{c.author}</span><span className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>{c.date}</span></div>
                <div className="sk-label-3-regular">{c.text}</div>
              </div>
            </div>
          ))}
        </div>

        {isReview && (
          <div className="sk-col sk-gap-2" style={{ position: "sticky", bottom: 0, background: "var(--sk-surface-page)", paddingTop: 8 }}>
            <Divider />
            <div className="sk-row sk-gap-2" style={{ flexWrap: "wrap" }}>
              <Button onClick={onConfirm}>Подтвердить</Button>
              <Button mode="secondary" onClick={onReturn}>Вернуть в работу</Button>
              <Button mode="tertiary" variant="negative" onClick={onNotDone}>Отметить не выполненной</Button>
            </div>
          </div>
        )}
        {!isReview && canMarkNotDone && (
          <div className="sk-col sk-gap-2" style={{ position: "sticky", bottom: 0, background: "var(--sk-surface-page)", paddingTop: 8 }}>
            <Divider />
            <Alert hue="neutral">Ожидает подтверждения от {subgoal.reviewer}.</Alert>
            <div className="sk-row sk-gap-2">
              <Button mode="tertiary" variant="negative" onClick={onNotDone}>Отметить не выполненной</Button>
            </div>
          </div>
        )}
      </div>
    </Drawer>
  );
}

// ---------------- Модалка: комментарий для возврата в работу ----------------
function ReturnCommentModal({ onClose, onSubmit }) {
  const [comment, setComment] = React.useState("");
  const canSubmit = comment.trim().length > 0;
  return (
    <Modal open title="Вернуть подцель в работу" onClose={onClose} size="s"

        rows={3} value={comment} onChange={(e) => setComment(e.target.value || "")} />
    </Modal>

}

// ---------------- Модалка: привязка чек-листа ----------------
function ChecklistPickerModal({ plan, selected, onToggle, onClose }) {
  const [q, setQ] = React.useState("");
  const allItems = plan.stages.flatMap(s => s.items.filter(i => i.kind !== "checkpoint").map(i => ({ item: i, stage: s })));
  const list = q.trim() ? allItems.filter(x => x.item.title.toLowerCase().includes(q.trim().toLowerCase())) : allItems;
  return (
    <Modal open title="Полезные материалы" onClose={onClose} size="m"
      secondary={<Button mode="secondary" onClick={onClose}>Отменить</Button>}
      primary={<Button onClick={onClose}>Добавить</Button>}
      options={<Input icon={<IconSearch size={18} />} placeholder="Поиск по названию" value={q} onChange={(e) => setQ(e.target.value || "")} />}>
      <div className="sk-col sk-gap-1 sk-modal-scroll">
        {list.map(({ item, stage }) => (
          <div key={item.id} className="sk-row sk-gap-3 sk-clickable" style={{ padding: "10px 4px" }} onClick={() => onToggle(item.id)}>
            <Checkbox checked={selected.includes(item.id)} onChange={() => onToggle(item.id)} />
            <div className="sk-col sk-gap-1" style={{ flex: 1 }}>
              <div className="sk-label-3-regular">{item.title}</div>
              <div className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>{ELEMENT_LABEL[item.kind]} · Этап «{stage.title}»</div>
            </div>
          </div>
        ))}
        {!list.length && <div className="sk-muted" style={{ padding: "16px 0", textAlign: "center" }}>Ничего не нашлось</div>}
      </div>
    </Modal>
  );
}

// ---------------- Чек-лист (только просмотр для руководителя) ----------------
function ManagerStageBlock({ stage, index, defaultOpen, onOpenItem, onAdd }) {

  const locked = stage.status === "locked";
  const completed = stage.status === "completed";
  return (
    <div className="sk-col sk-gap-2">
      <div className="sk-stage-header sk-clickable" onClick={() => !locked && setOpen(o => !o)}
        style={{ borderRadius: "var(--sk-radius-3)", padding: "10px 12px", background: "var(--sk-accent-secondary)" }}>
        <div className="sk-row sk-gap-3">
          <span style={{
            width: 24, height: 24, borderRadius: "50%", flexShrink: 0, display: "flex", alignItems: "center", justifyContent: "center",
            background: completed ? "var(--sk-accent)" : locked ? "var(--sk-surface-dark)" : "var(--sk-surface-page)",
            color: completed ? "var(--sk-text-contrast)" : locked ? "var(--sk-text-contrast)" : "var(--sk-text-accent)",
            border: !completed && !locked ? "1.5px solid var(--sk-stroke-accent)" : "none", font: "var(--sk-label-4)",
          }}>{completed ? <IconCheck size={13} /> : locked ? <IconLock size={12} /> : index}</span>
          <div className="sk-col" style={{ gap: 0 }}>
            <span className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>Этап {index}</span>
            <span className="sk-label-3">{stage.title}</span>
          </div>
        </div>
        <div className="sk-row sk-gap-2">
          <Tag size="s" hue="neutral">{stage.dueLabel}</Tag>
          {!locked && (open ? <IconChevronUp size={16} color="var(--sk-icon-secondary)" /> : <IconChevronDown size={16} color="var(--sk-icon-secondary)" />)}
        </div>
      </div>
      {open && !locked && (
        <div className="sk-col sk-gap-1" style={{ paddingLeft: 8 }}>
          {stage.items.filter(item => item.kind !== "checkpoint").map(item => (
            <div key={item.id} className="sk-check-row" onClick={() => onOpenItem(item)}>
              <div style={{ paddingTop: 2 }}><Checkbox checked={!!item.done} disabled /></div>
              <div className="sk-col" style={{ flex: 1, gap: item.done ? 0 : 2 }}>
                <div className="sk-label-3-regular" style={{ textDecoration: item.done ? "line-through" : "none", color: item.done ? "var(--sk-text-secondary)" : "var(--sk-text-primary)" }}>{item.title}</div>
                {!item.done && <div className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>{ELEMENT_LABEL[item.kind]}{item.date ? " · " + item.date : ""}</div>}
              </div>
            </div>
          ))}
          <button className="sk-link-btn sk-label-3-regular" onClick={onAdd} style={{ alignSelf: "flex-start", marginTop: 4 }}>+ Добавить</button>
        </div>
      )}
    </div>
  );
}

function ElementModal({ item, onClose }) {

    <Modal open title={item.title} onClose={onClose} size="s" secondary={<Button mode="secondary" onClick={onClose}>Закрыть</Button>}>
      <div className="sk-col sk-gap-3">

          <Tag size="s" hue="neutral">{ELEMENT_LABEL[item.kind]}</Tag>

        </div>

// ---------------- Контрольная точка (проведение руководителем) ----------------
const SCALE_FACES_STATIC = { 1: "😞", 2: "🙁", 3: "😐", 4: "🙂", 5: "😄" };
const RISK_LEVELS = [
  { value: "none", label: "Риск отсутствует" },
  { value: "low", label: "Низкий риск" },
  { value: "medium", label: "Средний риск" },
  { value: "high", label: "Высокий риск" },
];

// Тёплая плашка статуса КТ — аналог блока "Обратная связь по итогам" у сотрудника
// (CheckpointModal в employee/plan.html): вместо сухого чек-листа "кто что заполнил"
// показываем один итоговый статус с пояснением, что делать дальше.
function CheckpointStatusBanner({ done, surveyReady, reportReady }) {
  let title, note;
  if (done) { title = "Контрольная точка завершена"; note = "Итоги зафиксированы и доступны сотруднику."; }
  else if (!surveyReady) { title = "Ожидает сотрудника"; note = "Форма станет доступна для заполнения, как только сотрудник ответит на опрос."; }
  else if (!reportReady) { title = "Готово к завершению"; note = "Заполните обязательные поля выше, чтобы завершить контрольную точку."; }
  else { title = "Всё заполнено"; note = "Можно завершить контрольную точку."; }
  return (
    <div className="sk-row sk-gap-3" style={{ padding: 14, background: CP_YELLOW_BG, borderRadius: "var(--sk-radius-3)", alignItems: "center" }}>
      <span style={{ width: 32, height: 32, borderRadius: "50%", flexShrink: 0, display: "flex", alignItems: "center", justifyContent: "center", background: "var(--sk-surface-page)" }}>
        <IconClock size={16} color="var(--sk-icon-secondary)" />
      </span>
      <div className="sk-col" style={{ gap: 0 }}>
        <div className="sk-label-3">{title}</div>
        <div className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>{note}</div>
      </div>
    </div>
  );
}

function ManagerCheckpointDrawer({ checkpoint, viewerName, employee, canEdit, onFinish, onAddComment, onClose }) {
  const [employeeSummary, setEmployeeSummary] = React.useState(checkpoint.employeeSummary || "");
  const [internalReport, setInternalReport] = React.useState(checkpoint.internalReport || "");
  const [riskLevel, setRiskLevel] = React.useState(checkpoint.riskLevel || "");
  const [comment, setComment] = React.useState("");
  const done = checkpoint.status === "done";
  const surveyReady = checkpoint.surveySubmitted || done;
  const reportReady = !!(employeeSummary.trim() && internalReport.trim() && riskLevel);
  const canFinish = canEdit && !done && surveyReady && reportReady;
  const fieldsDisabled = !surveyReady || !canEdit;

  return (
    <Drawer open title={done ? "Промежуточные итоги сотрудника" : (employee ? "Как проходит адаптация — " + employee.name.split(" ")[0] : checkpoint.title)}
      onClose={onClose} size="m"
      primary={!done && canEdit ? <Button disabled={!canFinish} onClick={() => onFinish({ employeeSummary: employeeSummary.trim(), internalReport: internalReport.trim(), riskLevel })} style={{ width: "100%" }}>Завершить контрольную точку</Button> : null}
      secondary={<Button mode="secondary" onClick={onClose}>Закрыть</Button>}>
      <div className="sk-col sk-gap-5">
        <div className="sk-row" style={{ justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 12 }}>
          {employee ? (
            <div className="sk-row sk-gap-2">
              <Avatar src={personPhoto(employee.name)} name={employee.name} size={40} />
              <div className="sk-col" style={{ gap: 0 }}>
                <div className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>Сотрудник</div>
                <div className="sk-label-3">{employee.name}</div>
              </div>
            </div>
          ) : (
            <Tag size="s" hue="neutral">{checkpoint.title}</Tag>
          )}
          {!done && (checkpoint.daysLeftLabel || checkpoint.dueLabel) ? (
            <div className="sk-col" style={{ gap: 0, alignItems: "flex-end" }}>
              {checkpoint.daysLeftLabel && <div className="sk-label-3">{checkpoint.daysLeftLabel}</div>}
              {checkpoint.dueLabel && <div className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>{checkpoint.dueLabel}</div>}
            </div>
          ) : (
            <StatusTag status={done ? "cp_done" : "cp_pending"} />
          )}
        </div>

        {done && <div className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>Срок: {checkpoint.dateLabel || checkpoint.date}</div>}

        <div className="sk-col sk-gap-3" style={{ padding: 16, background: "var(--sk-surface-secondary)", borderRadius: "var(--sk-radius-3)" }}>
          <div className="sk-label-3">Повестка</div>
          <div className="sk-col sk-gap-2">
            {checkpoint.agenda.map((a, i) => (
              <div key={i} className="sk-row sk-gap-2" style={{ alignItems: "flex-start" }}>
                <span style={{
                  width: 22, height: 22, borderRadius: "50%", flexShrink: 0, display: "flex", alignItems: "center", justifyContent: "center",
                  background: "var(--sk-surface-dark)", color: "var(--sk-text-contrast)", font: "var(--sk-label-4)",
                }}>{i + 1}</span>
                <div className="sk-label-3-regular">{a}</div>
              </div>
            ))}
          </div>
        </div>

        {!surveyReady ? (
          <Alert hue="warning">Сотрудник ещё не заполнил опрос — итог можно зафиксировать после того, как он ответит.</Alert>
        ) : (
          <div className="sk-col sk-gap-4">
            <div className="sk-row sk-gap-2" style={{ alignItems: "center" }}>
              <span className="sk-label-3">Ответы сотрудника</span>
              <Tag size="s" hue="positive">Заполнено</Tag>
            </div>
            {checkpoint.survey.map((q, i) => (
              <div key={i} className="sk-col sk-gap-2">
                <div className="sk-label-3-regular">{q.q}</div>
                {q.type === "scale" ? (
                  <div className="sk-col sk-gap-1">
                    <div className="sk-row sk-gap-2">
                      {[1, 2, 3, 4, 5].map((n) => {
                        const active = q.answer === n;
                        return (
                          <span key={n} style={{
                            width: 34, height: 34, borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center",
                            background: SCALE_TINTS[n],
                            border: (active ? "2.5px" : "1.5px") + " solid " + SCALE_BORDERS[n],
                            boxShadow: active ? "0 0 0 3px " + SCALE_TINTS[n] : "none",
                            opacity: q.answer !== null && !active ? 0.35 : 1,
                          }}><ScaleFace n={n} size={16} color={SCALE_BORDERS[n]} /></span>
                        );
                      })}
                    </div>
                    {(q.minLabel || q.maxLabel) && (
                      <div className="sk-row" style={{ justifyContent: "space-between" }}>
                        <span className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>{q.minLabel}</span>
                        <span className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>{q.maxLabel}</span>
                      </div>
                    )}
                  </div>
                ) : (
                  <div className="sk-label-3-regular" style={{ color: "var(--sk-text-secondary)", background: "var(--sk-surface-secondary)", borderRadius: "var(--sk-radius-2)", padding: "10px 12px" }}>{q.answer}</div>
                )}
              </div>
            ))}
          </div>
        )}

        <Divider />

        <div className="sk-col sk-gap-2">
          <div className="sk-row sk-gap-1"><span className="sk-label-3">Итоги встречи для сотрудника</span><span style={{ color: "var(--sk-text-negative)" }}>*</span></div>
          <div className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>Будут доступны сотруднику</div>
          {done ? <div className="sk-label-3-regular">{checkpoint.employeeSummary}</div> : (
            <Textarea placeholder="Опишите итоги встречи, договорённости и следующие шаги" rows={2}
              value={employeeSummary} onChange={(e) => setEmployeeSummary(e.target.value || "")} disabled={fieldsDisabled} />
          )}
        </div>

        <div className="sk-col sk-gap-2">
          <div className="sk-row sk-gap-1"><span className="sk-label-3">Внутренний отчёт</span><span style={{ color: "var(--sk-text-negative)" }}>*</span></div>
          <div className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>Доступен только руководителю и HR</div>
          {done ? <div className="sk-label-3-regular">{checkpoint.internalReport}</div> : (
            <Textarea placeholder="Зафиксируйте внутреннюю оценку, проблемы и рекомендации" rows={2}
              value={internalReport} onChange={(e) => setInternalReport(e.target.value || "")} disabled={fieldsDisabled} />
          )}
        </div>

        <div className="sk-col sk-gap-2">
          <div className="sk-row sk-gap-1"><span className="sk-label-3">Уровень риска</span><span style={{ color: "var(--sk-text-negative)" }}>*</span></div>
          {done ? (
            <Tag size="s" hue={riskLevel === "high" ? "negative" : riskLevel === "medium" ? "warning" : riskLevel === "low" ? "warning" : "positive"} style={{ alignSelf: "flex-start" }}>
              {(RISK_LEVELS.find((r) => r.value === riskLevel) || {}).label || "—"}
            </Tag>
          ) : (
            <div className="sk-row sk-gap-2" style={{ flexWrap: "wrap" }}>
              {RISK_LEVELS.map((r) => {
                const active = riskLevel === r.value;
                return (
                  <button key={r.value} type="button" disabled={fieldsDisabled} onClick={() => setRiskLevel(r.value)}
                    className={fieldsDisabled ? "" : "sk-clickable"} style={{
                      padding: "7px 14px", borderRadius: "var(--sk-radius-full)", border: "1.5px solid " + (active ? "var(--sk-stroke-accent)" : "var(--sk-stroke)"),
                      background: active ? "var(--sk-accent-secondary)" : "var(--sk-surface-page)",
                      color: active ? "var(--sk-text-accent)" : "var(--sk-text-secondary)",
                      font: active ? "var(--sk-label-3)" : "var(--sk-label-3-regular)",
                      cursor: fieldsDisabled ? "default" : "pointer", opacity: fieldsDisabled ? 0.5 : 1,
                    }}>{r.label.replace(" риск", "").replace("Риск ", "")}</button>
                );
              })}
            </div>
          )}
        </div>

        <CheckpointStatusBanner done={done} surveyReady={surveyReady} reportReady={reportReady} />

        <Divider />
        <div className="sk-col sk-gap-3">
          <div className="sk-label-3">Комментарии {(checkpoint.comments || []).length}</div>
          <div className="sk-row sk-gap-2">
            <Input placeholder="Введите свой комментарий" value={comment} onChange={(e) => setComment(e.target.value || "")} style={{ flex: 1 }} />
            {comment.trim() && <Button size="s" icon={<IconSend size={15} />} onClick={() => { onAddComment(comment.trim()); setComment(""); }} />}
          </div>
          {(checkpoint.comments || []).slice().reverse().map((c, i) => (
            <div key={i} className="sk-row sk-gap-3" style={{ alignItems: "flex-start" }}>
              <Avatar src={personPhoto(c.author)} name={c.author} size={26} />
              <div className="sk-col sk-gap-1" style={{ flex: 1 }}>
                <div className="sk-row sk-gap-2"><span className="sk-label-4">{c.author}</span><span className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>{c.date}</span></div>
                <div className="sk-label-3-regular">{c.text}</div>
              </div>
            </div>
          ))}
        </div>
      </div>
    </Drawer>
  );
}

// ---------------- Общие мелкие блоки (аналогично роли "Сотрудник") ----------------

            <div className="sk-title-5">{member.name}</div>
            <Tag size="s" hue="neutral">{member.position}</Tag>
            <div className="sk-muted" style={{ font: "var(--sk-label-4-regular)", marginTop: 4 }}>{member.department}</div>
          </div>
        </Card>
        <div style={{ position: "absolute", top: -20, left: 16 }}>

                return (
                  <div key={cp.id} className="sk-clickable" onClick={() => onOpenCheckpoint(cp.id)} style={{
                    display: "flex", alignItems: "center", gap: 10, padding: 10, borderRadius: "var(--sk-radius-3)",
                    border: !isDone ? "1.5px solid " + CP_YELLOW_BORDER : "1px solid var(--sk-stroke)",
                    background: !isDone ? CP_YELLOW_BG : "var(--sk-surface-page)",
                  }}>
                    <span style={{
                      width: 28, height: 28, borderRadius: "50%", flexShrink: 0, display: "flex", alignItems: "center", justifyContent: "center",
                      font: "var(--sk-label-3)",
                      background: isDone ? "var(--sk-surface-dark)" : CP_YELLOW,
                      color: "var(--sk-text-contrast)",
                    }}>{i + 1}</span>
                    <div className="sk-col" style={{ gap: 0, flex: 1, minWidth: 0 }}>
                      <div className="sk-label-4">{cp.dateLabel || cp.date}</div>
                      <div className="sk-muted" style={{ font: "var(--sk-label-4-regular)", whiteSpace: "nowrap" }}>{isDone ? cp.reviewer : (isMine ? "Ожидает вас" : "Проверяющий: " + cp.reviewer)}</div>
                    </div>
                    {isDone ? (
                      <Tag size="s" hue="neutral" icon={<IconCheck size={11} />}>Пройдена</Tag>
                    ) : (
                      <button type="button" onClick={(e) => { e.stopPropagation && e.stopPropagation(); onOpenCheckpoint(cp.id); }} style={{
                        height: 32, padding: "0 14px", borderRadius: "var(--sk-radius-full)", border: "none", cursor: "pointer",
                        background: CP_YELLOW, color: "var(--sk-text-contrast)", font: "var(--sk-label-3)", fontWeight: 600, flexShrink: 0,
                      }}>Пройти</button>
                    )}
                  </div>
                );
              })}
            </div>
          </CollapsibleSection>
        </Card>
      )}

      <Card bordered>
        <CollapsibleSection title="Статус адаптации">
          <div className="sk-col sk-gap-3">
            <StatusTag status={plan.status === "completed" ? "completed" : "in_progress_plan"} style={{ alignSelf: "flex-start" }} />
            <div className="sk-label-3-regular">{plan.dateStart} – {plan.dateEnd}</div>
            <div className="sk-col sk-gap-2">
              <div className="sk-row sk-gap-1 sk-label-4-regular sk-muted">Прогресс</div>
              <div className="sk-row sk-gap-3" style={{ alignItems: "center" }}><ProgressBar value={overallPct} style={{ flex: 1 }} hue="accent" /><span className="sk-title-5">{overallPct}%</span></div>
            </div>
          </div>
        </CollapsibleSection>
      </Card>

      <Card bordered>
        <CollapsibleSection title="Информация">
          <div className="sk-col sk-gap-2">
            <div className="sk-row sk-gap-2"><IconClock size={16} color="var(--sk-icon-secondary)" /><span className="sk-label-4-regular">{D.info.hours}</span></div>
            <div className="sk-row sk-gap-2" style={{ alignItems: "flex-start" }}><IconMapPin size={16} color="var(--sk-icon-secondary)" style={{ marginTop: 2 }} /><span className="sk-label-4-regular">{D.info.address}</span></div>
          </div>
        </CollapsibleSection>
      </Card>

      <Card bordered>
        <CollapsibleSection title="Участники плана">
          <div className="sk-col sk-gap-4">
            <PersonCard p={D.manager} />
            {D.assistants.length > 0 && (
              <div className="sk-col sk-gap-3">
                <div className="sk-label-4" style={{ color: "var(--sk-text-tertiary)", textTransform: "uppercase" }}>Помощники</div>
                {D.assistants.map((a, i) => <PersonCard key={i} p={a} />)}
              </div>
            )}
            <div className="sk-col sk-gap-3">
              <div className="sk-label-4" style={{ color: "var(--sk-text-tertiary)", textTransform: "uppercase" }}>HR BP</div>
              <PersonCard p={D.hrbp} />
            </div>
          </div>
        </CollapsibleSection>
      </Card>
    </div>
  );
}

function FaqPanel({ plan }) {
  if (!plan.faq.length) return <Card bordered><div className="sk-muted">Для этого плана вопросов пока нет.</div></Card>;
  return (
    <Card bordered>
      <div className="sk-col sk-gap-3">
        {plan.faq.map((f, i) => <FaqItem key={i} f={f} />)}
      </div>
    </Card>
  );
}
function FaqItem({ f }) {
  const [open, setOpen] = React.useState(false);
  return (
    <div className="sk-col sk-gap-1 sk-clickable" onClick={() => setOpen(o => !o)} style={{ padding: 8, borderRadius: "var(--sk-radius-2)" }}>
      <div className="sk-row" style={{ justifyContent: "space-between" }}>
        <div className="sk-label-3">{f.q}</div>
        {open ? <IconChevronUp size={16} color="var(--sk-icon-secondary)" /> : <IconChevronDown size={16} color="var(--sk-icon-secondary)" />}
      </div>
      {open && <div className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>{f.a}</div>}
    </div>
  );
}
function ChatPanel({ member }) {
  return (
    <Card bordered>
      <div className="sk-col sk-gap-3">
        <div className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>Общий чат участников плана. В этой версии прототипа сообщения не отправляются.</div>
        <div className="sk-col sk-gap-2" style={{ padding: 10, background: "var(--sk-surface-secondary)", borderRadius: "var(--sk-radius-3)" }}>
          <div className="sk-row sk-gap-2"><Avatar src={personPhoto(member.name)} name={member.name} size={24} /><div className="sk-label-4-regular">{member.name.split(" ")[0]}: Подскажите, пожалуйста, когда появятся цели по плану?</div></div>
        </div>
        <div className="sk-row sk-gap-2">
          <Textarea placeholder="Написать сообщение…" style={{ flex: 1 }} rows={2} />
          <Button size="s" icon={<IconSend size={16} />} />
        </div>
      </div>
    </Card>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Page />);
</script>
</body>
</html>
