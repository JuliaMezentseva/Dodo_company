  );
}

// ---------------- Выбор способа проверки шага — обязательное решение при создании:
// либо привязать готовый оценочный лист (критерии, по которым будет приниматься
// решение), либо оставить без него — тогда проверяющий просто выставит итог
// (Шаг выполнен / Не выполнен / Требует доработки) без промежуточных критериев. ----------------
function StepAssessmentPicker({ templateId, setTemplateId }) {
  const templates = D.assessmentTemplates || [];
  const checked = !!templateId;

  function toggle() {
    setTemplateId(checked ? null : (templates[0] && templates[0].id));
  }

  return (
    <div className="sk-col sk-gap-1">
      <div className="sk-row sk-gap-3 sk-clickable" style={{ alignItems: "flex-start" }} onClick={toggle}>
        <div style={{ paddingTop: 1 }}><Checkbox checked={checked} onChange={toggle} /></div>
        <span className="sk-label-4">Добавить оценочный лист</span>
      </div>
      <span className="sk-muted" style={{ font: "var(--sk-label-4-regular)", marginLeft: 32 }}>Готовые критерии помогут оценить выполнение шага</span>
      <div style={{ marginLeft: 32, marginTop: 8 }}>
        {checked ? (
          <React.Fragment>
            <Select value={templateId} options={templates.map(t => ({ value: t.id, label: t.title }))} onChange={setTemplateId} />
            <div style={{ height: 220 }} />
          </React.Fragment>
        ) : (
          <div style={{ padding: "12px 14px", background: "var(--sk-surface-secondary)", borderRadius: "var(--sk-radius-2)" }}>
            <span className="sk-label-3-regular">
              Без оценочного листа итог выставляется на усмотрение проверяющего: «Шаг выполнен», «Не выполнен» или «Требует доработки».
            </span>
          </div>
        )}
      </div>
    </div>
  );
}

function SubgoalCreateModal({ plan, initial, onClose, onCreate }) {
  const [title, setTitle] = React.useState(initial ? initial.title : "");
  const [description, setDescription] = React.useState(initial ? initial.description : "");
  const [dueDate, setDueDate] = React.useState(initial ? initial.dueDate : new Date(2026, 0, 20));
  const [reviewer, setReviewer] = React.useState(initial ? initial.reviewer : D.manager.name);
  const [checklistRefs, setChecklistRefs] = React.useState(initial ? (initial.checklistRefs || []) : []);
  // Шаблон оценочного листа не хранится в шаге напрямую (см. handleCreate ниже) — при
  // редактировании ищем его обратно по названию, это лучшее, что можно сделать без id.
  const initialTemplateId = (initial && initial.assessmentChecklist)
    ? ((D.assessmentTemplates || []).find(t => t.title === initial.assessmentChecklist.title) || {}).id || null
    : null;
  const [templateId, setTemplateId] = React.useState(initialTemplateId);
  const canCreate = title.trim().length > 0;

  function toggleMaterial(itemId) {
    setChecklistRefs(prev => prev.includes(itemId) ? prev.filter(x => x !== itemId) : [...prev, itemId]);
  }

  function handleCreate() {
    const template = templateId ? (D.assessmentTemplates || []).find(t => t.id === templateId) : null;
    // Шаблон хранит только название критериев — ответы ("checked") и комментарий живут не
    // здесь, а в отдельных записях assessmentHistory, по одной на каждый раунд оценки.
    const assessmentChecklist = template ? {
      title: template.title, hint: template.hint,
      criteria: template.criteria.map(c => ({ id: c.id, label: c.label })),
    } : null;
    onCreate({ title, description, dueDate, reviewer, checklistRefs, assessmentChecklist });
  }

  return (
    <Modal open title="Шаг для выполнения цели" onClose={onClose} size="m" maxHeight="calc(100vh - 64px)"
      secondary={<Button mode="secondary" onClick={onClose}>Отменить</Button>}
      primary={<Button disabled={!canCreate} onClick={handleCreate}>{initial ? "Сохранить" : "Добавить"}</Button>}>
      <div className="sk-col sk-gap-4">
        <div className="sk-col sk-gap-2">
          <Input label="Название" required value={title} onChange={(e) => setTitle(e.target.value || "")} />
          <Textarea label="Описание" rows={2} maxLength={1000} value={description} onChange={(e) => setDescription(e.target.value || "")} />
        </div>
        <div className="sk-row sk-gap-3">
          <DatePicker label="Дата завершения" required value={dueDate} onChange={setDueDate} style={{ flex: 1 }} />
          <Select label="Проверяющий" value={reviewer} options={REVIEWER_OPTIONS} onChange={setReviewer} style={{ flex: 1 }} />
        </div>
        <StepMaterialsPicker plan={plan} selected={checklistRefs} onToggle={toggleMaterial} />
        <Divider />
        <div className="sk-col sk-gap-3">
          <span className="sk-label-3" style={{ color: "var(--sk-text-primary)" }}>Проверка выполнения шага</span>
          <StepAssessmentPicker templateId={templateId} setTemplateId={setTemplateId} />
        </div>
      </div>
    </Modal>
  );
}

// ---------------- Дровер подцели (редактирование / просмотр / подтверждение-возврат) ----------------
// ---------------- Оценочный лист: критерии практического навыка. Шаг может уходить на
// доработку и оцениваться заново несколько раз — поэтому у подцели есть неизменный шаблон
// критериев (assessmentChecklist) и история решений по нему (assessmentHistory), а не одно
// перезаписываемое состояние. Заполнение критериев и решение происходят в отдельной модалке
// (AssessmentModal), просмотр шаблона и истории — во вкладке "Оценочный лист" дровера. ----------------
function AssessmentChecklistCard({ checklist, onChange, readOnly }) {
  const criteria = checklist.criteria || [];

  function setCriterion(id, value) {
    onChange({ ...checklist, criteria: criteria.map(c => c.id === id ? { ...c, checked: value } : c) });
  }

  return (
    <div className="sk-col sk-gap-1">
      {criteria.map(c => readOnly ? (
        // Просмотр раунда — иконка вместо цветной "таблетки" на каждый критерий, иначе
        // в карточке несколько разноцветных тегов спорят за внимание со статусом решения сверху.
        <div key={c.id} className="sk-row sk-gap-2" style={{ alignItems: "center", padding: "3px 0" }}>
          <span style={{ width: 16, flexShrink: 0, display: "flex", justifyContent: "center" }}>
            {c.checked === null || c.checked === undefined
              ? <span className="sk-muted">—</span>
              : c.checked ? <IconCheck size={14} color="var(--sk-icon-positive)" /> : <IconX size={14} color="var(--sk-icon-negative)" />}
          </span>
          <span className="sk-label-4-regular">{c.label}</span>
        </div>
      ) : (
        <div key={c.id} className="sk-row sk-gap-3" style={{
          alignItems: "center", justifyContent: "space-between", padding: 10,
          border: "1px solid var(--sk-stroke)", borderRadius: "var(--sk-radius-3)", background: "var(--sk-surface-page)",
        }}>
          <span className="sk-label-4" style={{ flex: 1 }}>{c.label}</span>
          <div className="sk-row sk-gap-2">
            <Button size="s" mode={c.checked === true ? "primary" : "secondary"} variant={c.checked === true ? "positive" : "neutral"}
              onClick={() => setCriterion(c.id, true)}>Да</Button>
            <Button size="s" mode={c.checked === false ? "primary" : "secondary"} variant={c.checked === false ? "negative" : "neutral"}
              onClick={() => setCriterion(c.id, false)}>Нет</Button>
          </div>
        </div>
      ))}
      {readOnly && checklist.note && (
        <div className="sk-col sk-gap-1" style={{ padding: 10, background: "var(--sk-surface-secondary)", borderRadius: "var(--sk-radius-3)" }}>
          <span className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>Комментарий</span>
          <span className="sk-label-4-regular">{checklist.note}</span>
        </div>
      )}
    </div>
  );
}

// Короткая общая подсказка про оценочный лист — без имён и без "вы/сотрудник" —
// её читают и сотрудник, и руководитель с одного и того же места (вкладка в дровере шага).
const ASSESSMENT_HINT_FALLBACK = "Критерии, по которым оценивают выполнение этого шага. Их отмечает проверяющий после того, как шаг отправлен на подтверждение.";
function AssessmentHintTooltip({ hint }) {
  return (
    <Tooltip placement="bottom" content={
      <div style={{ whiteSpace: "normal", maxWidth: 220 }}>{hint || ASSESSMENT_HINT_FALLBACK}</div>
    }>
      <span style={{ display: "inline-flex" }} onClick={(e) => e.stopPropagation()}>
        <IconHelpCircle size={14} color="var(--sk-icon-secondary)" />
      </span>
    </Tooltip>
  );
}

// ---------------- Вкладки внутри дровера подцели (Комментарии / Оценочный лист) — тот же
// визуальный паттерн подчёркнутого заголовка, что раньше был "зашит" прямо в CommentsPanel. ----------------
function DrawerTabs({ items, active, onChange }) {
  return (
    <div className="sk-row sk-gap-4" style={{ borderBottom: "1px solid var(--sk-stroke)", marginTop: 8 }}>
      {items.map(it => (
        <div key={it.id} className="sk-clickable" onClick={() => onChange(it.id)}
          style={{ paddingBottom: 10, borderBottom: "2px solid " + (active === it.id ? "var(--sk-text-primary)" : "transparent") }}>
          {it.label}
        </div>
      ))}
    </div>
  );
}

const ASSESSMENT_DECISION_LABEL = { done: "Шаг выполнен", returned: "На доработке", not_done: "Шаг не выполнен" };
const ASSESSMENT_DECISION_HUE = { done: "positive", returned: "warning", not_done: "negative" };

// ---------------- Содержимое вкладки "История оценок" — только прошлые раунды решений,
// от новых к старым. Сам оценочный лист (шаблон критериев) — отдельным блоком в теле
// дровера, а не здесь, чтобы вкладка не смешивала "что будут оценивать" и "что решили". ----------------
function AssessmentTabContent({ history }) {
  const rounds = (history || []).slice().reverse();
  return (
    <div className="sk-col sk-gap-4">
      {rounds.length > 0 ? (
        <div className="sk-col sk-gap-3">
          {rounds.map((h, i) => (
            <div key={i} className="sk-col sk-gap-2" style={{ padding: 12, border: "1px solid var(--sk-stroke)", borderRadius: "var(--sk-radius-3)" }}>
              <div className="sk-row sk-gap-2" style={{ justifyContent: "space-between", alignItems: "center" }}>
                <Tag size="s" hue={ASSESSMENT_DECISION_HUE[h.decision]}>{ASSESSMENT_DECISION_LABEL[h.decision]}</Tag>
                <span className="sk-row sk-gap-2" style={{ alignItems: "center" }}>
                  {h.reviewer && <span className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>{h.reviewer}</span>}
                  <span className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>{h.date}</span>
                </span>
              </div>
              <AssessmentChecklistCard checklist={h} readOnly />
            </div>
          ))}
        </div>
      ) : (
        <div className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>Пока нет оценок — они появятся здесь после проверки шага.</div>
      )}
    </div>
  );
}

// ---------------- Модалка оценочного листа — отдельное окно поверх дровера подцели.
// Заполнение критериев и итоговое решение (3 кнопки) — в одном месте, чтобы не дублировать
// решение в двух местах. Критерии и комментарий здесь — черновик текущего раунда оценки:
// живут только в модалке (не пишутся в подцель), пока не принято решение; решение сразу
// уходит записью в историю (см. onDecision), а не перезаписывает общее состояние подцели.
// "Шаг выполнен" и "Не выполнен" — финальные, необратимые решения, поэтому перед
// применением показываем защиту от дурака (см. FinalDecisionConfirm). "Вернуть на
// доработку" не финально — статус можно будет пересмотреть позже, подтверждение не нужно. ----------------
function AssessmentModal({ subgoal, onClose, onDecision }) {
  const template = subgoal.assessmentChecklist;
  const [criteria, setCriteria] = React.useState(() => (template.criteria || []).map(c => ({ id: c.id, label: c.label, checked: null })));
  const [note, setNote] = React.useState("");
  const answeredCount = criteria.filter(c => c.checked !== null).length;
  const [pendingAction, setPendingAction] = React.useState(null); // "done" | "not_done"

  function submit(decision) {
    onDecision(decision, { criteria, note });
  }

  if (pendingAction) {
    return (
      <FinalDecisionConfirm action={pendingAction} onBack={() => setPendingAction(null)}
        onConfirm={() => { const a = pendingAction; setPendingAction(null); submit(a); }} />
    );
  }

  return (
    <Modal open title={template.title || "Оценочный лист"} onClose={onClose} size="m">
      <div className="sk-col sk-gap-4">
        <AssessmentChecklistCard checklist={{ criteria }} readOnly={false} onChange={(next) => setCriteria(next.criteria)} />
        {answeredCount < criteria.length && (
          <div className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>
            Отмечено {answeredCount} из {criteria.length} — критерии необязательны, но помогают принять решение осознаннее.
          </div>
        )}
        <Textarea label="Комментарий" placeholder="Необязательно: поясните решение или дайте обратную связь сотруднику"
          rows={3} maxLength={1000} showCount value={note} onChange={(e) => setNote(e.target.value || "")} />
        <Divider />
        <div className="sk-row sk-gap-2" style={{ flexWrap: "wrap" }}>
          <Button variant="positive" onClick={() => setPendingAction("done")}>Подтвердить выполнение шага</Button>
          <Button mode="secondary" variant="gray" onClick={() => submit("returned")}>На доработку</Button>
          <Button variant="negative" mode="secondary" onClick={() => setPendingAction("not_done")}>Шаг не выполнен</Button>
        </div>
      </div>
    </Modal>
  );
}

// ---------------- Защита от дурака перед финальным (необратимым) решением по шагу —
// общий шаг подтверждения и для оценочного листа, и для ручного решения без него. ----------------
const FINAL_DECISION_COPY = {
  done: { title: "Отметить шаг выполненным?", body: "Шаг будет считаться выполненным. Изменить решение потом будет нельзя.", label: "Да", variant: "positive" },
  not_done: { title: "Отметить шаг невыполненным?", body: "Шаг будет считаться невыполненным. Изменить решение потом будет нельзя.", label: "Да", variant: "negative" },
};
function FinalDecisionConfirm({ action, onBack, onConfirm }) {
  const c = FINAL_DECISION_COPY[action];
  return (
    <Modal open title={null} onClose={onBack} size="s"
      secondary={<Button mode="secondary" onClick={onBack}>Отменить</Button>}
      primary={<Button variant={c.variant} onClick={onConfirm}>{c.label}</Button>}>
      <div className="sk-col sk-gap-2" style={{ alignItems: "center", textAlign: "center", padding: "8px 0" }}>
        <div className="sk-label-2">{c.title}</div>
        <div className="sk-muted">{c.body}</div>
      </div>
    </Modal>
  );
}

// ---------------- Комментарии подцели — карточка ввода с рамкой и скрепкой для вложений,
// список сообщений ниже. Простая Textarea вместо полноценного rich-text редактора — в
// прототипе это визуальный паттерн, не текстовый движок. Заголовок вкладки рисует DrawerTabs,
// здесь — только содержимое вкладки. ----------------
function CommentsPanel({ comments, comment, setComment, onAdd, disabled }) {
  const list = comments || [];
  return (
    <div className="sk-col sk-gap-3">
      {!disabled && (
        <div className="sk-col sk-gap-2">
          <Textarea placeholder="Написать комментарий" rows={2} value={comment} onChange={(e) => setComment(e.target.value || "")} />
          <div className="sk-row" style={{ justifyContent: "space-between", alignItems: "center" }}>
            <button className="sk-link-btn" style={{ display: "inline-flex" }}><Icons.IconPaperclip size={17} color="var(--sk-icon-secondary)" /></button>
            {comment.trim() && (
              <Button size="s" onClick={() => { onAdd(comment.trim()); setComment(""); }}>Отправить</Button>
            )}
          </div>
        </div>
      )}

      {list.slice().reverse().map((c, i) => (
        <div key={i} className="sk-row sk-gap-3" style={{ alignItems: "flex-start" }}>
          <Avatar src={personPhoto(c.author)} name={c.author} size={28} />
          <div className="sk-col sk-gap-1" style={{ flex: 1 }}>
            <div className="sk-row sk-gap-2"><span className="sk-label-4">{c.author}</span><span className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>{c.date}</span></div>
            <div className="sk-label-3-regular">{c.text}</div>
            {c.attachment && (
              <div className="sk-row sk-gap-2" style={{
                alignItems: "center", marginTop: 2, padding: "8px 10px", maxWidth: 280,
                border: "1px solid var(--sk-stroke)", borderRadius: "var(--sk-radius-2)", background: "var(--sk-surface-page)",
              }}>
                <div style={{
                  width: 28, height: 28, borderRadius: "var(--sk-radius-2)", flexShrink: 0,
                  background: "var(--sk-negative-secondary)", display: "flex", alignItems: "center", justifyContent: "center",
                }}><IconFileText size={15} color="var(--sk-text-negative)" /></div>
                <div className="sk-col" style={{ gap: 0, minWidth: 0 }}>
                  <div className="sk-label-4" style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{c.attachment.name}</div>
                  <div className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>{c.attachment.size}</div>
                </div>
              </div>
            )}
          </div>
        </div>
      ))}
      {!list.length && <div className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>Комментариев пока нет</div>}
    </div>
  );
}

function SubgoalDrawer({ plan, goal, subgoal, onClose, onChange, onOpenChecklistPicker, onUnlinkChecklist, onAddComment, onConfirm, onReturn, onNotDone, onAssessmentDecision }) {
  const [comment, setComment] = React.useState("");
  const [drawerTab, setDrawerTab] = React.useState("comments");
  const editable = !plan.employeeStarted;
  // "Подтвердить/вернуть" — действие проверяющего (по умолчанию руководитель, если явно не
  // назначен другой — например, помощник). "Отметить не выполненной" остаётся у руководителя
  // в любом случае, это его отдельное право по ТЗ, не завязанное на роль проверяющего.
  const isDefaultReviewer = !subgoal.reviewer || subgoal.reviewer === D.manager.name;
  const isReview = plan.employeeStarted && subgoal.status === "pending_review" && isDefaultReviewer;
  const canMarkNotDone = plan.employeeStarted && subgoal.status === "pending_review";
  const links = (subgoal.checklistRefs || []).map(id => findChecklistItem(plan, id)).filter(Boolean);
  // Оценочный лист — если он есть у подцели, решение (подтвердить/вернуть/не выполнена)
  // принимается только через него: сначала заполняем критерии, затем сразу решение —
  // и то, и другое в одной модалке (AssessmentModal), не в самом дровере. Сам лист (шаблон
  // критериев + история прошлых раундов оценки) смотрят во вкладке "Оценочный лист".
  const needsAssessment = !!subgoal.assessmentChecklist;
  const [assessmentOpen, setAssessmentOpen] = React.useState(false);
  const [pendingAction, setPendingAction] = React.useState(null); // "done" | "not_done" — защита от дурака без оценочного листа
  const commentsCount = (subgoal.comments || []).length;
  const drawerTabItems = [
    {
      id: "comments",
      label: <span className="sk-label-3">Комментарии <span className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>{commentsCount}</span></span>,
    },
    ...(needsAssessment ? [{
      id: "assessment",
      label: (
        <span className="sk-row sk-gap-1" style={{ alignItems: "center" }}>
          <span className="sk-label-3">История оценок</span>
          {isReview && <span style={{ width: 6, height: 6, borderRadius: "50%", background: "var(--sk-warning)" }} />}
        </span>
      ),
    }] : []),
  ];
  // Быстрое действие проверяющего — маленькие кнопки в шапке дровера, а не крупные в теле.
  // Подписаны словами (не только иконкой) — статусные названия решения понятны без наведения.
  // Тон везде приглушённый (mode="secondary"), как у статусов — без сплошной заливки.
  const headerAction = editable ? null
    : (needsAssessment && isReview) ? <Button size="s" onClick={() => setAssessmentOpen(true)} style={{ background: "var(--sk-warning)", color: "var(--sk-text-contrast)" }}>Оценить выполнение</Button>
    : (isReview && !needsAssessment) ? (
      <div className="sk-row sk-gap-1">
        <Button size="xs" variant="positive" onClick={() => setPendingAction("done")}>Выполнен</Button>
        <Button size="xs" variant="gray" onClick={onReturn}>На доработку</Button>
        <Button size="xs" variant="negative" onClick={() => setPendingAction("not_done")}>Не выполнен</Button>
      </div>
    )
    : (!isReview && canMarkNotDone) ? <Button size="s" variant="negative" onClick={() => setPendingAction("not_done")}>Не выполнен</Button>
    : null;

  return (
    <React.Fragment>
    <Drawer open title={null} onClose={onClose} size="s" headerActions={headerAction}>
      <div className="sk-col sk-gap-4">
        {editable ? (
          <React.Fragment>
            <Input label="Название" required value={subgoal.title} onChange={(e) => onChange({ title: e.target.value || "" })} />
            <Textarea label="Описание" rows={3} maxLength={1000} showCount value={subgoal.description} onChange={(e) => onChange({ description: e.target.value || "" })} />
            <div className="sk-row sk-gap-3">
              <Input label="Дата завершения" value={subgoal.dueLabel} onChange={(e) => onChange({ dueLabel: e.target.value || "" })} style={{ flex: 1 }} />
              <Select label="Проверяющий" value={subgoal.reviewer} options={REVIEWER_OPTIONS} onChange={(v) => onChange({ reviewer: v })} style={{ flex: 1 }} />
            </div>
          </React.Fragment>
        ) : (
          <React.Fragment>
            <div className="sk-label-2" style={{ color: "var(--sk-text-primary)" }}>{subgoal.title}</div>
            {subgoal.description && <div className="sk-label-3-regular">{subgoal.description}</div>}

            {!isReview && canMarkNotDone && (
              <Alert hue="neutral">Ожидает подтверждения от {subgoal.reviewer}.</Alert>
            )}

            <CollapsibleSection title="Параметры">
              <div className="sk-col">
                <ParamRow label="Статус"><StatusTag status={subgoal.status} /></ParamRow>
                <ParamRow label="Дата завершения"><span className="sk-label-4">{subgoal.dueLabel}</span></ParamRow>
                <ParamRow label="Проверяющий">
                  <div className="sk-row sk-gap-2"><Avatar src={personPhoto(subgoal.reviewer)} name={subgoal.reviewer} size={22} /><span className="sk-label-4">{subgoal.reviewer}</span></div>
                </ParamRow>
              </div>
            </CollapsibleSection>

            {needsAssessment && (
              <CollapsibleSection
                title={<span className="sk-row sk-gap-1" style={{ alignItems: "center" }}>Оценочный лист<AssessmentHintTooltip hint={subgoal.assessmentChecklist.hint} /></span>}
                defaultOpen={false}>
                <div className="sk-col sk-gap-2">
                  <span className="sk-label-4" style={{ color: "var(--sk-text-secondary)" }}>{assessmentTemplateName(subgoal.assessmentChecklist.title)}</span>
                  <div className="sk-col sk-gap-1" style={{ padding: "10px 14px", borderLeft: "3px solid var(--sk-accent)" }}>
                    {/* Невыбранный disabled-чекбокс вместо точки-буллита читается понятнее ("это будут
                        отмечать"), а текст целиком серый — сразу видно, что это шаблон для справки,
                        а не то, что можно как-то отметить прямо здесь (см. AssessmentModal). */}
                    {(subgoal.assessmentChecklist.criteria || []).map(c => (
                      <div key={c.id} className="sk-row sk-gap-2" style={{ alignItems: "flex-start", padding: "4px 0" }}>
                        <Checkbox checked={false} disabled />
                        <span className="sk-label-4-regular" style={{ color: "var(--sk-text-secondary)" }}>{c.label}</span>
                      </div>
                    ))}
                  </div>
                </div>
              </CollapsibleSection>
            )}
          </React.Fragment>
        )}

        <CollapsibleSection title={<span>Полезные материалы{links.length ? <span style={{ color: "var(--sk-text-secondary)" }}>{" " + links.length}</span> : ""}</span>} defaultOpen={false}>
          <div className="sk-col sk-gap-2" style={{ padding: 12, background: "var(--sk-surface-secondary)", borderRadius: "var(--sk-radius-3)" }}>
            {!links.length && <div className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>Добавьте вспомогательные материалы для выполнения этого шага</div>}
            {links.map(({ item, stage }) => {
              const Icon = ELEMENT_ICON[item.kind] || IconFileText;
              return (
                <div key={item.id} className="sk-row sk-gap-3" style={{ alignItems: "flex-start", padding: 10, background: "var(--sk-surface-page)", border: "1px solid var(--sk-stroke)", borderRadius: "var(--sk-radius-2)" }}>
                  <div style={{ paddingTop: 2 }}><Checkbox checked={!!item.done} disabled /></div>
                  <div className="sk-col sk-gap-1" style={{ flex: 1, minWidth: 0 }}>
                    <div className="sk-label-4" style={{ color: item.done ? "var(--sk-text-secondary)" : "var(--sk-text-primary)" }}>{item.title}</div>
                    <div className="sk-row sk-gap-1" style={{ alignItems: "center" }}>
                      <Icon size={13} color="var(--sk-icon-secondary)" style={{ flexShrink: 0 }} />
                      <span className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>{ELEMENT_LABEL[item.kind]}</span>
                    </div>
                  </div>
                  {editable && <button className="sk-link-btn" onClick={() => onUnlinkChecklist(item.id)}><IconX size={15} color="var(--sk-icon-secondary)" /></button>}
                </div>
              );
            })}
            {editable && (
              <button className="sk-link-btn sk-label-3-regular" onClick={onOpenChecklistPicker}
                style={{ alignSelf: "flex-start", color: "var(--sk-text-accent)" }}>
                <span className="sk-row sk-gap-1"><IconPlusSm size={16} />Добавить</span>
              </button>
            )}
          </div>
        </CollapsibleSection>

        <DrawerTabs items={drawerTabItems} active={drawerTab} onChange={setDrawerTab} />
        {drawerTab === "comments" && (
          <CommentsPanel comments={subgoal.comments} comment={comment} setComment={setComment} onAdd={onAddComment} disabled={false} />
        )}
        {drawerTab === "assessment" && needsAssessment && (
          <AssessmentTabContent history={subgoal.assessmentHistory} />
        )}
      </div>
    </Drawer>
    {assessmentOpen && (
      <AssessmentModal subgoal={subgoal} onClose={() => setAssessmentOpen(false)}
        onDecision={(decision, payload) => { setAssessmentOpen(false); onAssessmentDecision(decision, payload); }} />
    )}
    {pendingAction && (
      <FinalDecisionConfirm action={pendingAction} onBack={() => setPendingAction(null)}
        onConfirm={() => { const a = pendingAction; setPendingAction(null); a === "done" ? onConfirm() : onNotDone(); }} />
    )}
    </React.Fragment>
  );
}

// ---------------- Модалка: комментарий для возврата в работу ----------------
function ReturnCommentModal({ onClose, onSubmit }) {
  const [comment, setComment] = React.useState("");
  const canSubmit = comment.trim().length > 0;
  return (
    <Modal open title="Вернуть подцель в работу" onClose={onClose} size="s"
      secondary={<Button mode="secondary" onClick={onClose}>Отменить</Button>}
      primary={<Button disabled={!canSubmit} onClick={() => onSubmit(comment.trim())}>Вернуть в работу</Button>}>
      <Textarea label="Комментарий" required helper="Обязателен — объясните сотруднику, что нужно доработать"
        rows={3} value={comment} onChange={(e) => setComment(e.target.value || "")} />
    </Modal>
  );
}

// ---------------- Модалка: привязка чек-листа ----------------
function ChecklistPickerModal({ plan, selected, onToggle, onClose }) {
  const [q, setQ] = React.useState("");
  const allItems = plan.stages.flatMap(s => s.items.filter(i => i.kind !== "checkpoint").map(i => ({ item: i, stage: s })));
  const list = q.trim() ? allItems.filter(x => x.item.title.toLowerCase().includes(q.trim().toLowerCase())) : allItems;
  return (
    <Modal open title="Полезные материалы" onClose={onClose} size="m"
      secondary={<Button mode="secondary" onClick={onClose}>Отменить</Button>}
      primary={<Button onClick={onClose}>Готово</Button>}
      options={<Input icon={<IconSearch size={18} />} placeholder="Поиск по названию" value={q} onChange={(e) => setQ(e.target.value || "")} />}>
      <div className="sk-col sk-gap-1 sk-modal-scroll">
        {list.map(({ item, stage }) => (
          <div key={item.id} className="sk-row sk-gap-3 sk-clickable" style={{ padding: "10px 4px" }} onClick={() => onToggle(item.id)}>
            <Checkbox checked={selected.includes(item.id)} onChange={() => onToggle(item.id)} />
            <div className="sk-col sk-gap-1" style={{ flex: 1 }}>
              <div className="sk-label-3-regular">{item.title}</div>
              <div className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>{ELEMENT_LABEL[item.kind]} · Этап «{stage.title}»</div>
            </div>
          </div>
        ))}
        {!list.length && <div className="sk-muted" style={{ padding: "16px 0", textAlign: "center" }}>Ничего не нашлось</div>}
      </div>
    </Modal>
  );
}

// ---------------- Чек-лист (только просмотр для руководителя) ----------------
function ManagerStageBlock({ stage, index, onOpenItem, onAdd }) {
  const locked = stage.status === "locked";
  const completed = stage.status === "completed";
  const current = !locked && !completed;
  const [open, setOpen] = React.useState(current);
  return (
    <div className="sk-col sk-gap-2" style={{
      borderRadius: "var(--sk-radius-3)", overflow: "hidden",
      border: current ? "1.5px solid var(--sk-stroke-accent)" : "1px solid var(--sk-stroke)",
      opacity: locked ? 0.65 : 1,
    }}>
      <div className={locked ? "sk-row" : "sk-row sk-clickable"} onClick={() => !locked && setOpen(o => !o)}
        style={{
          justifyContent: "space-between", padding: "10px 12px",
          background: current ? "var(--sk-accent-secondary)" : "var(--sk-surface-secondary)",
        }}>
        <div className="sk-row sk-gap-3">
          <span style={{
            width: 22, height: 22, borderRadius: "50%", flexShrink: 0, display: "flex", alignItems: "center", justifyContent: "center",
            background: current ? "var(--sk-accent)" : "transparent", color: current ? "var(--sk-text-contrast)" : "var(--sk-text-tertiary)",
            border: current ? "none" : "1.5px solid var(--sk-stroke)", font: "var(--sk-label-4)",
          }}>{locked ? <IconLock size={11} /> : index}</span>
          <span className="sk-label-3" style={{ color: "var(--sk-text-primary)" }}>{stage.title}</span>
        </div>
        <div className="sk-row sk-gap-2" style={{ alignItems: "center" }}>
          {current && stage.dueLabel && <span className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>{stage.dueLabel}</span>}
          {locked && <span className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>{stage.dueLabel}</span>}
          {completed && <IconCheck size={16} color="var(--sk-positive)" />}
          {current && <IconClock size={16} color="var(--sk-accent)" />}
          {!locked && (open ? <IconChevronUp size={16} color="var(--sk-icon-secondary)" /> : <IconChevronDown size={16} color="var(--sk-icon-secondary)" />)}
        </div>
      </div>
      {open && !locked && (
        <div className="sk-col sk-gap-1" style={{ padding: "4px 8px 8px" }}>
          {stage.items.filter(item => item.kind !== "checkpoint").map(item => (
            <div key={item.id} className="sk-check-row" onClick={() => onOpenItem(item)}>
              <div style={{ paddingTop: 2 }}><Checkbox checked={!!item.done} disabled /></div>
              <div className="sk-col" style={{ flex: 1, gap: item.done ? 0 : 2 }}>
                <div className="sk-label-3-regular" style={{ textDecoration: item.done ? "line-through" : "none", color: item.done ? "var(--sk-text-secondary)" : "var(--sk-text-primary)" }}>{item.title}</div>
                {!item.done && <div className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>{ELEMENT_LABEL[item.kind]}{item.date ? " · " + item.date : ""}</div>}
              </div>
            </div>
          ))}
          <button className="sk-link-btn sk-label-3-regular" onClick={onAdd} style={{ alignSelf: "flex-start", marginTop: 4 }}>+ Добавить</button>
        </div>
      )}
    </div>
  );
}

function ElementModal({ item, onClose }) {
  return (
    <Modal open title={item.title} onClose={onClose} size="s" secondary={<Button mode="secondary" onClick={onClose}>Закрыть</Button>}>
      <div className="sk-col sk-gap-3">
        <div className="sk-row sk-gap-2">
          <Tag size="s" hue="neutral">{ELEMENT_LABEL[item.kind]}</Tag>
          {item.date && <span className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>{item.date}</span>}
        </div>
        {item.description && <div className="sk-label-3-regular">{item.description}</div>}
        <StatusTag status={item.done ? "done" : "not_started"} style={{ alignSelf: "flex-start" }} />
      </div>
    </Modal>
  );
}

// ---------------- Контрольная точка (проведение руководителем) ----------------
const SCALE_FACES_STATIC = { 1: "😞", 2: "🙁", 3: "😐", 4: "🙂", 5: "😄" };
const RISK_LEVELS = [
  { value: "none", label: "Риск отсутствует" },
  { value: "low", label: "Низкий риск" },
  { value: "medium", label: "Средний риск" },
  { value: "high", label: "Высокий риск" },
];
const RISK_HUE = { none: "positive", low: "neutral", medium: "warning", high: "negative" };
// Цвета для активной риск-кнопки в незавершённой КТ — те же токены, что у Tag (SK_TAG_HUES),
// чтобы выбранная пилюля до завершения совпадала по цвету с финальным Tag после завершения.
const RISK_BUTTON_COLORS = {
  positive: { bg: "var(--sk-positive-secondary)", color: "var(--sk-text-positive)", stroke: "var(--sk-text-positive)" },
  neutral: { bg: "var(--sk-surface-secondary)", color: "var(--sk-text-primary)", stroke: "var(--sk-stroke-accent)" },
  warning: { bg: "var(--sk-warning-secondary)", color: "var(--sk-text-warning-dark)", stroke: "var(--sk-text-warning-dark)" },
  negative: { bg: "var(--sk-negative-secondary)", color: "var(--sk-text-negative)", stroke: "var(--sk-text-negative)" },
};

function ManagerCheckpointDrawer({ checkpoint, viewerName, employee, canEdit, isUpcoming, onFinish, onAddComment, onUpdate, onClose }) {
  const [employeeSummary, setEmployeeSummary] = React.useState(checkpoint.employeeSummary || "");
  const [internalReport, setInternalReport] = React.useState(checkpoint.internalReport || "");
  const [riskLevel, setRiskLevel] = React.useState(checkpoint.riskLevel || "");
  const [comment, setComment] = React.useState("");
  const [drawerTab, setDrawerTab] = React.useState("comments");
  // Пока точка ещё не наступила, руководитель может донастроить срок/проверяющего/повестку —
  // все три поля редактируются вместе, одним переключением в режим редактирования.
  const [editing, setEditing] = React.useState(false);
  const [dateDraft, setDateDraft] = React.useState(checkpoint.dateLabel || checkpoint.date || "");
  const [reviewerDraft, setReviewerDraft] = React.useState(checkpoint.reviewer);
  const [agendaDraft, setAgendaDraft] = React.useState(checkpoint.agenda || []);
  const done = checkpoint.status === "done";
  const surveyReady = checkpoint.surveySubmitted || done;
  const reportReady = !!(employeeSummary.trim() && internalReport.trim() && riskLevel);
  const canFinish = canEdit && !done && surveyReady && reportReady;
  const fieldsDisabled = !surveyReady || !canEdit;
  const canSaveEdit = dateDraft.trim() && reviewerDraft && agendaDraft.some(a => a.trim());

  function startEditing() {
    setDateDraft(checkpoint.dateLabel || checkpoint.date || "");
    setReviewerDraft(checkpoint.reviewer);
    setAgendaDraft(checkpoint.agenda || []);
    setEditing(true);
  }
  function saveEditing() {
    onUpdate({ dateLabel: dateDraft.trim(), reviewer: reviewerDraft, agenda: agendaDraft.map(a => a.trim()).filter(Boolean) });
    setEditing(false);
  }

  // Быстрое действие — карандаш редактирования в шапке (виден только пока точка не
  // наступила и есть право её настраивать), а не текстовая ссылка в теле дровера.
  const headerAction = (isUpcoming && canEdit && !editing)
    ? <Tooltip content="Редактировать срок, проверяющего и повестку"><Button size="s" mode="tertiary" onClick={startEditing}><IconEdit size={15} /></Button></Tooltip>
    : null;

  return (
    <Drawer open title={done ? "Промежуточные итоги сотрудника" : (employee ? "Как проходит адаптация — " + employee.name.split(" ")[0] : checkpoint.title)}
      onClose={onClose} size="m" headerActions={headerAction}
      primary={editing
        ? <Button disabled={!canSaveEdit} onClick={saveEditing} style={{ width: "100%" }}>Сохранить изменения</Button>
        : (!done && canEdit ? <Button disabled={!canFinish} onClick={() => onFinish({ employeeSummary: employeeSummary.trim(), internalReport: internalReport.trim(), riskLevel })} style={{ width: "100%" }}>Завершить контрольную точку</Button> : null)}
      secondary={editing ? <Button mode="secondary" onClick={() => setEditing(false)}>Отменить</Button> : null}>
      <div className="sk-col sk-gap-5">
        <div className="sk-row" style={{ justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 12 }}>
          {employee ? (
            <div className="sk-row sk-gap-2">
              <Avatar src={personPhoto(employee.name)} name={employee.name} size={40} />
              <div className="sk-col" style={{ gap: 0 }}>
                <div className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>Сотрудник</div>
                <div className="sk-label-3">{employee.name}</div>
              </div>
            </div>
          ) : (
            <Tag size="s" hue="neutral">{checkpoint.title}</Tag>
          )}
          {isUpcoming ? (
            <Tag size="s" hue="neutral">Ещё не началась</Tag>
          ) : !done && (checkpoint.daysLeftLabel || checkpoint.dueLabel) ? (
            <div className="sk-col" style={{ gap: 0, alignItems: "flex-end" }}>
              {checkpoint.daysLeftLabel && <div className="sk-label-3">{checkpoint.daysLeftLabel}</div>}
              {checkpoint.dueLabel && <div className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>{checkpoint.dueLabel}</div>}
            </div>
          ) : (
            <StatusTag status={done ? "cp_done" : "cp_pending"} />
          )}
        </div>

        {done && <div className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>Срок: {checkpoint.dateLabel || checkpoint.date}</div>}

        {/* Срок ещё не подошёл — компактная строка вместо блока "Параметры": дата и
            проверяющий, только если проверяющий не сам смотрящий (иначе это его же имя). */}
        {isUpcoming && !editing && (
          <div className="sk-row sk-gap-3" style={{ alignItems: "center" }}>
            <span className="sk-label-4">{checkpoint.dateLabel || checkpoint.date}</span>
            {checkpoint.reviewer !== viewerName && (
              <div className="sk-row sk-gap-2" style={{ alignItems: "center" }}>
                <Avatar src={personPhoto(checkpoint.reviewer)} name={checkpoint.reviewer} size={20} />
                <span className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>{checkpoint.reviewer}</span>
              </div>
            )}
          </div>
        )}

        {isUpcoming && editing && (
          <div className="sk-col sk-gap-3">
            <Input label="Дата проведения" value={dateDraft} onChange={(e) => setDateDraft(e.target.value || "")} />
            <Select label="Проверяющий" value={reviewerDraft} options={REVIEWER_OPTIONS} onChange={setReviewerDraft} />
          </div>
        )}

        <div className="sk-col sk-gap-2" style={{ padding: 16, background: "var(--sk-surface-secondary)", borderRadius: "var(--sk-radius-3)" }}>
          <div className="sk-label-3">Повестка</div>
          {editing ? (
            <div className="sk-col sk-gap-2">
              {agendaDraft.map((a, i) => (
                <div key={i} className="sk-row sk-gap-2" style={{ alignItems: "center" }}>
                  <Input value={a} onChange={(e) => setAgendaDraft(prev => prev.map((x, ix) => ix === i ? (e.target.value || "") : x))} style={{ flex: 1 }} />
                  <button className="sk-link-btn" onClick={() => setAgendaDraft(prev => prev.filter((_, ix) => ix !== i))}><IconX size={15} color="var(--sk-icon-secondary)" /></button>
                </div>
              ))}
              <button className="sk-link-btn sk-label-3-regular" onClick={() => setAgendaDraft(prev => [...prev, ""])}
                style={{ alignSelf: "flex-start", color: "var(--sk-text-accent)" }}>
                <span className="sk-row sk-gap-1"><IconPlusSm size={16} />Добавить пункт</span>
              </button>
            </div>
          ) : (
            <div className="sk-col sk-gap-2">
              {checkpoint.agenda.map((a, i) => (
                <div key={i} className="sk-row sk-gap-2" style={{ alignItems: "flex-start" }}>
                  <span style={{
                    width: 20, height: 20, borderRadius: "50%", flexShrink: 0, display: "flex", alignItems: "center", justifyContent: "center",
                    background: "var(--sk-surface-dark)", color: "var(--sk-text-contrast)", font: "var(--sk-label-4)",
                  }}>{i + 1}</span>
                  <div className="sk-label-3-regular">{a}</div>
                </div>
              ))}
            </div>
          )}
        </div>

        {!surveyReady ? (
          <Alert hue="warning">Сотрудник ещё не заполнил опрос — итог можно зафиксировать после того, как он ответит.</Alert>
        ) : (
          <div className="sk-col sk-gap-4">
            <div className="sk-label-3">Ответы сотрудника</div>
            {checkpoint.survey.map((q, i) => (
              <div key={i} className="sk-col sk-gap-2">
                <div className="sk-label-3-regular">{q.q}</div>
                {q.type === "scale" ? (
                  <div className="sk-row sk-gap-2" style={{ alignItems: "center" }}>
                    <span style={{
                      width: 34, height: 34, borderRadius: "50%", flexShrink: 0, display: "flex", alignItems: "center", justifyContent: "center",
                      background: SCALE_TINTS[q.answer], border: "1.5px solid " + SCALE_BORDERS[q.answer],
                    }}><ScaleFace n={q.answer} size={22} color={SCALE_BORDERS[q.answer]} /></span>
                    <span className="sk-label-3-regular">{[q.minLabel, null, null, null, q.maxLabel][q.answer - 1] || (q.answer + " из 5")}</span>
                  </div>
                ) : (
                  <div className="sk-label-3-regular" style={{ color: "var(--sk-text-secondary)", background: "var(--sk-surface-secondary)", borderRadius: "var(--sk-radius-2)", padding: "10px 12px" }}>{q.answer}</div>
                )}
              </div>
            ))}
          </div>
        )}

        <Divider />

        <div className="sk-col sk-gap-2">
          <div className="sk-row sk-gap-1"><span className="sk-label-3">Итоги встречи для сотрудника</span><span style={{ color: "var(--sk-text-negative)" }}>*</span></div>
          <div className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>Будут доступны сотруднику</div>
          {done ? <div className="sk-label-3-regular">{checkpoint.employeeSummary}</div> : (
            <Textarea placeholder="Опишите итоги встречи, договорённости и следующие шаги" rows={2}
              value={employeeSummary} onChange={(e) => setEmployeeSummary(e.target.value || "")} disabled={fieldsDisabled} />
          )}
        </div>

        <div className="sk-col sk-gap-2">
          <div className="sk-row sk-gap-1"><span className="sk-label-3">Внутренний отчёт</span><span style={{ color: "var(--sk-text-negative)" }}>*</span></div>
          <div className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>Доступен только руководителю и HR</div>
          {done ? <div className="sk-label-3-regular">{checkpoint.internalReport}</div> : (
            <Textarea placeholder="Зафиксируйте внутреннюю оценку, проблемы и рекомендации" rows={2}
              value={internalReport} onChange={(e) => setInternalReport(e.target.value || "")} disabled={fieldsDisabled} />
          )}
        </div>

        <div className="sk-col sk-gap-2">
          <div className="sk-row sk-gap-1"><span className="sk-label-3">Уровень риска</span><span style={{ color: "var(--sk-text-negative)" }}>*</span></div>
          {done ? (
            <Tag size="s" hue={RISK_HUE[riskLevel] || "neutral"} style={{ alignSelf: "flex-start" }}>
              {(RISK_LEVELS.find((r) => r.value === riskLevel) || {}).label || "—"}
            </Tag>
          ) : (
            <div className="sk-row sk-gap-2" style={{ flexWrap: "wrap" }}>
              {RISK_LEVELS.map((r) => {
                const active = riskLevel === r.value;
                const c = RISK_BUTTON_COLORS[RISK_HUE[r.value]] || RISK_BUTTON_COLORS.neutral;
                return (
                  <button key={r.value} type="button" disabled={fieldsDisabled} onClick={() => setRiskLevel(r.value)}
                    className={fieldsDisabled ? "" : "sk-clickable"} style={{
                      padding: "7px 14px", borderRadius: "var(--sk-radius-full)", border: "1.5px solid " + (active ? c.stroke : "var(--sk-stroke)"),
                      background: active ? c.bg : "var(--sk-surface-page)",
                      color: active ? c.color : "var(--sk-text-secondary)",
                      font: active ? "var(--sk-label-3)" : "var(--sk-label-3-regular)",
                      cursor: fieldsDisabled ? "default" : "pointer", opacity: fieldsDisabled ? 0.5 : 1,
                    }}>{r.label.replace(" риск", "").replace("Риск ", "")}</button>
                );
              })}
            </div>
          )}
        </div>

        <Divider />
        <DrawerTabs items={[{
          id: "comments",
          label: <span className="sk-label-3">Комментарии <span className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>{(checkpoint.comments || []).length}</span></span>,
        }]} active={drawerTab} onChange={setDrawerTab} />
        {drawerTab === "comments" && (
          <CommentsPanel comments={checkpoint.comments} comment={comment} setComment={setComment}
            onAdd={onAddComment} disabled={false} />
        )}
      </div>
    </Drawer>
  );
}

// ---------------- Общие мелкие блоки (аналогично роли "Сотрудник") ----------------
function CollapsibleSection({ title, children, defaultOpen = true }) {
  const [open, setOpen] = React.useState(defaultOpen);
  return (
    <div className="sk-col sk-gap-3">
      <div className="sk-row sk-clickable" style={{ justifyContent: "space-between" }} onClick={() => setOpen(o => !o)}>
        <div className="sk-label-3">{title}</div>
        {open ? <IconChevronUp size={16} color="var(--sk-icon-secondary)" /> : <IconChevronDown size={16} color="var(--sk-icon-secondary)" />}
      </div>
      {open && children}
    </div>
  );
}

// Строка "название параметра — значение": значение стоит сразу рядом с названием,
// а не растянуто к правому краю (единый вид для всех "Параметры" во всех дроверах).
function ParamRow({ label, children }) {
  return (
    <div className="sk-row sk-gap-3" style={{ alignItems: "center", padding: "8px 0" }}>
      <span className="sk-muted" style={{ font: "var(--sk-label-4-regular)", minWidth: 124, flexShrink: 0 }}>{label}</span>
      {children}
    </div>
  );
}

function PersonCard({ p }) {
  return (
    <div className="sk-col sk-gap-2">
      <div className="sk-row sk-gap-3">
        <Avatar src={personPhoto(p.name)} name={p.name} size={36} />
        <div className="sk-col" style={{ gap: 0 }}>
          <div className="sk-label-3">{p.name}</div>
          <div className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>{p.role}</div>
        </div>
      </div>
      <div className="sk-col sk-gap-1" style={{ paddingLeft: 48 }}>
        {p.phone && <div className="sk-row sk-gap-2 sk-muted" style={{ font: "var(--sk-label-4-regular)" }}><IconPhone size={13} />{p.phone}</div>}
        {p.telegram && <div className="sk-row sk-gap-2 sk-muted" style={{ font: "var(--sk-label-4-regular)" }}><IconSend size={13} />{p.telegram}</div>}
        <div className="sk-row sk-gap-2 sk-muted" style={{ font: "var(--sk-label-4-regular)" }}><IconMail size={13} />{p.email}</div>
      </div>
    </div>
  );
}

function RightPanel({ member, plan, overallPct, onOpenCheckpoint, showCheckpoints }) {
  const cpOrder = Object.keys(plan.checkpoints);
  const checkpoints = cpOrder.filter(id => plan.checkpoints[id]).map(id => plan.checkpoints[id]);
  const firstPendingIndex = checkpoints.findIndex(c => c.status !== "done");
  return (
    <div className="sk-col sk-gap-5">
      <div style={{ position: "relative", marginTop: 20 }}>
        <Card bordered padding={0} style={{ paddingTop: 34, paddingBottom: 16, paddingLeft: 16, paddingRight: 16 }}>
          <div className="sk-col sk-gap-1" style={{ alignItems: "flex-start" }}>
            <div className="sk-title-5">{member.name}</div>
            <Tag size="s" hue="neutral">{member.position}</Tag>
            <div className="sk-muted" style={{ font: "var(--sk-label-4-regular)", marginTop: 4 }}>{member.department}</div>
          </div>
        </Card>
        <div style={{ position: "absolute", top: -20, left: 16 }}>
          <Avatar src={personPhoto(member.name)} name={member.name} size={56} style={{ boxShadow: "0 0 0 3px var(--sk-surface-page)" }} />
        </div>
      </div>

      {showCheckpoints && checkpoints.length > 0 && (
        <Card bordered>
          <div className="sk-col sk-gap-3">
            <div className="sk-label-3">Контрольные точки <span style={{ color: "var(--sk-text-secondary)" }}>· {checkpoints.filter(c => c.status === "done").length} из {checkpoints.length}</span></div>
            <div className="sk-col sk-gap-2">
              {checkpoints.map((cp, i) => {
                const isDone = cp.status === "done";
                const isCurrent = !isDone && i === firstPendingIndex;
                const isMine = cp.reviewer === (typeof D !== "undefined" && (D.manager ? D.manager.name : (D.assistantMe ? D.assistantMe.name : null)));
                return (
                  <div key={cp.id} className="sk-clickable" onClick={() => onOpenCheckpoint(cp.id)} style={{
                    display: "flex", alignItems: "center", gap: 10, padding: 10, borderRadius: "var(--sk-radius-3)",
                    border: isCurrent ? "1.5px solid " + CP_YELLOW_BORDER : "1px solid var(--sk-stroke)",
                    background: isCurrent ? CP_YELLOW_BG : "var(--sk-surface-page)",
                  }}>
                    <span style={{
                      width: 28, height: 28, borderRadius: "50%", flexShrink: 0, display: "flex", alignItems: "center", justifyContent: "center",
                      font: "var(--sk-label-3)",
                      background: isDone ? "var(--sk-surface-dark)" : isCurrent ? CP_YELLOW : "var(--sk-surface-secondary)",
                      color: isDone || isCurrent ? "var(--sk-text-contrast)" : "var(--sk-text-tertiary)",
                    }}>{isDone ? <IconCheck size={13} /> : i + 1}</span>
                    <div className="sk-col" style={{ gap: 0, flex: 1, minWidth: 0 }}>
                      <div className="sk-label-4">{cp.dateLabel || cp.date}</div>
                      <div className="sk-muted" style={{ font: "var(--sk-label-4-regular)", whiteSpace: "nowrap" }}>{isDone ? cp.reviewer : (isMine ? "Ожидает вас" : "Проверяющий: " + cp.reviewer)}</div>
                    </div>
                    {isCurrent && (
                      <button type="button" onClick={(e) => { e.stopPropagation && e.stopPropagation(); onOpenCheckpoint(cp.id); }} style={{
                        height: 32, padding: "0 14px", borderRadius: "var(--sk-radius-full)", border: "none", cursor: "pointer",
                        background: CP_YELLOW, color: "var(--sk-text-contrast)", font: "var(--sk-label-3)", fontWeight: 600, flexShrink: 0,
                      }}>Пройти</button>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        </Card>
      )}

      <Card bordered>
        <div className="sk-col sk-gap-3">
          <div className="sk-label-3">Статус адаптации</div>
          <StatusTag status={plan.status === "completed" ? "completed" : "in_progress_plan"} style={{ alignSelf: "flex-start" }} />
          <div className="sk-row sk-gap-3" style={{ alignItems: "center" }}><ProgressBar value={overallPct} style={{ flex: 1 }} hue="accent" /><span className="sk-title-5">{overallPct}%</span></div>
          <div className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>{plan.dateStart} – {plan.dateEnd}</div>
        </div>
      </Card>

      <Card bordered>
        <div className="sk-col sk-gap-4">
          <div className="sk-col sk-gap-2">
            <div className="sk-row sk-gap-2"><IconClock size={16} color="var(--sk-icon-secondary)" /><span className="sk-label-4-regular">{D.info.hours}</span></div>
            <div className="sk-row sk-gap-2" style={{ alignItems: "flex-start" }}><IconMapPin size={16} color="var(--sk-icon-secondary)" style={{ marginTop: 2 }} /><span className="sk-label-4-regular">{D.info.address}</span></div>
          </div>
          <Divider />
          <div className="sk-col sk-gap-4">
            <div className="sk-label-4" style={{ color: "var(--sk-text-tertiary)", textTransform: "uppercase" }}>Участники плана</div>
            <PersonCard p={D.manager} />
            {D.assistants.length > 0 && (
              <div className="sk-col sk-gap-3">
                <div className="sk-label-4" style={{ color: "var(--sk-text-tertiary)", textTransform: "uppercase" }}>Помощники</div>
                {D.assistants.map((a, i) => <PersonCard key={i} p={a} />)}
              </div>
            )}
            <div className="sk-col sk-gap-3">
              <div className="sk-label-4" style={{ color: "var(--sk-text-tertiary)", textTransform: "uppercase" }}>HR BP</div>
              <PersonCard p={D.hrbp} />
            </div>
          </div>
        </div>
      </Card>
    </div>
  );
}

function FaqPanel({ plan }) {
  if (!plan.faq.length) return <Card bordered><div className="sk-muted">Для этого плана вопросов пока нет.</div></Card>;
  return (
    <Card bordered>
      <div className="sk-col sk-gap-3">
        {plan.faq.map((f, i) => <FaqItem key={i} f={f} />)}
      </div>
    </Card>
  );
}
function FaqItem({ f }) {
  const [open, setOpen] = React.useState(false);
  return (
    <div className="sk-col sk-gap-1 sk-clickable" onClick={() => setOpen(o => !o)} style={{ padding: 8, borderRadius: "var(--sk-radius-2)" }}>
      <div className="sk-row" style={{ justifyContent: "space-between" }}>
        <div className="sk-label-3">{f.q}</div>
        {open ? <IconChevronUp size={16} color="var(--sk-icon-secondary)" /> : <IconChevronDown size={16} color="var(--sk-icon-secondary)" />}
      </div>
      {open && <div className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>{f.a}</div>}
    </div>
  );
}
function ChatPanel({ member }) {
  return (
    <Card bordered>
      <div className="sk-col sk-gap-3">
        <div className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>Общий чат участников плана. В этой версии прототипа сообщения не отправляются.</div>
        <div className="sk-col sk-gap-2" style={{ padding: 10, background: "var(--sk-surface-secondary)", borderRadius: "var(--sk-radius-3)" }}>
          <div className="sk-row sk-gap-2"><Avatar src={personPhoto(member.name)} name={member.name} size={24} /><div className="sk-label-4-regular">{member.name.split(" ")[0]}: Подскажите, пожалуйста, когда появятся цели по плану?</div></div>
        </div>
        <div className="sk-row sk-gap-2">
          <Textarea placeholder="Написать сообщение…" style={{ flex: 1 }} rows={2} />
          <Button size="s" icon={<IconSend size={16} />} />
        </div>
      </div>
    </Card>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Page />);
</script>
</body>
</html>
