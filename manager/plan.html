<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>План сотрудника — Skillaz Start</title>
<link rel="stylesheet" href="../assets/styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script src="../assets/ds_bundle.js"></script>
<script src="../assets/data.js"></script>
<script type="text/babel" src="../assets/shell.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {
  Card, ProgressCircle, ProgressBar, Tag, Avatar, Divider, Tabs, SegmentedControl, Modal, Drawer, Checkbox, Radio,
  Textarea, Input, Select, DatePicker, Button, Snackbar, Alert, Tooltip, Loader,
} = window.SkillazCoreDesignSystem_bf9566;
const { AppShell, StatusTag, Icons, personPhoto } = window.Site;
const {
  IconArrowLeft, IconCheck, IconLock, IconClock, IconFileText, IconLink2, IconMessageCircle,
  IconHelpCircle, IconTarget, IconMapPin, IconPhone, IconMail, IconSend,
  IconChevronUp, IconChevronDown, IconChevronRight, IconX, IconAlertCircle, IconTrash, IconSearch, IconFilter, IconClipboard, IconPlusSm,
  IconEdit, IconLayers, IconSparkles, IconBookOpen, IconMic, IconImage, IconPaperclip, IconRepeat, IconBriefcase,
} = Icons;
const D = window.SITE_DATA;
function stripDuePrefix(label) {
  return (label || "").replace(/^до\s+/i, "");
}
// Склонение "шаг/шага/шагов" для счётчика шагов у цели каталога (см. hr/goals-catalog.html).
function pluralSteps(n) {
  const mod10 = n % 10, mod100 = n % 100;
  if (mod10 === 1 && mod100 !== 11) return "шаг";
  if (mod10 >= 2 && mod10 <= 4 && (mod100 < 10 || mod100 >= 20)) return "шага";
  return "шагов";
}
// Склонение "цель/цели/целей" — для счётчика в свёрнутом списке каталога.
// Название шаблона оценочного листа часто начинается с "Оценочный лист: ..." — этот
// префикс дублирует заголовок секции "Оценочный лист" в дровере, поэтому в подзаголовке
// показываем только суть названия (например, "Первая консультация покупателя").
function assessmentTemplateName(title) {
  const t = (title || "").replace(/^оценочный лист:?\s*/i, "");
  return t ? t.charAt(0).toUpperCase() + t.slice(1) : t;
}

function useDeepState(initial) {
  const [state, setState] = React.useState(() => JSON.parse(JSON.stringify(initial)));
  return [state, setState];
}
function employeeIdFromUrl() {
  const id = new URLSearchParams(window.location.search).get("employee");
  const m = D.team.find(t => t.id === id && t.planId);
  return m ? m.id : "nikita";
}
// По умолчанию открываем "План адаптации" (а не чек-лист базовых действий) — это основной
// рабочий экран и для руководителя, и для сотрудника. ?tab= в URL всегда имеет приоритет.
function initialTabFromUrl(hasGoals) {
  const t = new URLSearchParams(window.location.search).get("tab");
  if (t === "max" || t === "min") return t;
  return hasGoals ? "max" : "min";
}

const MONTHS = ["янв", "фев", "мар", "апр", "май", "июн", "июл", "авг", "сен", "окт", "ноя", "дек"];
function fmtDate(date) { return date.getDate() + " " + MONTHS[date.getMonth()] + " " + date.getFullYear(); }

const ELEMENT_ICON = { article: IconFileText, task: IconCheck, course: IconFileText, survey: IconHelpCircle, file: IconFileText, link: IconLink2, checkpoint: IconTarget };
const ELEMENT_LABEL = { article: "Статья", task: "Задача", course: "Курс", survey: "Опрос", file: "Файл", link: "Ссылка", checkpoint: "Контрольная точка" };
// Кружок с номером шага теперь всегда нейтральный, независимо от статуса — см. STATUS_ICON.
const NUMBER_BADGE = {
  not_started: { bg: "transparent", fg: "var(--sk-text-tertiary)", border: "1.5px solid var(--sk-stroke)" },
};
const SUBGOAL_STATUS_LABEL = {
  done: "Выполнено", not_done: "Не выполнено", pending_review: "На проверке",
  in_progress: "В работе", returned: "Возвращена в работу", not_started: "Не начата",
};
// Кружок с номером шага всегда нейтральный (как у ещё не начатых) — разноцветные кружки
// плохо считывались вперемешку с номерами. Статус вместо этого читается по цветной иконке
// справа от строки шага, без цветной подложки.
const STATUS_ICON = {
  in_progress: { icon: IconEdit, color: "var(--sk-accent)" },
  returned: { icon: IconAlertCircle, color: "var(--sk-warning)" },
  done: { icon: IconCheck, color: "var(--sk-positive)" },
  not_done: { icon: IconX, color: "var(--sk-negative)" },
  pending_review: { icon: IconClock, color: "var(--sk-warning)" },
};

const MIN_TAB_NOTE = "Формальный порог входа в роль. Сотрудник отмечает пункты сам, вашего подтверждения не требуется.";
const MAX_TAB_NOTE = "Цели сотрудника на адаптацию. Открывайте цель, чтобы задать шаги и проверять прогресс.";
const CP_YELLOW = "var(--yellow-yellow-85)";
const CP_YELLOW_BG = "var(--yellow-yellow-96)";
const CP_YELLOW_BORDER = "var(--yellow-yellow-80)";
// Та же шкала-смайлы, что видит сотрудник в employee/plan.html (CheckpointModal) — переносим
// 1-в-1, чтобы проверяющий читал ответы сотрудника в той же визуальной кодировке, а не как
// мелкие голые цифры без цвета и формы.
const SCALE_TINTS = { 1: "#FBE4E4", 2: "#FCEBD6", 3: "#FBF3CB", 4: "#DEF3E1", 5: "#CFEDD5" };
const SCALE_BORDERS = { 1: "#E0716F", 2: "#E0A23D", 3: "#D2B93B", 4: "#5DAE6F", 5: "#3E9E56" };
const SCALE_MOUTHS = {
  1: "M8.2 16c1.4-2 6.2-2 7.6 0",
  2: "M8.2 15.4c1.4-1 6.2-1 7.6 0",
  3: "M8.2 15h7.6",
  4: "M8.2 14.4c1.4 1 6.2 1 7.6 0",
  5: "M7.6 13.8c1.9 2.6 6.9 2.6 8.8 0",
};
// viewBox уже, чем 24 — черты лица занимают почти весь кружок вместо мелкой картинки по центру
function ScaleFace({ n, size = 22, color }) {
  return (
    <svg width={size} height={size} viewBox="4 4 16 16" fill="none">
      <circle cx="9" cy="10" r="1.35" fill={color} />
      <circle cx="15" cy="10" r="1.35" fill={color} />
      <path d={SCALE_MOUTHS[n]} stroke={color} strokeWidth="1.7" strokeLinecap="round" fill="none" />
    </svg>
  );
}

function goalProgress(goal) {
  const total = goal.subgoals.length;
  const done = goal.subgoals.filter(s => s.status === "done").length;
  return { done, total, pct: total ? Math.round((done / total) * 100) : 0 };
}
// Статус цели не хранится и не выставляется вручную — он всегда считается по статусам
// подцелей (сотрудник берёт в работу подцели, не цели целиком): не начата, пока ни одна
// подцель не сдвинулась с места; выполнена, когда все (не отменённые) подцели выполнены;
// во всех промежуточных случаях (есть подцели в работе, на подтверждении или уже
// выполненные, но не все) — в работе.
function deriveGoalStatus(goal) {
  const active = (goal.subgoals || []).filter(sg => sg.status !== "cancelled");
  if (!active.length || active.every(sg => sg.status === "not_started")) return "not_started";
  if (active.every(sg => sg.status === "done")) return "done";
  return "in_progress";
}
function findChecklistItem(plan, id) {
  for (const s of plan.stages) {
    const it = s.items.find(i => i.id === id);
    if (it) return { item: it, stage: s };
  }
  return null;
}
function planValidForPublish(goals) {
  if (!goals.length) return false;
  return goals.every(g => g.title && g.description && g.dueLabel && g.subgoals.length > 0 &&
    g.subgoals.every(sg => sg.title && sg.description && sg.dueLabel && sg.reviewer));
}
const REVIEWER_OPTIONS = [D.manager, ...D.assistants].map(p => ({ value: p.name, label: p.name === D.manager.name ? "Я (" + p.name + ")" : p.name }));

function Page() {
  const employeeId = employeeIdFromUrl();
  const member = D.team.find(t => t.id === employeeId);
  const basePlan = D.plans[member.planId];
  const [plan, setPlan] = useDeepState(basePlan);
  const [tab, setTab] = React.useState(() => initialTabFromUrl(basePlan.hasGoals));
  const [toast, setToast] = React.useState(null);

  const [goalDrawer, setGoalDrawer] = React.useState(null); // { mode: "new" } | { mode: "edit", goalId }
  const [newGoalDraft, setNewGoalDraft] = React.useState({ title: "", description: "", dueDate: new Date(2026, 0, 20), subgoals: [] });
  const [draftFromCatalog, setDraftFromCatalog] = React.useState(false); // черновик пришёл из каталога — показать бейдж в дровере
  const [goalMethodModal, setGoalMethodModal] = React.useState(false); // выбор способа создания цели
  const [aiGoalModal, setAiGoalModal] = React.useState(false); // создание цели с AI-помощником
  const [goalCatalogModal, setGoalCatalogModal] = React.useState(false); // выбор цели из каталога
  const [highlightGoalId, setHighlightGoalId] = React.useState(null); // подсветка только что добавленной AI цели в списке
  const [subgoalMethodModal, setSubgoalMethodModal] = React.useState(null); // { context: "draft" } | { context: "goal", goalId } — выбор способа добавления шага
  const [subgoalModal, setSubgoalModal] = React.useState(null); // { context: "draft" } | { context: "goal", goalId }
  const [subgoalDrawer, setSubgoalDrawer] = React.useState(null); // { goalId, subgoalId }
  const [checklistPicker, setChecklistPicker] = React.useState(null); // { goalId, subgoalId }
  const [publishConfirm, setPublishConfirm] = React.useState(false);
  const [returnModal, setReturnModal] = React.useState(null); // { goalId, subgoalId }
  const [deleteGoal, setDeleteGoal] = React.useState(null);
  const [deleteSubgoal, setDeleteSubgoal] = React.useState(null);
  const [taskModal, setTaskModal] = React.useState(null);
  const [cpModal, setCpModal] = React.useState(null);

  function showToast(msg) {
    setToast(msg);
    window.clearTimeout(showToast._t);
    showToast._t = window.setTimeout(() => setToast(null), 3200);
  }

  // ---------------- Цели: CRUD ----------------
  function addGoal(draft) {
    const id = "g" + Date.now();
    const subgoals = (draft.subgoals || []).map((sg, i) => ({
      id: "sg" + Date.now() + "_" + i, title: sg.title, description: sg.description,
      dueLabel: fmtDate(sg.dueDate), reviewer: sg.reviewer, status: "not_started",
      checklistRefs: sg.checklistRefs || [], comments: [], assessmentChecklist: sg.assessmentChecklist || null, assessmentHistory: [],
    }));
    setPlan(prev => ({ ...prev, goals: [...prev.goals, {
      id, title: draft.title, description: draft.description, dueLabel: fmtDate(draft.dueDate),
      status: "not_started", subgoals,
    }] }));
    return id;
  }
  // Черновик из AI-помощника — тот же addGoal, просто шаги приходят строками (без своих
  // дат/проверяющих: это шаги к общей цели, а не отдельные подцели, см. ТЗ п.2 и п.16),
  // поэтому каждому шагу подставляем срок и проверяющего самой цели.
  function addAIGoal(draft) {
    const id = addGoal({
      title: draft.title, description: draft.description, dueDate: draft.dueDate,
      subgoals: draft.steps.filter(s => s.trim()).map(s => ({
        title: s.trim(), description: "", dueDate: draft.dueDate, reviewer: D.manager.name, checklistRefs: [],
      })),
    });
    setHighlightGoalId(id);
    window.setTimeout(() => setHighlightGoalId(cur => cur === id ? null : cur), 4000);
  }
  function updateGoal(goalId, patch) {
    setPlan(prev => ({ ...prev, goals: prev.goals.map(g => g.id !== goalId ? g : { ...g, ...patch }) }));
  }
  function removeGoal(goalId) {
    setPlan(prev => ({ ...prev, goals: prev.goals.filter(g => g.id !== goalId) }));
    setDeleteGoal(null);
    showToast("Цель удалена");
  }
  function addSubgoal(goalId, draft) {
    const id = "sg" + Date.now();
    setPlan(prev => ({ ...prev, goals: prev.goals.map(g => g.id !== goalId ? g : {
      ...g, subgoals: [...g.subgoals, {
        id, title: draft.title, description: draft.description, dueLabel: fmtDate(draft.dueDate),
        reviewer: draft.reviewer, status: "not_started", checklistRefs: draft.checklistRefs || [], comments: [],
        assessmentChecklist: draft.assessmentChecklist || null, assessmentHistory: [],
      }],
    }) }));
    return id;
  }
  function updateSubgoal(goalId, subgoalId, patch) {
    setPlan(prev => ({ ...prev, goals: prev.goals.map(g => g.id !== goalId ? g : {
      ...g, subgoals: g.subgoals.map(sg => sg.id !== subgoalId ? sg : { ...sg, ...patch }),
    }) }));
  }
  function removeSubgoal(goalId, subgoalId) {
    setPlan(prev => ({ ...prev, goals: prev.goals.map(g => g.id !== goalId ? g : {
      ...g, subgoals: g.subgoals.filter(sg => sg.id !== subgoalId),
    }) }));
    setDeleteSubgoal(null);
    showToast("Подцель удалена");
  }
  function toggleChecklistRef(goalId, subgoalId, itemId) {
    setPlan(prev => ({ ...prev, goals: prev.goals.map(g => g.id !== goalId ? g : {
      ...g, subgoals: g.subgoals.map(sg => sg.id !== subgoalId ? sg : {
        ...sg, checklistRefs: (sg.checklistRefs || []).includes(itemId)
          ? sg.checklistRefs.filter(x => x !== itemId) : [...(sg.checklistRefs || []), itemId],
      }),
    }) }));
  }
  function addComment(goalId, subgoalId, text) {
    setPlan(prev => ({ ...prev, goals: prev.goals.map(g => g.id !== goalId ? g : {
      ...g, subgoals: g.subgoals.map(sg => sg.id !== subgoalId ? sg : {
        ...sg, comments: [...(sg.comments || []), { author: D.manager.name, date: "Сегодня", text }],
      }),
    }) }));
  }

  // ---------------- Подтверждение / возврат / not_done ----------------
  function confirmSubgoal(goalId, subgoalId) {
    updateSubgoal(goalId, subgoalId, { status: "done" });
    showToast("Подцель подтверждена");
    setSubgoalDrawer(null);
  }
  function returnSubgoal(goalId, subgoalId, comment) {
    addComment(goalId, subgoalId, comment);
    updateSubgoal(goalId, subgoalId, { status: "in_progress" });
    showToast("Подцель возвращена в работу");
    setReturnModal(null);
    setSubgoalDrawer(null);
  }
  function markNotDone(goalId, subgoalId) {
    updateSubgoal(goalId, subgoalId, { status: "not_done" });
    showToast("Подцель отмечена невыполненной");
    setNotDoneConfirm(null);
    setSubgoalDrawer(null);
  }
  // Решение по оценочному листу: подцель может уходить на доработку и оцениваться заново
  // несколько раз, поэтому каждое решение — новая запись в assessmentHistory, а не
  // перезапись текущего состояния подцели (см. AssessmentModal).
  function submitAssessmentDecision(goalId, subgoalId, decision, { criteria, note }) {
    const statusByDecision = { done: "done", returned: "in_progress", not_done: "not_done" };
    const historyEntry = { date: "Сегодня", reviewer: D.manager.name, decision, criteria, note };
    setPlan(prev => ({ ...prev, goals: prev.goals.map(g => g.id !== goalId ? g : {
      ...g, subgoals: g.subgoals.map(sg => sg.id !== subgoalId ? sg : {
        ...sg, status: statusByDecision[decision], assessmentHistory: [...(sg.assessmentHistory || []), historyEntry],
      }),
    }) }));
    const toastByDecision = { done: "Подцель подтверждена", returned: "Подцель возвращена в работу", not_done: "Подцель отмечена невыполненной" };
    showToast(toastByDecision[decision]);
    setSubgoalDrawer(null);
  }
  function publishGoals() {
    setPlan(prev => ({ ...prev, goalsPublished: true }));
    setPublishConfirm(false);
    showToast("Цели опубликованы");
  }
  function finishCheckpoint(cpId, patch) {
    setPlan(prev => ({ ...prev, checkpoints: { ...prev.checkpoints, [cpId]: { ...prev.checkpoints[cpId], ...patch, status: "done" } } }));
    showToast("Контрольная точка завершена");
    setCpModal(null);
  }
  function addCheckpointComment(cpId, text) {
    setPlan(prev => ({ ...prev, checkpoints: { ...prev.checkpoints, [cpId]: { ...prev.checkpoints[cpId], comments: [...(prev.checkpoints[cpId].comments || []), { author: D.manager.name, date: "Сегодня", text }] } } }));
  }
  // Пока контрольная точка ещё не наступила, руководитель может донастроить её —
  // срок, проверяющего и повестку (см. ManagerCheckpointDrawer).
  function updateCheckpoint(cpId, patch) {
    setPlan(prev => ({ ...prev, checkpoints: { ...prev.checkpoints, [cpId]: { ...prev.checkpoints[cpId], ...patch } } }));
    showToast("Контрольная точка обновлена");
  }

  const totalChecklist = plan.stages.flatMap(s => s.items.filter(i => i.kind !== "checkpoint"));
  const doneChecklist = totalChecklist.filter(i => i.done).length;
  const checklistPct = totalChecklist.length ? Math.round((doneChecklist / totalChecklist.length) * 100) : 0;
  const goalsDoneCount = plan.goals.filter(g => g.subgoals.length && g.subgoals.every(s => s.status === "done")).length;
  const goalsPct = plan.goals.length ? Math.round((goalsDoneCount / plan.goals.length) * 100) : 0;
  const overallPct = goalsPct;
  const canPublish = planValidForPublish(plan.goals) && !plan.goalsPublished;

  const activeGoal = goalDrawer && goalDrawer.goalId ? plan.goals.find(g => g.id === goalDrawer.goalId) : null;
  const activeSubgoalGoal = subgoalDrawer && plan.goals.find(g => g.id === subgoalDrawer.goalId);
  const activeSubgoal = activeSubgoalGoal && activeSubgoalGoal.subgoals.find(s => s.id === subgoalDrawer.subgoalId);

  // Контрольные точки идут по порядку — та, что позже первой ещё не пройденной, своего
  // срока ещё не достигла. Только для таких можно поменять срок/проверяющего/повестку
  // (см. ManagerCheckpointDrawer): точку, которая уже активна или пройдена, не трогаем.
  const cpOrderIds = Object.keys(plan.checkpoints).filter(id => plan.checkpoints[id]);
  const cpFirstPendingIndex = cpOrderIds.findIndex(id => plan.checkpoints[id].status !== "done");
  const cpModalIsUpcoming = cpModal != null && cpFirstPendingIndex >= 0 && cpOrderIds.indexOf(cpModal) > cpFirstPendingIndex;

  const tabItems = [
    { id: "min", label: <span className="sk-row sk-gap-1"><IconClipboard size={16} />Базовые действия</span> },
    ...(plan.hasGoals ? [{ id: "max", label: <span className="sk-row sk-gap-1"><IconTarget size={16} />План адаптации {goalsPct}%</span> }] : []),
    { id: "chat", label: <span className="sk-row sk-gap-1"><IconMessageCircle size={16} />Чат</span> },
    { id: "faq", label: <span className="sk-row sk-gap-1"><IconHelpCircle size={16} />FAQ</span> },
  ];

  return (
    <AppShell role="manager" active="team" base=".."
      breadcrumb={<a href="team.html" className="sk-row sk-gap-1" style={{ color: "var(--sk-text-secondary)" }}><IconArrowLeft size={14} /> Моя команда</a>}>
      <Tabs items={tabItems} active={tab} onChange={setTab} />

      <div className="sk-row" style={{ alignItems: "flex-start", gap: 24 }}>
        <div className="sk-col sk-gap-6" style={{ flex: 1, minWidth: 0 }}>
          {tab === "min" && (
            <React.Fragment>
              <Alert hue="neutral" style={{ background: "var(--sk-surface-secondary)" }}>{MIN_TAB_NOTE}</Alert>
              <div className="sk-col sk-gap-4">
                {plan.stages.map((s, i) => (
                  <ManagerStageBlock key={s.id} stage={s} index={i + 1}
                    onOpenItem={(item) => setTaskModal(item)}
                    onAdd={() => showToast("Добавление элементов чек-листа доступно в редакторе адаптации")} />
                ))}
              </div>
            </React.Fragment>
          )}

          {tab === "max" && plan.hasGoals && (
            <React.Fragment>
              <Alert hue="neutral" style={{ background: "var(--sk-surface-secondary)" }}>{MAX_TAB_NOTE}</Alert>

              {plan.goals.length === 0 && (
                <Card>
                  <div className="sk-col sk-gap-3" style={{ alignItems: "center", textAlign: "center", padding: "24px 16px" }}>
                    <div className="sk-title-5">Сформируйте цель и шаги для её достижения{plan.goalsDeadlineLabel ? " до " + plan.goalsDeadlineLabel : ""}</div>
                    <div className="sk-muted" style={{ maxWidth: 440 }}>Цель — это ожидаемый вами измеримый результат, с которым сотрудник должен окончить план адаптации</div>
                    <Button onClick={() => setGoalMethodModal(true)}>+ Создать</Button>
                  </div>
                </Card>
              )}

              {plan.goals.length > 0 && (
                <React.Fragment>
                  {!plan.goalsPublished && (
                    <div className="sk-row sk-gap-2" style={{ justifyContent: "flex-end" }}>
                      <Button size="s" mode="secondary" disabled={plan.employeeStarted}
                        onClick={() => setGoalMethodModal(true)}>+ Создать цель</Button>
                      <Button size="s" variant="positive" disabled={!canPublish} onClick={() => setPublishConfirm(true)}>
                        Опубликовать
                      </Button>
                    </div>
                  )}
                  <div className="sk-col sk-gap-4">
                    {plan.goals.map(g => (
                      <ManagerGoalRow key={g.id} goal={g} plan={plan} highlighted={g.id === highlightGoalId}
                        onOpenGoal={() => setGoalDrawer({ mode: "edit", goalId: g.id })}
                        onOpenSubgoal={(sgId) => setSubgoalDrawer({ goalId: g.id, subgoalId: sgId })}
                        onOpenMaterials={(sgId) => setChecklistPicker({ goalId: g.id, subgoalId: sgId })}
                        onDeleteGoal={() => setDeleteGoal(g.id)} />
                    ))}
                  </div>
                </React.Fragment>
              )}
            </React.Fragment>
          )}
          {tab === "chat" && <ChatPanel member={member} />}
          {tab === "faq" && <FaqPanel plan={plan} />}
        </div>

        <div style={{ width: 320, flexShrink: 0 }}>
          <RightPanel member={member} plan={plan} overallPct={overallPct} onOpenCheckpoint={setCpModal} showCheckpoints={tab === "max"} />
        </div>
      </div>

      {/* ---- Модалка выбора способа создания цели ---- */}
      {goalMethodModal && (
        <GoalMethodModal onClose={() => setGoalMethodModal(false)}
          onManual={() => {
            setGoalMethodModal(false);
            setNewGoalDraft({ title: "", description: "", dueDate: new Date(2026, 0, 20), subgoals: [] });
            setDraftFromCatalog(false);
            setGoalDrawer({ mode: "new" });
          }}
          onCatalog={() => { setGoalMethodModal(false); setGoalCatalogModal(true); }}
          onAI={() => { setGoalMethodModal(false); setAiGoalModal(true); }} />
      )}

      {/* ---- Модалка выбора цели из каталога ---- */}
      {goalCatalogModal && (
        <GoalCatalogPickerModal member={member}
          onClose={() => setGoalCatalogModal(false)}
          onPick={(goal) => {
            setGoalCatalogModal(false);
            setNewGoalDraft(goalDraftFromCatalog(goal, plan));
            setDraftFromCatalog(true);
            setGoalDrawer({ mode: "new" });
          }} />
      )}

      {/* ---- Окно AI-помощника создания цели ---- */}
      {aiGoalModal && (
        <AIGoalAssistantModal member={member} plan={plan}
          onClose={() => setAiGoalModal(false)}
          onCreate={addAIGoal} />
      )}

      {/* ---- Дровер цели (создание/просмотр) ---- */}
      {goalDrawer && goalDrawer.mode === "new" && (
        <GoalCreateDrawer draft={newGoalDraft} setDraft={setNewGoalDraft} fromCatalog={draftFromCatalog}
          onClose={() => setGoalDrawer(null)}
          onAddSubgoal={() => setSubgoalMethodModal({ context: "draft" })}
          onEditSubgoal={(i) => setSubgoalModal({ context: "draft", editIndex: i })}
          onCreate={() => { addGoal(newGoalDraft); setGoalDrawer(null); showToast("Цель создана"); }} />
      )}
      {goalDrawer && goalDrawer.mode === "edit" && activeGoal && (
        <GoalDrawer goal={activeGoal} plan={plan} editable={!plan.goalsPublished}
          onClose={() => setGoalDrawer(null)}
          onChange={(patch) => updateGoal(activeGoal.id, patch)}
          onAddSubgoal={() => setSubgoalMethodModal({ context: "goal", goalId: activeGoal.id })}
          onOpenSubgoal={(sgId) => { setGoalDrawer(null); setSubgoalDrawer({ goalId: activeGoal.id, subgoalId: sgId }); }}
          onOpenMaterials={(sgId) => setChecklistPicker({ goalId: activeGoal.id, subgoalId: sgId })}
          onDeleteSubgoal={(sgId) => setDeleteSubgoal({ goalId: activeGoal.id, subgoalId: sgId })} />
      )}

      {/* ---- Модалка выбора способа добавления шага ---- */}
      {subgoalMethodModal && (
        <SubgoalMethodModal onClose={() => setSubgoalMethodModal(null)}
          onManual={() => {
            const ctx = subgoalMethodModal;
            setSubgoalMethodModal(null);
            setSubgoalModal(ctx);
          }} />
      )}

      {/* ---- Модалка создания/редактирования подцели ---- */}
      {subgoalModal && (
        <SubgoalCreateModal plan={plan}
          initial={subgoalModal.editIndex != null ? newGoalDraft.subgoals[subgoalModal.editIndex] : null}
          onClose={() => setSubgoalModal(null)}
          onCreate={(draft) => {
            if (subgoalModal.context === "draft") {
              if (subgoalModal.editIndex != null) {
                setNewGoalDraft(d => ({ ...d, subgoals: d.subgoals.map((s, ix) => ix === subgoalModal.editIndex ? draft : s) }));
              } else {
                setNewGoalDraft(d => ({ ...d, subgoals: [...d.subgoals, draft] }));
              }
            } else {
              addSubgoal(subgoalModal.goalId, draft);
            }
            setSubgoalModal(null);
          }} />
      )}

      {/* ---- Дровер подцели (редактирование / подтверждение-возврат / просмотр) ---- */}
      {subgoalDrawer && activeSubgoal && (
        <SubgoalDrawer plan={plan} goal={activeSubgoalGoal} subgoal={activeSubgoal}
          onClose={() => setSubgoalDrawer(null)}
          onChange={(patch) => updateSubgoal(subgoalDrawer.goalId, subgoalDrawer.subgoalId, patch)}
          onOpenChecklistPicker={() => setChecklistPicker({ goalId: subgoalDrawer.goalId, subgoalId: subgoalDrawer.subgoalId })}
          onUnlinkChecklist={(itemId) => toggleChecklistRef(subgoalDrawer.goalId, subgoalDrawer.subgoalId, itemId)}
          onAddComment={(text) => addComment(subgoalDrawer.goalId, subgoalDrawer.subgoalId, text)}
          onConfirm={() => confirmSubgoal(subgoalDrawer.goalId, subgoalDrawer.subgoalId)}
          onReturn={() => setReturnModal(subgoalDrawer)}
          onNotDone={() => markNotDone(subgoalDrawer.goalId, subgoalDrawer.subgoalId)}
          onAssessmentDecision={(decision, payload) => submitAssessmentDecision(subgoalDrawer.goalId, subgoalDrawer.subgoalId, decision, payload)} />
      )}

      {checklistPicker && (
        <ChecklistPickerModal plan={plan}
          selected={(plan.goals.find(g => g.id === checklistPicker.goalId).subgoals.find(s => s.id === checklistPicker.subgoalId).checklistRefs) || []}
          onToggle={(itemId) => toggleChecklistRef(checklistPicker.goalId, checklistPicker.subgoalId, itemId)}
          onClose={() => setChecklistPicker(null)} />
      )}

      {publishConfirm && (
        <Modal open title={null} onClose={() => setPublishConfirm(false)} size="s"
          secondary={<Button mode="secondary" onClick={() => setPublishConfirm(false)}>Нет, отменить</Button>}
          primary={<Button variant="positive" onClick={publishGoals}>Да, опубликовать</Button>}>
          <div className="sk-col sk-gap-2" style={{ alignItems: "center", textAlign: "center", padding: "8px 0" }}>
            <div style={{ width: 40, height: 40, borderRadius: "50%", background: "var(--sk-warning-secondary)", display: "flex", alignItems: "center", justifyContent: "center" }}>
              <IconAlertCircle size={20} color="var(--sk-text-warning-dark)" />
            </div>
            <div className="sk-label-2">Опубликовать цели?</div>
            <div className="sk-muted">Они станут доступны сотруднику. Возможность добавлять другие цели станет недоступна. Изменение текущих целей будет доступно только до момента старта работы с ними сотрудником.</div>
          </div>
        </Modal>
      )}

      {returnModal && (
        <ReturnCommentModal onClose={() => setReturnModal(null)}
          onSubmit={(comment) => returnSubgoal(returnModal.goalId, returnModal.subgoalId, comment)} />
      )}

      {deleteGoal && (
        <Modal open title={null} onClose={() => setDeleteGoal(null)} size="s"
          secondary={<Button mode="secondary" onClick={() => setDeleteGoal(null)}>Отменить</Button>}
          primary={<Button variant="negative" onClick={() => removeGoal(deleteGoal)}>Удалить цель</Button>}>
          <div className="sk-col sk-gap-2" style={{ alignItems: "center", textAlign: "center", padding: "8px 0" }}>
            <div className="sk-label-2">Удалить цель вместе со всеми подцелями?</div>
          </div>
        </Modal>
      )}
      {deleteSubgoal && (
        <Modal open title={null} onClose={() => setDeleteSubgoal(null)} size="s"
          secondary={<Button mode="secondary" onClick={() => setDeleteSubgoal(null)}>Отменить</Button>}
          primary={<Button variant="negative" onClick={() => removeSubgoal(deleteSubgoal.goalId, deleteSubgoal.subgoalId)}>Удалить подцель</Button>}>
          <div className="sk-col sk-gap-2" style={{ alignItems: "center", textAlign: "center", padding: "8px 0" }}>
            <div className="sk-label-2">Удалить эту подцель?</div>
          </div>
        </Modal>
      )}

      {taskModal && <ElementModal item={taskModal} onClose={() => setTaskModal(null)} />}
      {cpModal && (
        <ManagerCheckpointDrawer checkpoint={plan.checkpoints[cpModal]} viewerName={D.manager.name} employee={member}
          canEdit={plan.checkpoints[cpModal].reviewer === D.manager.name}
          isUpcoming={cpModalIsUpcoming}
          onClose={() => setCpModal(null)}
          onFinish={(patch) => finishCheckpoint(cpModal, patch)}
          onAddComment={(text) => addCheckpointComment(cpModal, text)}
          onUpdate={(patch) => updateCheckpoint(cpModal, patch)} />
      )}

      {toast && (
        <div style={{ position: "fixed", bottom: 24, left: "50%", transform: "translateX(-50%)", zIndex: 100 }}>
          <Snackbar>{toast}</Snackbar>
        </div>
      )}
    </AppShell>
  );
}

// ---------------- Строка цели в основном списке ----------------
// Карточки целей изначально свёрнуты — виден только заголовок, статус и прогресс, без
// списка шагов; шаги открываются по клику на шеврон (тот же паттерн, что у сотрудника).
function ManagerGoalRow({ goal, plan, highlighted, onOpenGoal, onOpenSubgoal, onOpenMaterials, onDeleteGoal }) {
  const { done, total, pct } = goalProgress(goal);
  const statusVal = deriveGoalStatus(goal);
  const isDone = statusVal === "done";
  const [stepsOpen, setStepsOpen] = React.useState(false);
  return (
    <div className="sk-col sk-gap-3" onClick={onOpenGoal} style={{
      cursor: "pointer", padding: "14px 16px", borderRadius: "var(--sk-radius-3)", background: "var(--sk-surface-page)",
      border: "1px solid " + (highlighted ? "var(--sk-accent)" : "var(--sk-stroke)"),
      boxShadow: highlighted ? "0 0 0 3px var(--sk-accent-secondary)" : "none",
      transition: "box-shadow .4s ease, border-color .4s ease",
    }}>
      <div className="sk-row sk-gap-3" style={{ justifyContent: "space-between", alignItems: "flex-start" }}>
        <div className="sk-col sk-gap-2" style={{ flex: 1, minWidth: 0 }}>
          <div className="sk-label-2" style={{ color: isDone ? "var(--sk-text-secondary)" : "var(--sk-text-primary)", display: "-webkit-box", WebkitLineClamp: 2, WebkitBoxOrient: "vertical", overflow: "hidden" }}>{goal.title || "Без названия"}</div>
          {!isDone && (
            <React.Fragment>
              <div className="sk-row sk-gap-2" style={{ alignItems: "center", marginTop: 4 }}>
                <ProgressBar value={pct} style={{ width: 120 }} hue="positive" />
                <span className="sk-label-4">{pct}%</span>
                <span className="sk-muted" style={{ font: "var(--sk-label-4-regular)", whiteSpace: "nowrap" }}>{done} из {total}</span>
              </div>
              <span className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>до {stripDuePrefix(goal.dueLabel) || "срок не задан"}</span>
            </React.Fragment>
          )}
        </div>
        <div className="sk-row sk-gap-2" style={{ flexShrink: 0, alignItems: "center" }} onClick={(e) => e.stopPropagation()}>
          {plan.employeeStarted && <StatusTag status={statusVal} size="m" />}
          {!plan.employeeStarted && (
            <button className="sk-link-btn" onClick={onDeleteGoal} style={{ color: "var(--sk-icon-secondary)" }} title="Удалить цель"><IconTrash size={16} /></button>
          )}
          <button className="sk-link-btn" onClick={() => setStepsOpen(o => !o)} style={{ color: "var(--sk-icon-secondary)" }}>
            {stepsOpen ? <IconChevronUp size={16} /> : <IconChevronDown size={16} />}
          </button>
        </div>
      </div>
      {stepsOpen && (
        <div className="sk-col sk-gap-3" style={{ marginTop: 4 }} onClick={(e) => e.stopPropagation()}>
          {goal.subgoals.map((sg, i) => <ManagerSubgoalRow key={sg.id} subgoal={sg} index={i} goalDueLabel={goal.dueLabel} plan={plan} onOpen={() => onOpenSubgoal(sg.id)} onOpenMaterials={() => onOpenMaterials(sg.id)} />)}
          {!goal.subgoals.length && <div className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>Подцели ещё не добавлены</div>}
        </div>
      )}
    </div>
  );
}

// ---------------- Индикатор "Полезные материалы" у шага цели (3 состояния) ----------------
// published: цель опубликована — пилюля не показывается вовсе (материалы больше нельзя менять).
// count > 0: материалы уже привязаны — некликабельный индикатор с count, без иконки добавления.
// иначе: материалов ещё нет — кликабельная пилюля-приглашение добавить (иконка книги вместо "+").
function MaterialsBadge({ count, published, onClick }) {
  if (published) return null;
  const hasItems = count > 0;
  return (
    <span className={"sk-row sk-gap-1" + (hasItems ? "" : " sk-clickable")}
      onClick={hasItems ? undefined : (e) => { e.stopPropagation(); onClick(); }} style={{
      height: 26, padding: "0 10px 0 6px", borderRadius: "var(--sk-radius-full)",
      background: hasItems ? "var(--sk-surface-secondary)" : "var(--sk-accent-secondary)",
      color: hasItems ? "var(--sk-text-secondary)" : "var(--sk-text-accent)",
      font: "var(--sk-label-4)", whiteSpace: "nowrap",
    }}>
      <IconBookOpen size={15} />{hasItems ? "Полезные материалы: " + count : "Добавить материалы"}
    </span>
  );
}

function ManagerSubgoalRow({ subgoal, index, goalDueLabel, plan, onOpen, onOpenMaterials }) {
  const isDone = subgoal.status === "done";
  const badge = NUMBER_BADGE.not_started;
  const statusIcon = STATUS_ICON[subgoal.status];
  const matCount = (subgoal.checklistRefs || []).length;
  const ownDue = stripDuePrefix(subgoal.dueLabel);
  const showOwnDue = !isDone && ownDue && ownDue !== stripDuePrefix(goalDueLabel);
  return (
    <div className="sk-row sk-gap-3" onClick={onOpen} style={{ cursor: "pointer", justifyContent: "space-between", alignItems: "center", padding: "12px 14px", border: "1px solid var(--sk-stroke)", borderRadius: "var(--sk-radius-3)", background: "var(--sk-surface-page)" }}>
      <div className="sk-row sk-gap-2" style={{ flex: 1, minWidth: 0, alignItems: "center" }}>
        <span style={{
          width: 20, height: 20, borderRadius: "50%", flexShrink: 0, background: badge.bg, color: badge.fg,
          border: badge.border, display: "flex", alignItems: "center", justifyContent: "center", font: "var(--sk-label-4)",
        }}>
          {index + 1}
        </span>
        <div className="sk-col sk-gap-1" style={{ minWidth: 0 }}>
          <div className="sk-label-3-regular" style={{ color: isDone ? "var(--sk-text-secondary)" : "var(--sk-text-primary)" }}>{subgoal.title || "Без названия"}</div>
          {showOwnDue && <div className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>{ownDue}</div>}
        </div>
      </div>
      <div className="sk-row sk-gap-2" style={{ flexShrink: 0, alignItems: "center" }}>
        {statusIcon && (
          <span title={SUBGOAL_STATUS_LABEL[subgoal.status]} style={{
            width: 20, height: 20, borderRadius: "50%", flexShrink: 0, background: statusIcon.color,
            display: "flex", alignItems: "center", justifyContent: "center",
          }}>
            <statusIcon.icon size={11} color="var(--sk-text-contrast)" />
          </span>
        )}
        <MaterialsBadge count={matCount} published={plan.goalsPublished} onClick={onOpenMaterials} />
      </div>
    </div>
  );
}

// ---------------- Плитка выбора способа (переиспользуется в модалках цели/шага) ----------------
// variant="special" — акцентный вариант для варианта "С AI-помощником": светло-фиолетовая
// подложка плитки, тёмно-фиолетовая иконка — визуально выделяет AI-сценарий среди прочих
// способов. disabled НЕ приглушает плитку через opacity — она полностью видима и читаема,
// просто не кликабельна (это не "скоро будет", а осознанно нереализованный в этой итерации
// способ). В модалке создания цели все три способа теперь кликабельны (см.
// AIGoalAssistantModal и GoalCatalogPickerModal); в модалке добавления шага "С AI-помощником"
// по-прежнему нет — это отдельный, не затронутый этой итерацией сценарий.
function MethodTile({ icon: Icon, title, variant, disabled, onClick }) {
  const special = variant === "special";
  return (
    <div
      className={disabled ? "" : "sk-clickable"}
      onClick={disabled ? undefined : onClick}
      style={{
        position: "relative",
        flex: 1,
        display: "flex",
        flexDirection: "column",
        alignItems: "flex-start",
        justifyContent: "center",
        gap: 12,
        padding: "28px 16px",
        borderRadius: "var(--sk-radius-3)",
        border: "1px solid " + (special ? "transparent" : "var(--sk-stroke)"),
        background: special ? "var(--sk-special-secondary)" : "var(--sk-surface-page)",
        cursor: disabled ? "default" : "pointer",
        transition: "border-color .12s ease, box-shadow .12s ease",
      }}
      onMouseEnter={disabled ? undefined : (e) => { e.currentTarget.style.borderColor = "var(--sk-stroke-accent)"; e.currentTarget.style.boxShadow = "var(--sk-shadow-s)"; }}
      onMouseLeave={disabled ? undefined : (e) => { e.currentTarget.style.borderColor = special ? "transparent" : "var(--sk-stroke)"; e.currentTarget.style.boxShadow = "none"; }}
    >
      <span style={{
        width: 52, height: 52, borderRadius: "var(--sk-radius-2)", flexShrink: 0,
        display: "flex", alignItems: "center", justifyContent: "center",
        background: special ? "var(--sk-surface-page)" : "var(--sk-surface-secondary)",
        color: special ? "var(--violet-violet-35)" : "var(--sk-icon-secondary)",
      }}>
        <Icon size={26} />
      </span>
      <div className="sk-label-2" style={{ textAlign: "left", color: "var(--sk-text-primary)" }}>{title}</div>
    </div>
  );
}

// ---------------- Модалка: выбор способа создания цели ----------------
function GoalMethodModal({ onClose, onManual, onCatalog, onAI }) {
  return (
    <Modal open title="Как создать цель?" onClose={onClose} size="l"
      secondary={<Button mode="secondary" onClick={onClose}>Отменить</Button>}>
      <div className="sk-row sk-gap-3" style={{ alignItems: "stretch" }}>
        <MethodTile icon={IconEdit} title="Вручную" onClick={onManual} />
        <MethodTile icon={IconLayers} title="Из каталога целей" onClick={onCatalog} />
        <MethodTile icon={IconSparkles} title="С AI-помощником" variant="special" onClick={onAI} />
      </div>
    </Modal>
  );
}

// ---------------- Модалка: выбор цели из каталога ----------------
// Список HR-каталога целей (см. hr/goals-catalog.html) с поиском и фильтром по категории.
// Клик по цели не создаёт её сразу — вместо этого открывается тот же дровер, что и у
// способа "Вручную" (GoalCreateDrawer), но уже заполненный данными из каталога: руководитель
// может поправить срок, описание и шаги под конкретного сотрудника, прежде чем реально
// создать цель, а не соглашаться с шаблоном вслепую.
// Вместо отдельного заголовка-группировки "Подходит для «должность»" — фильтр "Должность"
// заранее выставлен на должность сотрудника, чей план сейчас открыт, а панель фильтров сразу
// раскрыта, так что это read as применённый фильтр, а не браузинг двух списков. Категория —
// такой же чип внутри фильтров, а не отдельная строка пилюль (см. отзыв о навигации по каталогу).
function GoalCatalogPickerModal({ member, onClose, onPick }) {
  const [q, setQ] = React.useState("");
  const [filters, setFilters] = React.useState({ category: "", position: member.position, level: "" });
  const [filtersOpen, setFiltersOpen] = React.useState(true);
  const catalogActive = (D.goalCatalog || []).filter(g => !g.archived);
  const categories = [...new Set(catalogActive.map(g => g.category).filter(Boolean))];
  const positions = [...new Set(catalogActive.flatMap(g => g.positions || []))];
  const toolbarFilterCount = (filters.category ? 1 : 0) + (filters.position ? 1 : 0) + (filters.level ? 1 : 0);
  const needle = q.trim().toLowerCase();

  const list = catalogActive
    .filter(g => {
      if (needle && !(g.title.toLowerCase().includes(needle)
        || g.category.toLowerCase().includes(needle)
        || (g.positions || []).some(p => p.toLowerCase().includes(needle)))) return false;
      if (filters.category && g.category !== filters.category) return false;
      if (filters.position && !(g.positions || []).includes(filters.position)) return false;
      if (filters.level && g.level !== filters.level) return false;
      return true;
    })
    // Цели под должность сотрудника — выше остальных, даже если фильтр по должности снят
    // (например, руководитель специально смотрит на весь каталог целиком).
    .sort((a, b) => ((a.positions || []).includes(member.position) ? 0 : 1) - ((b.positions || []).includes(member.position) ? 0 : 1));

  return (
    <Modal open title="Выберите цель из каталога" onClose={onClose} size="l" maxHeight="calc(100vh - 64px)"
      secondary={<Button mode="secondary" onClick={onClose}>Отменить</Button>}>
      <div className="sk-col sk-gap-3">
        <div className="sk-row sk-gap-2" style={{ flexWrap: "wrap", alignItems: "center" }}>
          <Input size="s" icon={<IconSearch size={18} />} placeholder="Поиск по названию, категории, должности"
            value={q} onChange={(e) => setQ(e.target.value || "")} style={{ flex: 1, minWidth: 220 }} />
          <Button mode="secondary" icon={<IconFilter size={16} />} onClick={() => setFiltersOpen(o => !o)}
            style={{ background: "var(--sk-surface-page)", border: toolbarFilterCount ? "1px solid var(--sk-stroke-accent)" : "1px solid var(--sk-stroke)" }}>
            <span className="sk-row sk-gap-1" style={{ alignItems: "center" }}>
              Фильтры{toolbarFilterCount ? " · " + toolbarFilterCount : ""}
              {toolbarFilterCount > 0 && (
                <span onClick={(e) => { e.stopPropagation(); setFilters({ category: "", position: "", level: "" }); }}
                  style={{ display: "inline-flex", opacity: 0.6, marginLeft: 2 }}>
                  <IconX size={14} />
                </span>
              )}
            </span>
          </Button>
        </div>
        {filtersOpen && (
          <div className="sk-row sk-gap-2" style={{ flexWrap: "wrap" }}>
            <FilterChip label="Категория" options={categories.map(v => ({ value: v, label: v }))}

// Чип одиночного фильтра (Должность/Уровень — один выбор, не массив) — тот же паттерн

function FilterChip({ label, options, value, onChange }) {
  const [open, setOpen] = React.useState(false);
  const ref = React.useRef(null);
  React.useEffect(() => {
    if (!open) return;
    const close = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown", close);
    return () => document.removeEventListener("mousedown", close);
  }, [open]);
  const selected = options.find((o) => o.value === value);
  return (
    <div ref={ref} style={{ position: "relative" }}>
      <button type="button" onClick={() => setOpen((o) => !o)} className="sk-clickable" style={{
        display: "inline-flex", alignItems: "center", gap: 6, height: 36, padding: "0 12px",

      }}>
        {label}{selected ? ": " + selected.label : ""}
        {value ? (
          <span onClick={(e) => { e.stopPropagation(); onChange(""); }} style={{ display: "inline-flex", opacity: 0.55 }}>
            <IconX size={13} />
          </span>
        ) : (
          <IconChevronDown size={14} style={{ opacity: 0.55 }} />
        )}
      </button>
      {open && (
        <div style={{
          position: "absolute", top: "calc(100% + 4px)", left: 0, zIndex: 20, minWidth: 200, maxHeight: 300, overflowY: "auto",
          background: "var(--sk-surface-page)", borderRadius: "var(--sk-radius-2)", boxShadow: "var(--sk-shadow-m)", padding: 6,
        }}>
          {options.map((o) => (
            <button key={o.value} onClick={() => { onChange(o.value === value ? "" : o.value); setOpen(false); }} style={{
              display: "block", width: "100%", textAlign: "left", padding: "8px 10px", borderRadius: "var(--sk-radius-2)",
              border: "none", cursor: "pointer", font: "var(--sk-label-3-regular)",

const AI_DRAFT_RESULT = {

function parseRuShortDate(str) {
  const m = /^(\d{2})\.(\d{2})\.(\d{2})$/.exec(str || "");
  if (!m) return new Date();
  return new Date(2000 + parseInt(m[3], 10), parseInt(m[2], 10) - 1, parseInt(m[1], 10));
}
function addDays(date, days) {
  const d = new Date(date);
  d.setDate(d.getDate() + days);
  return d;
}
function minDate(a, b) { return a.getTime() < b.getTime() ? a : b; }
// Черновик из каталога целей — та же форма, что и у ручного создания (см. GoalCreateDrawer),
// просто уже заполненная. dueDays в каталоге — это смещение в днях от даты старта адаптации
// (а не от сегодня и не от даты предыдущего шага), поэтому шаги сохраняют относительный
// порядок сроков, заданный в каталоге; на выходе всё ограничено датой окончания плана —
// у каталожных целей свой типовой срок, который не обязан совпадать с длительностью
// адаптации конкретного сотрудника. Проверяющего "Наставник" сопоставляем с первым
// помощником сотрудника (если он назначен), а "Руководитель" и всё остальное — с текущим
// руководителем; дальше это можно поправить в дровере подцели, как и любого проверяющего.
function goalDraftFromCatalog(goal, plan) {
  const start = parseRuShortDate(plan.dateStart);
  const planEnd = parseRuShortDate(plan.dateEnd);
  const dueDate = minDate(addDays(start, goal.dueDays || 30), planEnd);
  return {
    title: goal.title,
    description: goal.description || "",
    dueDate,
    subgoals: (goal.subgoals || []).map(sg => ({
      title: sg.title,
      description: sg.description || "",
      dueDate: minDate(addDays(start, sg.dueDays || goal.dueDays || 30), dueDate),
      reviewer: sg.reviewer === "Наставник" && D.assistants.length ? D.assistants[0].name : D.manager.name,
      checklistRefs: [],
      assessmentChecklist: null,
    })),
  };
}

            трёх пунктов и скрываются, как только файл уже прикреплён, чтобы не перегружать
            экран (см. отзыв про перегруженность). */}
        {!demo.file && (
          <div className="sk-col sk-gap-2">
            <span className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>Также можно приложить:</span>
            <div className="sk-row sk-gap-2" style={{ flexWrap: "wrap" }}>
              {AI_UPLOAD_SUGGESTIONS.map((s) => (
                <Tooltip key={s.key} content={"Например: " + s.hint}>
                  <button type="button" onClick={() => pickFileSuggestion(s)} className="sk-clickable" style={{
                    display: "flex", alignItems: "center", gap: 6, padding: "6px 12px 6px 8px",
                    borderRadius: "var(--sk-radius-full)", border: "1px solid var(--sk-stroke)",
                    background: "var(--sk-surface-page)", font: "var(--sk-label-4-regular)", color: "var(--sk-text-secondary)",
                  }}>
                    <s.icon size={13} color="var(--sk-icon-secondary)" />{s.label}
                  </button>
                </Tooltip>
              ))}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// ---------------- Состояние "AI формирует цель" — короткая, динамичная имитация анализа ----------------
function AIGeneratingStep({ onDone }) {
  const [stageIdx, setStageIdx] = React.useState(0);
  React.useEffect(() => {
    const isLast = stageIdx >= AI_LOADING_STAGES.length - 1;
    const t = window.setTimeout(() => (isLast ? onDone() : setStageIdx((i) => i + 1)), 750);
    return () => window.clearTimeout(t);
  }, [stageIdx]);
  return (
    <div className="sk-col sk-gap-4" style={{ alignItems: "center", textAlign: "center", padding: "40px 16px" }}>
      <Loader size={40} color="var(--sk-icon-special)" />
      <div className="sk-col sk-gap-1">
        <div className="sk-label-2">AI формирует цель…</div>
        <div className="sk-muted">{AI_LOADING_STAGES[stageIdx]}</div>
      </div>
      <div className="sk-row sk-gap-2">
        {AI_LOADING_STAGES.map((s, i) => (
          <span key={i} style={{ width: 6, height: 6, borderRadius: "50%", background: i <= stageIdx ? "var(--sk-icon-special)" : "var(--sk-stroke)" }} />
        ))}
      </div>
    </div>
  );
}

// ---------------- Состояние 2: черновик цели — редактируется прямо в карточке, без
// перехода в отдельный редактор (см. ТЗ п.19) ----------------
function AIDraftStep({ member, plan, draft, setDraft }) {
  function updateStep(i, val) { setDraft((d) => ({ ...d, steps: d.steps.map((s, ix) => (ix === i ? val : s)) })); }
  function removeStep(i) { setDraft((d) => ({ ...d, steps: d.steps.filter((_, ix) => ix !== i) })); }
  function addStep() { setDraft((d) => ({ ...d, steps: [...d.steps, ""] })); }
  return (
    <div className="sk-col sk-gap-5">
      {/* Тёплое подтверждение вместо сухого "AI структурировал..." — сразу сообщает главное:
          результат готов и его можно смело редактировать (см. отзыв про эмоциональность).
          Та же AIBanner, что и на шаге ожиданий — оба AI-сообщения в окне выглядят одинаково. */}
      <AIBanner icon={<IconCheck size={18} color="var(--sk-icon-special)" />}>
        <div className="sk-label-3">Готово! Проверьте результат и скорректируйте перед добавлением в план</div>
      </AIBanner>

      <Input label="Цель" required value={draft.title} onChange={(e) => setDraft((d) => ({ ...d, title: e.target.value || "" }))} />
      <Textarea label="Описание цели" rows={3} maxLength={1000} showCount value={draft.description}
        onChange={(e) => setDraft((d) => ({ ...d, description: e.target.value || "" }))} />

      <div className="sk-col sk-gap-2">
        <div className="sk-label-3">Шаги для достижения цели</div>
        {/* Input внутри плашки-шага рисует свою собственную обводку (inset box-shadow) —
            получалась обводка в обводке. Гасим внутреннюю, оставляем только внешнюю
            (у плашки), фокус всё равно виден по подсветке самого текста при клике. */}
        <style>{".ai-step-row > label > span:first-of-type { box-shadow: none !important; background: transparent !important; }"}</style>
        <div className="sk-col sk-gap-2">
          {draft.steps.map((s, i) => {
            // Тот же нейтральный кружок-номер, что и в дровере цели (см. NUMBER_BADGE), внутри
            // общей плашки-карточки — там кружок и текст живут в одной обводке, поэтому кружок
            // читается как элемент внутри неё, а не отдельно висящий рядом с полем ввода.
            const badge = NUMBER_BADGE.not_started;
            return (
              <div key={i} className="ai-step-row sk-row sk-gap-2" style={{
                alignItems: "center", padding: "10px 12px", border: "1px solid var(--sk-stroke)",
                borderRadius: "var(--sk-radius-3)", background: "var(--sk-surface-page)",
              }}>
                <span style={{
                  width: 20, height: 20, borderRadius: "50%", flexShrink: 0, display: "flex", alignItems: "center", justifyContent: "center",
                  background: badge.bg, color: badge.fg, border: badge.border, font: "var(--sk-label-4)",
                }}>{i + 1}</span>
                <Input value={s} onChange={(e) => updateStep(i, e.target.value || "")} style={{ flex: 1 }} />
                <button className="sk-link-btn" onClick={() => removeStep(i)}><IconTrash size={15} color="var(--sk-icon-secondary)" /></button>
              </div>
            );
          })}
        </div>
        <button className="sk-link-btn sk-label-3-regular" onClick={addStep} style={{ alignSelf: "flex-start", color: "var(--sk-text-secondary)" }}>
          <span className="sk-row sk-gap-1"><IconPlusSm size={16} />Добавить шаг</span>
        </button>
      </div>

      <DatePicker label="Срок" required value={draft.dueDate}
        onChange={(date) => setDraft((d) => ({ ...d, dueDate: date }))}
        helper="По умолчанию — срок окончания плана адаптации." />
    </div>
  );
}

// ---------------- Оркестратор: input → loading → draft → success ----------------
function AIGoalAssistantModal({ member, plan, onClose, onCreate }) {
  const [step, setStep] = React.useState("input"); // input | loading | draft | success
  const [text, setText] = React.useState("");
  const [demo, setDemo] = React.useState({ voice: false, file: false, image: false, fileMeta: null });
  const [draft, setDraft] = React.useState(null);

  function toggleDemo(key) {
    setDemo((d) => (key === "file" ? { ...d, file: !d.file, fileMeta: null } : { ...d, [key]: !d[key] }));
  }
  // Клик по подсказке ("Описание вакансии" и т.п.) прикрепляет демо-файл с этим названием;
  // повторный клик по уже выбранной подсказке снимает вложение (см. AI_UPLOAD_SUGGESTIONS).
  function pickFileSuggestion(s) {
    setDemo((d) => (d.file && d.fileMeta && d.fileMeta.key === s.key)
      ? { ...d, file: false, fileMeta: null }
      : { ...d, file: true, fileMeta: s });
  }

  function buildDraft() {
    return { title: AI_DRAFT_RESULT.title, description: AI_DRAFT_RESULT.description, steps: [...AI_DRAFT_RESULT.steps], dueDate: parseRuShortDate(plan.dateEnd) };
  }

  const hasSource = text.trim().length > 0 || demo.voice || demo.file || demo.image;

  let footerProps = {};
  if (step === "input") {
    // "Сформировать цель" — чёрная (нейтральная primary-кнопка ДС), а не акцентная: это
    // единственная кнопка на экране, поэтому не нуждается в дополнительном выделении цветом.
    footerProps = {
      secondary: <Button mode="secondary" onClick={onClose}>Отменить</Button>,
      primary: <Button disabled={!hasSource} icon={<IconSparkles size={16} />} onClick={() => setStep("loading")}>Сформировать цель</Button>,
    };
  } else if (step === "draft") {
    const draftValid = draft.title.trim().length > 0;
    footerProps = {
      secondary: (
        <div className="sk-row sk-gap-2">
          <Button mode="tertiary" onClick={onClose}>Отмена</Button>
          <Button mode="secondary" icon={<IconRepeat size={15} />} onClick={() => setStep("loading")}>Сформировать заново</Button>
        </div>
      ),
      // Чёрная, как и "Сформировать цель" на первом шаге — целевые кнопки сценария
      // нейтральные, фиолетовый остаётся только за репликой AI (см. AIBanner).
      primary: <Button disabled={!draftValid} onClick={() => { onCreate(draft); setStep("success"); }}>Добавить в план</Button>,
    };
  } else if (step === "success") {
    footerProps = { primary: <Button onClick={onClose} style={{ width: "100%" }}>Вернуться к плану адаптации</Button> };
  }

  const flowIndex = step === "input" ? 0 : step === "loading" ? 1 : 2;
  // Таймлайн — прямо в шапке модалки вместо текстового заголовка: он и так показывает,
  // на каком шаге сценария руководитель находится, отдельный заголовок дублировал бы это.
  const modalTitle = step === "success" ? null : <AIFlowStepper activeIndex={flowIndex} />;

  return (
    <Modal open title={modalTitle} onClose={onClose} size="l" {...footerProps}>
      <div className="sk-col sk-gap-4">
        {step === "input" && (
          <AIExpectationsStep member={member} plan={plan} text={text} setText={setText} demo={demo} toggleDemo={toggleDemo} pickFileSuggestion={pickFileSuggestion} />
        )}
        {step === "loading" && <AIGeneratingStep onDone={() => { setDraft(buildDraft()); setStep("draft"); }} />}
        {step === "draft" && draft && <AIDraftStep member={member} plan={plan} draft={draft} setDraft={setDraft} />}
        {step === "success" && (
          <div className="sk-col sk-gap-2" style={{ alignItems: "center", textAlign: "center", padding: "24px 0" }}>
            <div style={{ width: 44, height: 44, borderRadius: "50%", background: "var(--sk-positive-secondary)", display: "flex", alignItems: "center", justifyContent: "center" }}>
              <IconCheck size={20} color="var(--sk-text-positive)" />
            </div>
            <div className="sk-label-2">Цель добавлена в план адаптации</div>
            <div className="sk-muted">Цель и шаги для её достижения сохранены для {member.name.split(" ")[0]}.</div>
          </div>
        )}
      </div>
    </Modal>
  );
}

// ---------------- Модалка: создание подцели ----------------

function StepMaterialsPicker({ plan, selected, onToggle }) {

  const allItems = plan.stages.flatMap(s => s.items.filter(i => i.kind !== "checkpoint").map(i => ({ item: i, stage: s })));
  const list = q.trim() ? allItems.filter(x => x.item.title.toLowerCase().includes(q.trim().toLowerCase())) : allItems;
  const selectedItems = selected.map(id => allItems.find(x => x.item.id === id)).filter(Boolean);

  return (
    <div className="sk-col sk-gap-2">
      <span className="sk-label-3" style={{ color: "var(--sk-text-primary)" }}>Полезные материалы</span>

        <div className="sk-col sk-gap-2">

            <div key={item.id} className="sk-row" style={{ justifyContent: "space-between", padding: 10, background: "var(--sk-surface-secondary)", borderRadius: "var(--sk-radius-2)" }}>

                <div className="sk-label-4">{item.title}</div>
                <div className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>{ELEMENT_LABEL[item.kind]} · Этап «{stage.title}»</div>

            </div>
          ))}
        </div>
      ) : (
        <span className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>Материалы помогут сотруднику разобраться, что нужно сделать</span>

        style={{ alignSelf: "flex-start", color: "var(--sk-text-accent)" }}>
        <span className="sk-row sk-gap-1"><IconPlusSm size={16} />Добавить</span>
      </button>

      {open && (
        <Modal open title="Полезные материалы" onClose={() => setOpen(false)} size="m"
          secondary={<Button mode="secondary" onClick={() => setOpen(false)}>Отменить</Button>}
          primary={<Button onClick={() => setOpen(false)}>Готово</Button>}

          </div>
        </Modal>
      )}
